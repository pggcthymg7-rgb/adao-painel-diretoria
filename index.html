@media (min-width:64rem){:root{--gut:3rem;--top:4.25rem}}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:100%;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 1.0625rem/1.5 var(--sans);
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;caret-color:var(--red-ink);
  min-height:100dvh;padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom))}
@media (min-width:64rem){body{padding-bottom:0}}
body:has(dialog[open]){overflow:hidden}
::selection{background:var(--red);color:#fff}
*{scrollbar-width:thin;scrollbar-color:var(--s3) transparent}
button,a,summary,input,select,textarea{touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
img,video{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:1rem;top:-4rem;z-index:100;background:var(--ink);color:var(--bg);padding:.75rem 1rem;border-radius:6px}
.skip:focus{top:1rem}
svg.i{width:1.5rem;height:1.5rem;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.btn svg.i,.chip svg.i{stroke-width:2}

/* ---------- barra superior ---------- */
.top{position:fixed;inset:0 0 auto 0;height:calc(var(--top) + env(safe-area-inset-top));padding:env(safe-area-inset-top) var(--gut) 0;
  display:flex;align-items:center;gap:2rem;z-index:30;color:#fff;
  background:linear-gradient(180deg,rgba(0,0,0,.7),transparent);transition:background-color var(--d2) var(--ease),color var(--d2) var(--ease)}
.top.solid{background:color-mix(in srgb,var(--bg) 92%,transparent);color:var(--ink);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top>a:first-child{display:flex;align-items:center;min-height:2.75rem}
.logo{display:block;height:1.5rem;width:auto}
@media (prefers-color-scheme:light){.top.solid .logo{filter:invert(1)}}
.nav{display:none;gap:.125rem;flex:1}
.nav a{position:relative;display:flex;align-items:center;min-height:2.75rem;padding:0 .625rem;border-radius:6px;font-size:.9375rem;font-weight:500;
  color:inherit;opacity:.78;text-decoration:none;transition:opacity var(--d1)}
.nav a[aria-current="page"]{opacity:1;font-weight:600}
.nav a[aria-current="page"]::after{content:"";position:absolute;left:.625rem;right:.625rem;bottom:.25rem;height:2px;background:var(--red-ink);border-radius:2px}
@media (hover:hover){.nav a:hover{opacity:1}}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:2.75rem;padding:0 1.25rem;border-radius:6px;text-decoration:none;
  font-weight:600;font-size:1rem;letter-spacing:.01em;transition:transform var(--d1) var(--spring),background-color var(--d2) var(--ease),opacity var(--d1)}
.btn:active{transform:scale(.96)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-red{background:var(--red);color:var(--on-red)}
.btn-gray{background:var(--s3);color:var(--ink)}
.btn-ghost{background:color-mix(in srgb,#000 45%,transparent);color:#fff;border:1px solid rgba(255,255,255,.5)}
.btn-sm{min-height:2.75rem;padding:0 1rem;font-size:.9375rem}
@media (hover:hover){.btn-red:hover{background-color:var(--red-hover)}.btn-gray:hover{background-color:var(--line)}.btn-ghost:hover{background-color:rgba(255,255,255,.18)}}
.btn-extra .t{display:none}
.btn-extra{min-width:2.75rem;padding:0 .75rem}
@media (min-width:64rem){.nav{display:flex}.btn-extra .t{display:inline}.btn-extra{padding:0 1.25rem}.spacer{display:none}}

/* ---------- barra de abas (iPhone) ---------- */
.tabbar{position:fixed;inset:auto 0 0 0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);
  height:calc(var(--tab) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
@media (min-width:64rem){.tabbar{display:none}}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.125rem;min-height:2.75rem;
  font-size:.75rem;font-weight:500;color:var(--ink3);text-decoration:none;position:relative;transition:color var(--d1)}
.tabbar a[aria-current="page"]{color:var(--ink)}
.tabbar a[aria-current="page"] svg{stroke:var(--red-ink)}
.tabbar svg{transition:transform var(--d1) var(--spring)}
.tabbar a:active svg{transform:scale(.9)}
.badge{position:absolute;top:.25rem;left:calc(50% + .625rem);min-width:1.125rem;height:1.125rem;padding:0 .3rem;border-radius:1rem;background:var(--red);
  color:#fff;font-size:.75rem;line-height:1.125rem;font-weight:600;text-align:center}

/* ---------- vistas ---------- */
main{min-height:100dvh;outline:none}
.view.anim{animation:enter var(--d1) var(--ease) both}
@keyframes enter{from{opacity:0}}
.page{padding:calc(var(--top) + 1.75rem + env(safe-area-inset-top)) var(--gut) 3rem;max-width:80rem;margin-inline:auto}
.page-head{margin-bottom:1.5rem}
.page-head h1{font:600 clamp(2rem,6vw,3rem)/1.08 var(--display);letter-spacing:-.015em;text-wrap:balance}
.page-head p{color:var(--ink2);max-width:40rem;margin-top:.5rem;text-wrap:pretty}
.plain{padding:calc(var(--top) + 2.5rem + env(safe-area-inset-top)) var(--gut) 3rem;max-width:44rem}
.plain h1{font:600 clamp(2rem,6vw,3rem)/1.1 var(--display);margin-bottom:1rem;text-wrap:balance}
.list{display:grid;gap:.5rem;margin-top:1.5rem}
.list a{display:flex;align-items:center;gap:1rem;min-height:3.5rem;padding:.5rem 1rem;border-radius:12px;background:var(--s2);color:var(--ink);text-decoration:none;font-weight:500;transition:background-color var(--d1),transform var(--d1) var(--spring)}
.list a:active{transform:scale(.98)}
@media (hover:hover){.list a:hover{background:var(--s3)}}
.sim{display:inline-flex;align-items:center;gap:.375rem;min-height:1.75rem;padding:0 .625rem;border-radius:6px;background:var(--s3);color:var(--ink);font-size:.8125rem;font-weight:600}
.sim svg{width:1rem;height:1rem}
.panel{background:linear-gradient(149deg,var(--s2),var(--s1));border-radius:16px;padding:1.25rem}
@media (min-width:64rem){.panel{padding:1.5rem}}
.panel h2{font:600 1.375rem/1.2 var(--display);margin-bottom:.75rem;text-wrap:balance}
.panel h3{font:600 1.0625rem/1.3 var(--sans);margin:1rem 0 .375rem}
.muted{color:var(--ink3)}
.cols{display:grid;gap:1.25rem}
@media (min-width:64rem){.cols.c2{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}}

/* ---------- destaque ---------- */
.hero{position:relative;min-height:min(34rem,72svh);display:flex;align-items:flex-end;padding:calc(var(--top) + 2rem + env(safe-area-inset-top)) var(--gut) 2rem;color:#fff;overflow:hidden;isolation:isolate}
.hero-bg{position:absolute;inset:0;display:grid;grid-template-columns:1fr;z-index:-2;background:#000}
.hero-bg img{width:100%;height:100%;object-fit:cover;filter:brightness(.62) saturate(1.05)}
.hero-bg img:nth-child(n+2){display:none}
@media (min-width:64rem){.hero{min-height:min(42rem,78vh)}.hero-bg{grid-template-columns:repeat(3,1fr)}.hero-bg img:nth-child(n+2){display:block}}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(0deg,rgba(0,0,0,.94) 0%,rgba(0,0,0,.55) 32%,transparent 60%),linear-gradient(90deg,rgba(0,0,0,.8) 0%,rgba(0,0,0,.3) 60%,transparent 100%),linear-gradient(180deg,rgba(0,0,0,.55),transparent 28%)}
.hero-copy{max-width:34rem;position:relative}
.hero h1{font:600 clamp(2.5rem,9vw,4.5rem)/1.02 var(--display);letter-spacing:-.02em;margin-bottom:.75rem;text-wrap:balance}
.hero p{font-size:1.0625rem;color:rgba(255,255,255,.88);margin-bottom:1.25rem;max-width:30rem;text-wrap:pretty}
.hero .cta{display:flex;flex-wrap:wrap;gap:.75rem;margin-bottom:1.25rem}
.hero .cta .btn{min-height:3rem}
.prog{display:flex;align-items:center;gap:.75rem;font-size:.875rem;color:rgba(255,255,255,.85)}
.prog .bar{flex:1;max-width:14rem;height:4px;border-radius:4px;background:rgba(255,255,255,.28);overflow:hidden}
.prog .bar i{display:block;height:100%;width:var(--p,0%);background:var(--red-ink);border-radius:4px;transition:width var(--d3) var(--ease)}

/* ---------- fileiras ---------- */
.row{margin-top:1.75rem;position:relative}
.row-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 var(--gut);margin-bottom:.75rem}
.row-head h2{font:600 1.375rem/1.2 var(--display);text-wrap:balance}
.row-head span{font-size:.875rem;color:var(--ink3)}
.track{display:flex;gap:.75rem;overflow-x:auto;scroll-snap-type:x proximity;padding:.25rem var(--gut) 1rem;scroll-padding-inline:var(--gut);scrollbar-width:none;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.card{flex:none;width:clamp(9.5rem,42vw,11.5rem);scroll-snap-align:start;text-align:left;border-radius:12px;display:block;color:var(--ink);text-decoration:none}
@media (min-width:64rem){.card{width:13.5rem}}
.poster{display:block;position:relative;aspect-ratio:4/5;border-radius:12px;overflow:hidden;background:var(--s2);transition:transform var(--d1) var(--ease),filter var(--d1) var(--ease)}
.poster img{width:100%;height:100%;object-fit:cover;outline:1px solid var(--outline);outline-offset:-1px}
.poster::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.72),transparent 45%);pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:.25rem;min-height:1.5rem;padding:0 .5rem;border-radius:4px;font-size:.75rem;font-weight:600;background:var(--s3);color:var(--ink);white-space:nowrap}
.chip svg{width:.875rem;height:.875rem}
.poster .chip{position:absolute;z-index:2;left:.5rem;top:.5rem;background:rgba(0,0,0,.72);color:#fff}
.poster .chip.ok{color:#5FD38D}.poster .chip.warn{color:#E8B64C}
.chip.ok{color:var(--ok)}.chip.warn{color:var(--warn)}
.poster .fmt{position:absolute;z-index:2;right:.5rem;top:.5rem;padding:.2rem .5rem;border-radius:999px;background:rgba(0,0,0,.72);color:#fff;font-size:.6875rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.poster .when{position:absolute;z-index:2;left:.625rem;bottom:.5rem;font-size:.8125rem;font-weight:600;color:#fff;letter-spacing:.02em}
.card .ttl{display:block;font:600 1rem/1.3 var(--sans);margin-top:.5rem;text-wrap:balance}
.card .meta{display:block;font-size:.8125rem;color:var(--ink3)}
.card:active .poster{transform:scale(.96)}
@media (hover:hover) and (pointer:fine){.card:hover .poster{transform:scale(1.045);filter:brightness(1.08)}.card:active .poster{transform:scale(1.01)}}
.card.done .poster img{filter:saturate(.7) brightness(.85)}
.rank .card{margin-left:3.25rem;position:relative}
.rank .card:first-child{margin-left:3.75rem}
.rank .n{position:absolute;left:-3.25rem;bottom:3.4rem;font:800 6.5rem/.8 var(--display);color:transparent;-webkit-text-stroke:2px var(--ink3);pointer-events:none;letter-spacing:-.04em}
@media (min-width:64rem){.rank .n{font-size:7.5rem}}
.arrow{display:none}
@media (hover:hover) and (pointer:fine){
  .arrow{display:grid;place-items:center;position:absolute;top:1.9rem;bottom:2.75rem;width:3rem;z-index:5;color:#fff;opacity:0;transition:opacity var(--d2) var(--ease);background:linear-gradient(90deg,rgba(0,0,0,.65),transparent)}
  .arrow.r{right:0;background:linear-gradient(270deg,rgba(0,0,0,.65),transparent)}.arrow.l{left:0}
  .row:hover .arrow,.row:focus-within .arrow{opacity:1}
  .arrow svg{width:2rem;height:2rem;transition:transform var(--d1) var(--spring)}.arrow:hover svg{transform:scale(1.25)}
}
.empty{margin:0 var(--gut) 1rem;padding:1.25rem;border-radius:12px;background:linear-gradient(149deg,var(--s2),var(--s1));color:var(--ink2);max-width:36rem;display:flex;gap:1rem;align-items:center}
.empty svg{color:var(--ink3)}
.empty b{display:block;color:var(--ink);font-weight:600}
.foot{padding:2.5rem var(--gut) 3rem;color:var(--ink3);font-size:.8125rem;max-width:44rem}
.xposter{display:flex;flex-direction:column;justify-content:flex-end;gap:.25rem;padding:.75rem;aspect-ratio:4/5;border-radius:12px;background:linear-gradient(149deg,#192247,#210e17);color:#fff;position:relative;overflow:hidden}
.xposter b{font:600 1.25rem/1.15 var(--display)}
.xposter small{font-size:.8125rem;opacity:.85;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.xposter .chip{position:absolute;left:.5rem;top:.5rem;background:rgba(0,0,0,.72);color:#fff}

/* ---------- controles ---------- */
.seg{display:inline-flex;flex-wrap:wrap;gap:.375rem}
.seg label{position:relative;display:flex}
.seg input{position:absolute;inset:0;z-index:1;opacity:0;cursor:pointer;margin:0;width:100%;height:100%}
.seg span{display:inline-flex;align-items:center;gap:.5rem;min-height:2.75rem;padding:0 1rem;border-radius:6px;background:var(--s3);color:var(--ink);font-weight:500;font-size:.9375rem;
  transition:background-color var(--d1),color var(--d1),transform var(--d1) var(--spring)}
.seg input:checked+span{background:var(--ink);color:var(--bg);font-weight:600}
.seg input:focus-visible+span{outline:2px solid var(--ink);outline-offset:3px}
.seg label:active span{transform:scale(.96)}
@media (hover:hover){.seg input:not(:checked)+span:hover{background-color:var(--line)}}
.field{margin-top:1.25rem}
.field>label,.field>.lab{display:block;font-weight:600;margin-bottom:.375rem}
.input,.field textarea{width:100%;min-height:2.75rem;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:.625rem .75rem;font:inherit;line-height:1.45;transition:border-color var(--d1)}
.field textarea{min-height:6rem;resize:vertical}
.input::placeholder,.field textarea::placeholder{color:var(--ink3)}
.input:focus-visible,.field textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-color:var(--ink)}
.field.need .input,.field.need textarea{border-color:var(--red-ink);animation:nudge var(--d3) var(--ease)}
@keyframes nudge{20%{transform:translateX(-5px)}50%{transform:translateX(4px)}80%{transform:translateX(-2px)}}
.hint{font-size:.875rem;color:var(--ink3);margin-top:.375rem;min-height:1.25rem}
.field.need .hint{color:var(--red-ink)}
.steps{display:grid;gap:.5rem;margin-top:.75rem}
.step{display:flex;align-items:center;gap:.625rem;color:var(--ink3);font-size:.9375rem}
.step .dot{width:1.5rem;height:1.5rem;border-radius:50%;display:grid;place-items:center;background:var(--s3);flex:none}
.step .dot svg{width:.875rem;height:.875rem;stroke-width:2.4}
.step.on{color:var(--ink);font-weight:600}.step.on .dot{background:var(--ink);color:var(--bg)}
.step.done{color:var(--ink2)}.step.done .dot{background:var(--s3);color:var(--ok)}
.pedido{padding:1rem;border-radius:12px;background:var(--s2);margin-top:.75rem}
.pedido b{display:block;font-weight:600}

/* ---------- leitura (markdown) ---------- */
.read{max-width:44rem;margin-inline:auto;padding:calc(var(--top) + 1.5rem + env(safe-area-inset-top)) var(--gut) 4rem}
.back{display:inline-flex;align-items:center;gap:.375rem;min-height:2.75rem;color:var(--ink2);text-decoration:none;font-weight:500;margin-bottom:.5rem}
@media (hover:hover){.back:hover{color:var(--ink)}}
.concl{padding:1rem 1.25rem;border-radius:12px;background:linear-gradient(149deg,var(--s2),var(--s1));margin:1rem 0 1.5rem}
.concl b{display:block;margin-bottom:.25rem}
.md{font-size:1.0625rem;line-height:1.7;overflow-wrap:break-word}
.md h2{font:600 1.75rem/1.2 var(--display);margin:2.25rem 0 .75rem;text-wrap:balance}
.md h3{font:600 1.25rem/1.3 var(--sans);margin:1.75rem 0 .5rem}
.md h4{font:600 1.0625rem/1.4 var(--sans);margin:1.25rem 0 .375rem;color:var(--ink2)}
.md p,.md ul,.md ol,.md blockquote,.md pre,.md .tbl{margin:.75rem 0}
.md p{text-wrap:pretty;color:var(--ink2)}
.md strong{color:var(--ink);font-weight:600}
.md ul,.md ol{padding-left:1.4rem;color:var(--ink2)}.md li{margin:.25rem 0}
.md blockquote{padding:.25rem 0 .25rem 1rem;border-left:1px solid var(--ink3);color:var(--ink2)}
.md hr{border:0;border-top:1px solid var(--line);margin:2rem 0}
.md code{font:500 .9em ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--s3);padding:.1em .35em;border-radius:4px}
.md pre{overflow-x:auto;background:var(--s2);padding:1rem;border-radius:8px;font-size:.875rem}
.md pre code{background:none;padding:0}
.md a{color:var(--red-ink);text-underline-offset:3px}
.tbl{overflow-x:auto;border-radius:8px;border:1px solid var(--line)}
.tbl table{border-collapse:collapse;width:100%;font-size:.9375rem;line-height:1.4}
.tbl th,.tbl td{padding:.5rem .75rem;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;min-width:6rem}
.tbl th{font-weight:600;color:var(--ink);background:var(--s2)}
.tbl tr:last-child td{border-bottom:0}

/* ---------- cartões de relatório e memória ---------- */
.rcard{flex:none;width:clamp(15rem,72vw,19rem);scroll-snap-align:start;text-align:left;border-radius:14px;padding:1rem;min-height:11rem;display:flex;flex-direction:column;gap:.5rem;
  background:linear-gradient(149deg,var(--s2),var(--s1));color:var(--ink);text-decoration:none;transition:transform var(--d1) var(--ease),background-color var(--d1)}
.rcard:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){.rcard:hover{transform:translateY(-3px);background:var(--s2)}}
.rcard h3{font:600 1.0625rem/1.3 var(--sans);text-wrap:balance}
.rcard p{font-size:.9375rem;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;text-wrap:pretty}
.rcard .foot2{margin-top:auto;font-size:.8125rem;color:var(--ink3);display:flex;justify-content:space-between;gap:.5rem}
.rcard .tag{display:inline-flex;align-items:center;gap:.25rem;align-self:flex-start;min-height:1.5rem;padding:0 .5rem;border-radius:4px;background:var(--s3);font-size:.75rem;font-weight:600}
.rcard .tag svg{width:.875rem;height:.875rem}
.rcard.rule .rid{font:800 2rem/1 var(--display);color:var(--red-ink)}

/* ---------- semana ---------- */
.mix{display:flex;gap:.25rem;margin:.75rem 0 .5rem;height:.5rem}
.mix i{display:block;border-radius:4px}.mix i:first-child{background:var(--red-ink)}.mix i:last-child{background:var(--ink3)}
.mixl{display:flex;flex-wrap:wrap;gap:.25rem 1.5rem;font-size:.9375rem;color:var(--ink2)}
.cal{display:grid;gap:1.5rem;margin-top:1.5rem}
@media (min-width:64rem){.cal{grid-template-columns:repeat(6,minmax(0,1fr));gap:.75rem;align-items:start}}
.day h2{position:sticky;top:calc(var(--top) + env(safe-area-inset-top));z-index:4;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);
  font:600 1.125rem/1 var(--sans);padding:.75rem 0;border-bottom:1px solid var(--line);margin-bottom:.75rem}
@media (min-width:64rem){.day h2{position:static;background:none;backdrop-filter:none}}
.slot{display:flex;gap:.75rem;align-items:center;width:100%;text-align:left;padding:.5rem;border-radius:12px;background:var(--s2);margin-bottom:.5rem;color:var(--ink);transition:transform var(--d1) var(--spring),background-color var(--d1)}
.slot:active{transform:scale(.97)}
@media (hover:hover){.slot:hover{background:var(--s3)}}
.slot .th{flex:none;width:3.5rem;aspect-ratio:4/5;border-radius:8px;overflow:hidden;background:var(--s3)}
.slot .th img{width:100%;height:100%;object-fit:cover;outline:1px solid var(--outline);outline-offset:-1px}
.slot .tx{min-width:0;display:grid;gap:.125rem;justify-items:start}
.slot .tx b{font-weight:600;line-height:1.25;text-wrap:balance}
.slot .tx .sm{font-size:.8125rem;color:var(--ink3)}
@media (min-width:64rem){.slot{flex-direction:column;align-items:stretch;padding:.5rem .5rem .75rem}.slot .th{width:100%}}
.note{display:flex;gap:.75rem;align-items:flex-start;margin-top:1.5rem;color:var(--ink2);max-width:40rem}

/* ---------- boletim ---------- */
.ind{flex:none;width:clamp(13rem,64vw,16rem);scroll-snap-align:start;padding:1rem;border-radius:14px;background:linear-gradient(149deg,var(--s2),var(--s1));display:flex;flex-direction:column;gap:.375rem}
.ind h3{font:500 .9375rem/1.3 var(--sans);color:var(--ink2);text-wrap:balance}
.ind .v{font:600 1.75rem/1.1 var(--sans);letter-spacing:-.01em}
.ind .v small{font:500 .875rem var(--sans);color:var(--ink2);margin-left:.25rem}
.ind .o{font-size:.8125rem;color:var(--ink3);margin-top:auto}

a Inteligência roda **todo dia, às 5h**, e alimenta todo o resto da agência.\n\nVocê opera três agentes:\n\n- **OBSERVADOR DE INSTAGRAM** — engenharia reversa dos perfis de referência. Mede, isola outliers e disseca.\n- **LEITOR DE NOTÍCIAS** — varredura de mercado (Goiânia e macro de crédito). Grava fato com fonte e validade.\n- **CURADOR DA MEMÓRIA** — destila os dois acima nas gavetas 1 e 2, e monta o **Boletim das 7h**.\n\n**Logs.** Toda ação sai no terminal prefixada pelo nome do agente, porque esses logs aparecem na gravação do\nvídeo. Formato: `[OBSERVADOR DE INSTAGRAM] o que fez · o número que prova`.\n\n### Pastas que são suas\n\n| Caminho | Conteúdo |\n|---|---|\n| `cerebro/01_manual_de_padroes.md` | Gaveta 1 — padrões que funcionam, com exemplo e data |\n| `cerebro/02_radar_de_mercado.json` | Gaveta 2 — fato com fonte e prazo de validade |\n| `entregas_reais/01_inteligencia/` | Relatório de perfis e este arquivo |\n| `entregas_reais/02_boletim/` | Boletim das 7h |\n\n### O que você NUNCA edita\n\nTudo o mais. Outras sessões escrevem nos outros arquivos **ao mesmo tempo** que você, e um `Write` seu em\ncima do trabalho delas destrói contexto que elas não têm como recuperar. Em especial: `ESTADO.md`,\n`CONTINUIDADE.md`, `cerebro/00_*`, `cerebro/03_banco_de_pautas.json`, `ferramentas/`, `dados/`,\n`painel_diretoria/`, `entregas_reais/03_revenda/`, `entregas_reais/04_lancamento/`.\n\n**Exceção única, e é por instrução explícita da tarefa:** você **anexa** o boletim do dia em\n`cerebro/04_historico_e_regras_ceo.md`, na seção \"Boletins\". Anexa, nunca reescreve — as regras permanentes e\nas auditorias do CEO daquele arquivo são de outra sessão e são material de apresentação.\n\n---\n\n## 2. O que entregou\n\n### `cerebro/01_manual_de_padroes.md` — Gaveta 1\nDez padrões numerados (P01 a P10), cada um com perfil, data, a métrica que o isolou como outlier, gancho,\nformato, estrutura de copy, ângulo, o que a Adão aproveita, e a URL do reel. Abre com o **Formato Padrão\nVencedor** e com o diagnóstico da baseline da casa. Fecha com a tabela dos 9 perfis monitorados, a seção\n\"Referências de montagem observadas\" e as pendências da próxima varredura.\n\n### `cerebro/02_radar_de_mercado.json` — Gaveta 2\n**29 indicadores + 9 notícias, todos com `url_fonte` que foi aberta e `valido_ate`.** Mais 4 **lacunas\ndeclaradas** — temas que foram procurados e não entraram, com o motivo e a decisão de produção que decorre\ndisso. As lacunas são tão importantes quanto os fatos: são o que impede uma peça de citar número que não existe.\n\n### `entregas_reais/01_inteligencia/relatorio_perfis.md`\nA entrega principal. Métrica dos 9 perfis, 6 outliers dissecados um a um, comparativo entre os dois blocos,\no Formato Vencedor justificado número por número, a seção de referências de montagem, e a seção final\n\"o que entregou e o que não entregou\".\n\n### `entregas_reais/02_boletim/boletim_7h.md`\nResumo executivo do mercado, impacto prático separado para **comprador** e para **investidor** de alto\npadrão em Goiânia, **4 ideias de pauta** prontas para virar carrossel ou reel (os 40% da regra 60/40), a\nseção de lacunas e uma tabela de validade por fato.\n\n### Anexo em `cerebro/04_historico_e_regras_ceo.md`\nO boletim condensado na seção \"Boletins\", com as regras de produção que ele impõe. Nada do que já existia\nno arquivo foi tocado.\n\n---\n\n## 3. Como trabalhou\n\n### A coleta do Instagram — o ponto que mais importa para o vídeo\n\nA tarefa mandava tentar três vias, nesta ordem. **As três falharam no começo:**\n\n1. **`APIFY_TOKEN` do `.env`** — não existe `.env` neste projeto. Conferido com\n   `find . -maxdepth 3 -name \".env*\" -not -path \"*/node_modules/*\"` e com `echo \"${APIFY_TOKEN:-VAZIO}\"`.\n   Zero resultado nos dois.\n2. **Navegador logado** — a extensão Claude in Chrome **não estava conectada**:\n   `mcp__claude-in-chrome__list_connected_browsers` retornou `[]`. O navegador interno do app abriu os perfis,\n   mas **deslogado**: o grid de posts era substituído pela parede de login (\"Mostrar mais posts de ...\"),\n   e só vinham bio e contagem de seguidores.\n3. **`referencias_ig/`** — a pasta não existe.\n\nCom isso, a primeira versão do relatório foi escrita **honestamente sem métrica**, com o aviso\n\"ANÁLISE ESTRUTURAL — SEM MÉTRICAS COLETADAS\" no topo, a análise feita só sobre a arquitetura observável dos\nperfis (bio, destaques, link-in-bio, razão seguidores/seguindo), e o bloqueio relatado no fim. Nenhuma média\ne nenhum outlier foram inventados.\n\n**Depois, no meio do trabalho, o navegador interno apareceu logado** como `joaozava_imoveis` — o diretor\nentrou na sessão do painel. O sinal que denunciou isso: ao abrir `@_k.elsie` a página passou a trazer\n\"Seguido(a) por giovana.zava...\", botão \"Seguindo\", \"Enviar mensagem\" e **contagem de posts**, que não\naparece deslogado. A partir daí a coleta foi refeita **inteira**, com métrica real, e o relatório foi\nreescrito do zero.\n\n**Lição para o vídeo:** o agente entregou o resultado honesto com o aviso de bloqueio, e **não parou de\nprocurar**. Quando a via abriu, refez o trabalho em vez de manter a entrega degradada.\n\n### O que funcionou, tecnicamente\n\n**Ler as views pelo texto da página é muito mais barato que screenshot.** Depois de carregar\n`https://www.instagram.com/<perfil>/reels/`, esperar ~6s, rolar e esperar mais ~4s, o `get_page_text`\ndevolve bio, seguidores, destaques e **a lista de views de todos os reels carregados**, em ordem. Um perfil\ninteiro sai em uma chamada. Screenshot custa muito mais e dá o mesmo número.\n\n**Para curtidas e comentários, o texto da página não basta** — eles só aparecem no hover. Para isso é preciso\n**abrir o reel**: clicar na célula do grid e rodar `get_page_text` na página do reel, que entrega curtidas,\nlegenda integral e comentários. É caro: uma chamada por reel. Por isso foram dissecados 6, não 129.\n\n**O `read_page` volta vazio enquanto o painel do navegador estiver oculto** (`Viewport: 0x0`). O\n`get_page_text` continua funcionando nessa condição. Quando o painel ficou visível, o `read_page` passou a\nresponder (`Viewport: 716x844`) e o grid de reels apareceu na árvore.\n\n### O que não funcionou, e não foi contornado\n\n**A tentativa de ler o endpoint interno do Instagram** (`/api/v1/users/web_profile_info/`) foi **barrada pela\npolítica de permissão da própria sessão**, classificada como acesso não autorizado. Isso está certo, e a\ndecisão foi **não insistir e não buscar contorno**. A coleta seguiu só por páginas públicas normais.\n\n**`WebFetch` falha em vários sites do mercado imobiliário.** `jornalopcao.com.br` devolve **HTTP 403**;\n`caixa.gov.br/voce/habitacao/imovel-novo/` entra em **loop de redirecionamento**. A solução foi abrir essas\npáginas **no navegador** e usar `get_page_text`, que passou nas duas.\n\n**PDF pelo `WebFetch` não serve para extrair tabela** — devolve o dump binário. O informe do FipeZAP foi\nsalvo em disco pelo próprio `WebFetch` e extraído com:\n```\npdftotext -layout <arquivo>.pdf <saida>.txt\n```\nO `pdftotext` existe nesta máquina em `/opt/homebrew/bin/pdftotext`. **Não há biblioteca de PDF em Python**\naqui (nem `pdfplumber`, nem `pymupdf`, nem `pypdf`) — foi conferido.\n\n**A API do Banco Central é pública e não precisa de chave.** Foi a fonte mais confiável de todas:\n```\ncurl -s \"https://api.bcb.gov.br/dados/serie/bcdata.sgs.432/dados/ultimos/5?formato=json\"\n```\nA série 432 é a **meta Selic diária**. Ela publica o valor **até a data da próxima decisão do Copom** — foi\nassim que se soube que a próxima reunião é **09/12/2026**, sem precisar de notícia.\n\n### Limites que bateu\n\nO **limite de uso de 5 horas** foi atingido no meio da redação dos arquivos do Instagram. A ordem de\nprioridade adotada foi: gravar primeiro os dois arquivos com os dados já coletados, e só depois voltar às\ndissecações que faltavam. Nenhum dado coletado se perdeu.\n\n---\n\n## 4. Os números que importam\n\n### Macro — todos no radar, com URL e validade\n\n| Fato | Valor | Fonte | Vence |\n|---|---|---|---|\n| Selic meta | **13,75% a.a.**, mantida por unanimidade em 04/11/2026 (282ª reunião), após 5 cortes de 0,25 p.p. | API do BCB, série SGS 432 | **09/12/2026** |\n| IPCA | **0,14%** em outubro · **4,63%** em 12 meses · 4,10% no ano | Agência Gov / IBGE | 11/12/2026 |\n| INCC-M | **0,35%** no mês · **6,75%** em 12 meses | Brasil 61 / FGV | 23/12/2026 |\n| IGP-M | 1,47% no mês · 5,24% em 12 meses | FGV, na tabela do informe FipeZAP | 31/12/2026 |\n| Caixa | financia até **90%** do valor, prazo de até **35 anos**, FGTS pode amortizar | página oficial da Caixa | 28/02/2027 |\n\n**O INCC a 6,75% supera o IPCA a 4,63% em mais de dois pontos.** É o argumento factual de que a próxima\ntabela de lançamento nasce mais cara que a atual.\n\n### Goiânia — atenção, são DUAS séries e elas não se misturam\n\n| Série | Valor | O que mede |\n|---|---|---|\n| **FipeZAP**, informe de outubro/2026 | **R$ 8.531/m²** · +6,34% em 12 meses · amostra de 28.726 anúncios | **preço de anúncio de usado pronto** |\n| **Ademi-GO**, acumulado até junho/2026 | **R$ 11.681/m²** · +7,4% sobre 2025 · **+105% sobre 2021** (era R$ 5.687) | **oferta de lançamento** |\n\nPor bairro, no FipeZAP de outubro (12 meses):\n\n| Bairro | R$/m² | 12 meses |\n|---|---|---|\n| Marista | 11.502 | +3,4% |\n| Sul | 10.933 | +4,1% |\n| Jardim Goiás | 9.932 | +4,3% |\n| **Bueno** | **9.849** | **+2,6%** |\n| Setor Oeste | 8.833 | **+8,3%** |\n| Jardim América | 8.812 | **+10,0%** |\n\n**O achado:** Jardim América e Oeste valorizam mais rápido que Marista e Bueno. Os bairros consagrados já\nprecificaram; o ganho marginal migrou para a borda. A média da cidade foi +6,34% — ou seja, **Bueno e\nMarista ficaram abaixo da própria cidade.**\n\nVolume, pela Ademi-GO / Brain (1º semestre de 2026): **7.323 unidades vendidas** contra **6.606 lançadas**,\nestoque **−6%**; residencial com **7.219 unidades, +42%** no ano contra +5,4% do Brasil (CBIC); lançamentos\n**−16,4%** contra o 2º semestre de 2025; VGV de **R$ 4,1 bi** contra R$ 4,2 bi. Bueno e Marista concentram\n**31,8%** de toda a oferta da cidade.\n\n### Instagram — 129 reels, 9 perfis, 2026-11-17\n\n| Perfil | Bloco | n | Média | Mediana | Views ÷ seg. | Maior outlier |\n|---|---|---|---|---|---|---|\n| @capitalconcreto | performance | 12 | 24.378 | 2.378 | 15,0% | 182.000 (7,47x) |\n| @corretormaquinadevendas | performance | 14 | 18.829 | 4.293 | 24,3% | 102.000 (5,42x) |\n| @robsonstalyn_3i | performance | 12 | 4.251 | 3.068 | 7,0% | 9.901 (2,33x) |\n| @autimob | performance | 12 | 1.829 | 1.624 | 4,6% | 4.102 (2,24x) |\n| @remaxbr | institucional | 15 | 3.280 | 1.553 | 4,1% | **26.700 (8,14x)** |\n| @brokersbr | institucional | 12 | 3.116 | 3.025 | 5,2% | 6.469 (2,08x) |\n| @sharksimobiliaria | institucional | 15 | 4.304 | 3.234 | 17,3% | 11.500 (2,67x) |\n| **@adaoimoveisoficial** | **baseline** | 15 | **4.499** | 2.690 | **9,8%** | **21.300 (4,73x)** |\n| @_k.elsie | ref. montagem | 12 | 140.075 | 157.000 | 80,9% | 206.000 (1,47x) |\n\nMédia por bloco: **performance 12,73%** de views por seguidor, **institucional 8,86%**.\n\n**Os 6 outliers dissecados**, em ordem de taxa de curtida:\n\n| Reel | Views | Curtidas | Taxa | O que carregou |\n|---|---|---|---|---|\n| @autimob · tese de mercado com fonte | 4.102 | 177 | **4,31%** | dado de Goiânia com fonte nomeada |\n| @robsonstalyn_3i · tour `800 metros` | 624.000 | 24.300 | 3,89% | número em tela sobre o tour |\n| @remaxbr · `MELHOR OUTUBRO DA HISTÓRIA` | 26.700 | 871 | 3,26% | recorde com o macro como contraste |\n| @corretormaquinadevendas · `o fim dos sites` | 102.000 | 2.619 | 2,57% | ruptura + comment-gate |\n| @adaoimoveisoficial · `110 unidades / R$ 52 mi` | 21.300 | 320 | 1,50% | número de resultado na capa |\n| @capitalconcreto · bastidor de obra (collab) | 182.000 | 1.088 | **0,60%** | alcance emprestado do collab |\n\nURLs: `/reel/DfkZJN5Bk-x/` · `/reel/CxNf3F6O7vp/` · `/reel/DfNwt7YP82C/` · `/reel/DaJbqm1h9Q4/` ·\n`/reel/DfYRP4gtrXT/` · `/reel/DfrvWgzAGJt/` — todos em `instagram.com`.\n\n**A ordem de views é quase o inverso da ordem de engajamento.** O reel de menor view do conjunto dissecado\ntem a maior taxa de curtida; o de maior view tem a menor. **Medir peça por view bruta leva a decisão errada.**\n\n### O Formato Padrão Vencedor\n\n> Peça de um único imóvel, aberta por um **número absoluto escrito por cima da imagem** nos primeiros 3\n> segundos — metragem, preço ou unidades vendidas, sempre do **ativo**, nunca da marca — com tour no miolo,\n> um dado de mercado com fonte como virada, e fecho em objeção respondida + conversa privada.\n\nSai do **bloco de performance de venda**, como a tarefa exigia. As evidências:\n\n1. O reel de melhor engajamento do levantamento (3,89%) é um tour com `800 metros` escrito sobre a imagem e\n   a legenda mais fraca de todas. **O número prendeu; o texto não.**\n2. **Número de resultado é o formato do topo em três perfis independentes:** @remaxbr 8,14x,\n   @adaoimoveisoficial 4,73x, e o maior reel de todo o conjunto (@_k.elsie, 1,4 mi views e 38,5 mil curtidas)\n   é uma recapitulação de resultado em números. Três portes, três públicos, mesmo formato no topo.\n3. Os dois perfis de maior média do bloco de performance organizam os destaques **por ativo nomeado**\n   (`R496`, `Stay NK`, `Consolação`, `Brickel`). No bloco institucional isso aparece **zero vez em três perfis**.\n4. Dado de mercado com fonte produziu a **melhor taxa de curtida medida** (4,31%) — e **nenhum dos 8 perfis\n   usa isso com consistência.** O radar tem 29 indicadores auditados. É vantagem disponível e não ocupada.\n\n### A baseline da casa\n\nA Adão **não está mal**: média de 4.499 views e 9,8% de views por seguidor, acima de todo o bloco\ninstitucional, do @robsonstalyn_3i e do @autimob. **O problema é amplitude, não alcance** — ela quase nunca\nestoura. A mediana (2.690) fica bem abaixo da média, porque os dois estouros puxam tudo.\n\n---\n\n## 5. Decisões que tomou, e por quê\n\n**Separar performance de estética.** O Formato Vencedor fala de **o que performa** — qual formato, qual\ngancho retém, qual ritmo prende. Não fala de tipografia, cor ou tratamento de imagem. A razão é que a Adão\nAction terá **linguagem visual própria**, decidida à parte com as referências do diretor. Misturar as duas\ncoisas faria a Inteligência decidir design sem mandato e sem dado para isso.\n\n**@_k.elsie não virou padrão, e isso foi corrigido no meio do caminho.** A sessão coordenadora primeiro a\napresentou como \"referência de design oficial do diretor\" e depois **corrigiu**: é de um projeto anterior,\npessoal, de outro contexto. A seção foi renomeada para \"Referências de montagem observadas\" e o texto diz\nexplicitamente que **nenhum desses perfis define o estilo da Adão Action**. O valor dela é outro, e é\nestrutural: **mediana maior que a média e maior outlier de só 1,47x** — ela não vive de estouro, vive de piso\nalto, o oposto de todos os 8 perfis brasileiros. Isso é referência de **regime de operação**, não de estética.\n\n**Separar reels fixados dos recentes.** Reel fixado é curadoria do próprio perfil — normalmente o melhor\nhistórico dele. Entrar na média contaminaria a leitura da operação atual. Ficaram listados à parte.\n\n**Recusar sites terceiros de estatística de Instagram.** Eles publicam engajamento **estimado por modelo**,\nnão medido. Entrariam no relatório como número com URL, parecendo rastreáveis, mas seriam número fabricado\npor terceiro. **Preferiu-se o zero honesto.**\n\n**Não publicar taxa de juros de financiamento.** A Caixa não a publica na página oficial. O que circula na\nweb vem de blogs de corretagem, com números divergentes entre si e datas duvidosas. A decisão: usar só\n**LTV de 90%** e **prazo de 35 anos**, que são oficiais, e remeter à simulação.\n\n**Declarar lacunas em vez de omiti-las.** As 4 lacunas do radar são instrução de produção. A mais cara:\n**condomínio fechado horizontal (Aldeia do Vale, Alphaville, Jardins) não tem índice oficial nenhum** —\nFipeZAP, Ademi-GO e CBIC não publicam série para isso. O que existe na web é preço de **anúncio** em portal\nde corretagem, que não é preço de transação. Peça sobre condomínio fechado **não pode citar valorização de\nm² nem comparativo de bairro**; só atributo verificável do próprio imóvel.\n\n---\n\n## 6. Erros, seus e de outros\n\n### Erro próprio, pego por auto-checagem: a entrega degradada que não podia virar definitiva\n\nA primeira versão do relatório saiu **sem métrica nenhuma**, com o aviso de bloqueio no topo. Estava correta\ne honesta. **O erro teria sido parar ali.** O que pegou foi continuar olhando o estado da sessão: ao abrir\n`@_k.elsie`, a página trouxe \"Seguido(a) por giovana.zava\", botão \"Seguindo\" e **contagem de posts** — três\nsinais que **só existem logado**. O diretor tinha entrado na sessão enquanto o trabalho corria.\n\nA coleta foi refeita inteira e os dois arquivos reescritos do zero, de análise estrutural para métrica real.\n**Lição:** aviso de bloqueio é um estado, não um veredito. Reconferir a via antes de considerar a entrega fechada.\n\n### Erro próprio, pego por leitura de spec: @_k.elsie quase virou padrão estético\n\nA instrução que chegou dizia que `@_k.elsie` era \"a referência de design oficial do diretor\" e pedia a seção\n\"Referência de montagem — @_k.elsie\". A correção veio depois, da mesma fonte. **O erro não chegou ao disco**\nporque a seção foi escrita já com a correção aplicada. Ficou registrado o que mudou e por quê.\n\n### Erro de procedência, pego ao ler arquivo local\n\nExiste em `~/Desktop/Lux flamboyant/_CLAUDE/briefing.md` um briefing de projeto anterior do diretor, que\ndescreve montagem \"estilo @_k.elsie\" com vocabulário muito detalhado: speed ramps de 6–8 frames, whip pan,\ncurva de velocidade em \"U\", look `Luxury Warm Editorial`. **Era tentador tratar isso como dado coletado** —\né específico, é do diretor, e parece observação.\n\n**Não é.** É de outro projeto, de outra pessoa, de outro contexto, e **nunca foi verificado contra os reels**.\nFoi registrado nos dois arquivos como **nota de procedência explícita**, marcado como não verificado, para\nque ninguém o confunda com medição. Reaproveita-se ferramenta e fluxo daquele projeto; estética, não.\n\n### Erro de outra sessão, pego ao ler o `ESTADO.md`: o ângulo do Óra Vaca Brava\n\nO `ESTADO.md` registrava o ângulo da Sessão C como:\n*\"O Bueno subiu 2,6% em um ano. E é por isso que vale comprar no Bueno agora.\"*\n\n**O número está certo e é meu** — FipeZAP de outubro, Bueno a R$ 9.849/m², +2,6% em 12 meses. **A leitura é\nque está invertida:** 2,6% é a **MENOR** alta entre os bairros nobres de Goiânia, e está **abaixo da média da\nprópria cidade** (+6,34%). Se a peça der a entender que o Bueno está em disparada, diz o contrário da fonte,\ne o Revisor reprova contra o dado.\n\nForam oferecidos dois caminhos honestos:\n1. **\"Ainda não precificou\"** — defasagem é argumento legítimo, mas a peça precisa dizer **explicitamente**\n   que a alta foi baixa, senão vira mentira por omissão.\n2. **Escassez em vez de valorização** (o recomendado) — Bueno + Marista concentram **31,8%** da oferta da\n   cidade, o estoque caiu **6%**, os lançamentos vieram **16,4%** menores, e a causa é estrutural: o Plano\n   Diretor restringiu o adensamento justamente em Bueno, Marista e Oeste. O argumento vira **\"acaba antes\"**,\n   não \"sobe mais\" — e isso é verdade.\n\n**Status: o alerta foi enviado à coordenação. A correção é da Sessão C, não desta.**\n\n### Erro de outra sessão, pego por conferência em disco: cabeçalho duplicado\n\n`cerebro/04_historico_e_regras_ceo.md` apareceu com **dois** `## Auditorias do CEO` (linhas 68 e 76). A\ncoordenadora tinha colado as regras R06 a R09 debaixo do cabeçalho errado. Foi sinalizado, **não corrigido**\n— o arquivo é dela. Ela corrigiu, e a correção foi **verificada em disco**, não aceita de palavra:\num `## Auditorias do CEO`, 10 regras, boletim intacto. **Relato de outra sessão não é prova; o `grep` é.**\n\n### Risco estrutural registrado: as duas séries de m²\n\n**FipeZAP R$ 8.531/m² (anúncio de usado) e Ademi-GO R$ 11.681/m² (oferta de lançamento) medem coisas\ndiferentes e não podem ser somadas, cruzadas nem comparadas na mesma peça.** A diferença de R$ 3.150/m² não\né valorização — é metodologia. Isso está anotado no boletim como nota para o Revisor e foi repassado à\nSessão C, porque o ângulo do Óra compara exatamente preço de lançamento com média de bairro: é ali que o\nerro aconteceria.\n\n### Achado de qualidade: o \"estouro para dentro\"\n\nOs dois outliers de formato \"número de recorde\" — o da Adão (21.300) e o da RE/MAX (26.700) — têm os\ncomentários **quase todos de corretores e franqueados da própria rede**. `agecorretor`,\n`corretor_leandromelo`, `valeriamartinsbroker` de um lado; `thiagomedeirosremax`, `remaxexperiencecaxias`,\n`andreza.pim_remax` do outro.\n\n**O formato funciona, mas estourou para dentro.** Outlier cujo engajamento é interno não prova alcance de\ncomprador. O Diretor de Qualidade precisa disso para não recomendar um formato que só circula entre colegas.\n\n---\n\n## 7. Armadilhas técnicas\n\n**Quebra na cara:**\n- `WebFetch` em `jornalopcao.com.br` → **HTTP 403**. Use o navegador.\n- `WebFetch` em `caixa.gov.br/voce/habitacao/imovel-novo/` → **loop de redirecionamento**. A página que abre\n  é `caixa.gov.br/voce/habitacao/Paginas/default.aspx`.\n- `WebFetch` em PDF → devolve dump binário, não tabela. Salve e use `pdftotext -layout`.\n- Endpoint interno do Instagram (`/api/v1/...`) → **barrado pela política da sessão**. Não insista.\n\n**Falha em silêncio, que é pior:**\n- **`read_page` volta vazio (`Viewport: 0x0`) quando o painel do navegador está oculto.** Não dá erro:\n  devolve \"(empty page)\". Se você concluir daí que a página não carregou, conclui errado. Use `get_page_text`.\n- **O grid do Instagram precisa de tempo.** Navegar e ler imediatamente devolve só o cabeçalho do perfil.\n  Espere ~6s, role, espere mais ~4s. Sem isso você \"mede\" um perfil vazio e não percebe.\n- **Reels fixados vêm primeiro e não são recentes.** Entram na lista sem aviso. Se você calcular a média\n  com eles, o número sai inflado e parece plausível.\n- **Página de perfil deslogada parece funcionar.** Entrega bio e seguidores normalmente; só o grid some.\n  É fácil achar que coletou o perfil quando não coletou nada de métrica.\n\n**Custa caro:**\n- Abrir reel um a um para ter curtidas: **uma chamada por reel**. Foi por isso que só 6 foram dissecados.\n- Screenshot para ler número que o `get_page_text` já entrega. Sempre tente o texto primeiro.\n- **A conta logada é pessoal do diretor.** Scraping agressivo logado dispara bloqueio. A varredura foi feita\n  devagar, com esperas, sem rajada. Mantenha assim.\n\n**Funciona e é barato:**\n- API do BCB, sem chave: `https://api.bcb.gov.br/dados/serie/bcdata.sgs.432/dados/ultimos/5?formato=json`\n  (série 432 = meta Selic; o último registro revela a data da próxima reunião do Copom).\n- Informe do FipeZAP: `https://downloads.fipe.org.br/indices/fipezap/fipezap-YYYYMM-residencial-venda.pdf`\n  — traz **preço médio por bairro** de Goiânia, que quase nenhuma notícia publica.\n- `pdftotext -layout` está em `/opt/homebrew/bin/`. **Não há biblioteca de PDF em Python nesta máquina.**\n\n---\n\n## 8. Pendências\n\n**Abertas:**\n1. **Alerta do ângulo do Óra** (seção 6) — enviado à coordenação, correção é da Sessão C. **Não é seu para fechar.**\n2. **Curtidas e comentários dos reels não dissecados** — 123 dos 129. Exige abrir um a um.\n3. **Quatro outliers não dissecados:** @sharksimobiliaria 11.500 e 11.100 · @brokersbr 6.469 ·\n   @corretormaquinadevendas 93.400 · @adaoimoveisoficial 11.400 (o segundo da casa).\n4. **Métricas de carrossel e post estático** — esta varredura cobriu **apenas a aba Reels**. O Formato\n   Vencedor foi derivado de reels; se a peça da semana for carrossel, esse dado falta.\n5. **Teto do SFH de R$ 2,25 milhões e uso de FGTS** — atribuído à Resolução CMN 5.255 (10/10/2025), mas a\n   norma **não foi lida na fonte primária**. Não entrou no radar. Vale a checagem: boa parte da carteira de\n   alto padrão da Adão fica dentro desse teto.\n\n**Canceladas:**\n6. **Análise quadro a quadro de @_k.elsie** — duração de plano em frames, tipo de transição, corte na batida,\n   tratamento de cor. **Cancelada por decisão do diretor:** custa extração de vídeo e a Adão terá linguagem\n   própria, então não muda nenhuma decisão. O que **já foi** observado por amostragem de tela está nos dois\n   arquivos: planos variando de ~2s a ≥4s no mesmo reel, cena trocando a cada corte, cartões gráficos\n   flutuando ao lado dela, texto branco entrando no topo do quadro (não atrás da pessoa).\n\n**Validade do radar** — datas em que o fato expira e a peça precisa ser revista:\n\n| Fato | Vence |\n|---|---|\n| Selic 13,75% | **09/12/2026** (reunião do Copom) |\n| IPCA / INPC de outubro | 11/12/2026 |\n| FipeZAP Goiânia | 20/12/2026 |\n| INCC-M de outubro | 23/12/2026 |\n| Ademi-GO / Brain (1S2026) | 31/03/2027 |\n| Condições da Caixa | 28/02/2027 |\n\n---\n\n## 9. Como retomar\n\nLeia nesta ordem:\n\n1. **`CONTINUIDADE.md`** — o projeto inteiro: o que é, as 15 regras, a arquitetura de 4 sessões, as\n   ferramentas, como o diretor trabalha.\n2. **`cerebro/04_historico_e_regras_ceo.md`** — regras R01 a R15 e as auditorias do CEO. Note que a **R06\n   relaxou a R01**: coerência visual e desejo do cliente vêm antes de rigor de dado, porque isto é simulação.\n   Dado que falta vem do diretor — perguntar, nunca inventar, nunca travar.\n3. **Este arquivo**, inteiro.\n4. **`entregas_reais/01_inteligencia/relatorio_perfis.md`** — a entrega principal, com as 6 dissecações.\n5. **`cerebro/02_radar_de_mercado.json`** — os 29 indicadores, as 9 notícias e, principalmente, as **4\n   lacunas declaradas**, que dizem o que a peça não pode afirmar.\n6. **`cerebro/01_manual_de_padroes.md`** — os 10 padrões e o Formato Vencedor.\n7. **`ESTADO.md`** — o que as outras três sessões fizeram enquanto isso.\n\nDepois disso você tem o contexto desta divisão.\n\n**Três coisas para carregar sempre:**\n- **Protocolo R11:** ao receber comando, você planeja, manda o plano e **para**. Só executa com o OK.\n- **Modo `caveman` ativo** (skill `caveman`): respostas curtas, sem floreio, todo fato técnico preservado.\n  Documento gravado em disco, como este, vai em prosa normal.\n- **Edite só as suas pastas.** Três sessões escrevem ao mesmo tempo.\n"}, {"arquivo": "relatorio_perfis.md", "modulo": "01_inteligencia", "titulo": "Relatório de perfis — Divisão de Inteligência", "texto": "# Relatório de perfis — Divisão de Inteligência\n**Agente:** OBSERVADOR DE INSTAGRAM → CURADOR DA MEMÓRIA\n**Data da varredura:** 2026-11-17\n**Via de coleta:** navegador interno com a sessão logada do diretor (`joaozava_imoveis`), autorizada previamente.\n**Perfis varridos:** 8 do briefing + `@_k.elsie` (pedido da sessão irmã, como referência de montagem).\n\n> **Métricas coletadas de verdade:** visualizações de **129 reels** em 9 perfis, lidas direto do grid logado.\n> Curtidas e comentários foram coletados **integralmente em `@_k.elsie`** e **nos 6 outliers que foram abertos\n> e dissecados um a um**. Nos demais reels só há views — e o relatório não inventa o que não leu.\n>\n> `.env`/`APIFY_TOKEN` não existem no projeto e `referencias_ig/` não existe. A coleta saiu pela via 2.\n> Varredura conduzida devagar, em conta pessoal, sem requisição em rajada.\n\n---\n\n## 1. Métrica por perfil\n\nMédia e mediana sobre os **reels recentes** de cada perfil. Reels **fixados** foram separados: são escolha\neditorial do próprio perfil (normalmente o melhor histórico) e contaminariam a média da operação atual.\n\n| Perfil | Bloco | n | Média de views | Mediana | Views ÷ seguidores | Outliers acima da própria média |\n|---|---|---|---|---|---|---|\n| @capitalconcreto | performance | 12 | **24.378** | 2.378 | 15,0% | 182.000 (7,47x) · 86.500 (3,55x) |\n| @corretormaquinadevendas | performance | 14 | **18.829** | 4.293 | 24,3% | 102.000 (5,42x) · 93.400 (4,96x) · 27.700 (1,47x) |\n| @robsonstalyn_3i | performance | 12 | **4.251** | 3.068 | 7,0% | 9.901 (2,33x) · 7.857 (1,85x) · 6.094 (1,43x) · 4.564 (1,07x) |\n| @autimob | performance | 12 | **1.829** | 1.624 | 4,6% | 4.102 (2,24x) · 2.745 (1,50x) · 2.579 (1,41x) |\n| @remaxbr | institucional | 15 | **3.280** | 1.553 | 4,1% | 26.700 (**8,14x**) |\n| @brokersbr | institucional | 12 | **3.116** | 3.025 | 5,2% | 6.469 (2,08x) · 4.811 (1,54x) · 3.876 (1,24x) · 3.733 (1,20x) · 3.638 (1,17x) |\n| @sharksimobiliaria | institucional | 15 | **4.304** | 3.234 | 17,3% | 11.500 (2,67x) · 11.100 (2,58x) · 8.612 (2,00x) · 4.992 (1,16x) |\n| **@adaoimoveisoficial** | **BASELINE** | 15 | **4.499** | 2.690 | **9,8%** | **21.300 (4,73x)** · 11.400 (2,53x) · 4.798 (1,07x) |\n| @_k.elsie | ref. de montagem | 12 | 140.075 | 157.000 | 80,9% | 206.000 (1,47x) · 200.000 (1,43x) · 191.000 (1,36x) · 186.000 (1,33x) |\n\n**Reels fixados** (fora da média, por serem curadoria do próprio perfil):\n`@capitalconcreto` 8,6 mi · 322 mil · 102 mil — `@robsonstalyn_3i` 624 mil · 113 mil · 35 mil —\n`@brokersbr` 349 mil · 260 mil · 21,3 mil — `@_k.elsie` 1,4 mi · 692 mil · 592 mil —\n`@corretormaquinadevendas` 9.737.\n\n### O que a tabela diz\n1. **A Adão não está mal posicionada.** Média de 4.499 views é a **maior do bloco institucional de rede\n   inteiro** e maior que a de `@robsonstalyn_3i` e `@autimob`. Em views por seguidor (9,8%) a Adão está\n   acima de `@remaxbr` (4,1%), `@brokersbr` (5,2%), `@autimob` (4,6%) e `@robsonstalyn_3i` (7,0%).\n   O problema da Adão não é alcance médio — é **amplitude**: ela quase nunca estoura.\n2. **Média de bloco:** performance de venda **12,73%** de views por seguidor; institucional de rede **8,86%**.\n   O bloco de performance converte audiência em visualização ~1,4x melhor.\n3. **`@autimob` é o alerta de Goiânia.** Concorrente direto de praça, 39,6 mil seguidores, e a **menor média\n   do conjunto (1.829)**, com 4,6% de views por seguidor. Volume de post sem gancho não sustenta alcance.\n4. **Mediana muito abaixo da média em quase todos.** `@capitalconcreto` tem média 24.378 e mediana 2.378:\n   o perfil vive de **poucos estouros**, não de consistência. Mesmo padrão em `@remaxbr` (3.280 vs 1.553) e\n   na Adão (4.499 vs 2.690). **Regra que sai daqui: a meta não é subir a média, é fabricar o estouro.**\n\n---\n\n## 2. Os outliers dissecados\n\nSeis outliers foram **abertos e lidos** — views, curtidas, comentários, copy e gancho de tela.\n\n### 2.1 — @adaoimoveisoficial · 21.300 views · **4,73x a própria média**\n`https://www.instagram.com/reel/DfYRP4gtrXT/` · 05/11/2026 · **320 curtidas** · taxa de curtida **1,50%**\n- **Gancho de capa:** texto grande e cru sobre a foto do time — `110 UNIDADES VENDIDAS` / `R$ 52 MILHÕES EM VGV`,\n  assinado `CAMPEÕES RYOKAN`. **Dois números absolutos na primeira tela.**\n- **Formato:** post de dado/resultado com foto única do time. Não é tour, não é carrossel.\n- **Estrutura de copy:** resultado (110 unidades, R$ 52 mi) → qualificação do produto (*\"supercompacto a uma\n  quadra do Shopping Flamboyant, com metragem rara e vocação para morar e para investir\"*) → agradecimento\n  ao time → CTA (*\"Quer investir em um próximo lançamento com a gente? Acesse adaoimoveis.com.br\"*).\n- **Ângulo:** racional na capa (número), emocional no miolo (time).\n- **Achado honesto:** os comentários são quase todos de **corretores da própria casa**\n  (`agecorretor`, `corretor_leandromelo`, `valeriamartinsbroker`, `mariabeatrizcorretora`, `meneghetti.adaox`),\n  em formato de parabéns. **O post estourou para dentro, não para o comprador.** O formato funciona;\n  a distribuição foi interna.\n\n### 2.2 — @corretormaquinadevendas · 102.000 views · 5,42x a própria média\n`https://www.instagram.com/reel/DaJbqm1h9Q4/` · 28/06/2026 · **2.619 curtidas** · taxa **2,57%**\n- **Gancho (3s):** reel falado, legenda em tela `o fim dos sites das imobiliárias`. Afirmação de ruptura\n  que ameaça o status quo de quem assiste.\n- **Formato:** reel falado em plano único, câmera na mão, sem produção.\n- **Estrutura de copy:** ruptura externa (*\"O Google mudou e do dia pra noite os sites das imobiliárias\n  ficaram velhos\"*) → ação pessoal (*\"Eu tinha de fazer alguma coisa e fiz\"*) → promessa de década →\n  **CTA de comentário** (*\"Comenta o que achou dessa novidade\"*).\n- **Ângulo:** racional, de ameaça profissional.\n- **Mecânica que explica o número:** a seção de comentários é dominada pela **mesma palavra-chave repetida** —\n  `Site com IA`, dezenas de vezes, cada uma com resposta automática. É **comment-gate** (palavra-chave que\n  dispara DM). O alcance não veio só do gancho: veio de uma mecânica de comentário desenhada para isso.\n\n### 2.3 — @capitalconcreto · 182.000 views · 7,47x a própria média\n`https://www.instagram.com/reel/DfrvWgzAGJt/` · ~13/11/2026 · **1.088 curtidas** · taxa **0,60%**\n- **Autoria:** post em **colaboração** — assinado por `sophiamartins_sp` **e outros 2**, não pela marca.\n- **Gancho:** nenhum texto de impacto. Abre na **obra em andamento**, prédio em construção, geotag\n  `Jardins, São Paulo`.\n- **Formato:** bastidor de obra, vertical, sem arte.\n- **Copy:** uma linha (*\"E hoje é dia de acompanhamento das nossas obras 🧡😍 @capitalconcreto a incorporadora\n  do investidor\"*). Sem número, sem CTA.\n- **Achado honesto:** **0,60% de taxa de curtida — a pior dos quatro.** 182 mil views com 1.088 curtidas é\n  alcance emprestado da audiência do colaborador, não afinidade. **Volume de view não é qualidade de view.**\n\n### 2.4 — @robsonstalyn_3i · 624.000 views (fixado) · **melhor engajamento do conjunto**\n`https://www.instagram.com/reel/CxNf3F6O7vp/` · 15/09/2023 · **24.300 curtidas** · taxa **3,89%**\n- **Gancho (3s):** tour de imóvel com a **metragem escrita por cima da imagem** — `800 metros` / `De Luxo` —\n  enquanto o corretor caminha de braços abertos apresentando o espaço. Geotag `Vila Uberabinha`.\n- **Formato:** tour falado/caminhado de um único imóvel.\n- **Estrutura de copy:** genérica e fraca (*\"Experimente o verdadeiro luxo e sofisticação em cada detalhe\n  deste lugar extraordinário...\"*) + aviso de copyright. **Zero número na legenda. Zero CTA.**\n- **Ângulo:** emocional na legenda, **racional na tela** (a metragem).\n- **Achado decisivo:** é o reel de **melhor taxa de curtida de todo o levantamento (3,89%)**, e a legenda é a\n  mais fraca de todas. **O que prendeu foi o número em tela sobre o tour — não o texto.** Os comentários são\n  de público, não de corretores (*\"Isso sim vale 20 milhões\"*, *\"o apartamento mais lindo que eu vi\"*).\n\n### 2.5 — @remaxbr · 26.700 views · **8,14x a própria média (maior múltiplo do levantamento)**\n`https://www.instagram.com/reel/DfNwt7YP82C/` · 01/11/2026 · **871 curtidas** · taxa **3,26%**\n- **Autoria:** post em **colaboração** — assinado por `peixotoaccyoli` (conta do executivo) **e outros 4**,\n  não pela marca.\n- **Gancho de capa:** `O MELHOR OUTUBRO EM VENDAS DA HISTÓRIA` em texto grande sobre fundo vermelho.\n- **Formato:** reel falado curto com cartela de número.\n- **Estrutura de copy:** número absoluto de abertura (*\"+ de R$ 15 BILHÕES em vendas nos últimos 12 meses\"*)\n  → tese (*\"Quem lidera, bate o próprio recorde\"*) → **o macro como contraste** (*\"Mesmo com juros altos e\n  cenário de incerteza, nossa rede fez o que sabe fazer melhor\"*) → crédito ao time → visão de futuro.\n- **Ângulo:** racional (número) com moldura de superação.\n- **Achado:** é a **prova de que o cenário macro funciona como contraste dramático do número de resultado**.\n  Exatamente a lógica 60/40 — o dado de juros não é assunto da peça, é o adversário contra o qual o número brilha.\n- **Ressalva (idêntica à da Adão):** os comentários são **todos internos** — franqueados e corretores da rede\n  (`thiagomedeirosremax`, `remaxexperiencecaxias`, `andreza.pim_remax`, `claudinei.remax`). **Estourou para dentro.**\n\n### 2.6 — @autimob · 4.102 views · 2,24x a própria média · **melhor taxa de curtida do conjunto brasileiro**\n`https://www.instagram.com/reel/DfkZJN5Bk-x/` · ~10/11/2026 · **177 curtidas** · taxa **4,31%**\n- **Autoria:** colaboração (`autimob` e outros 2) com `@dariooliveira`, sócio-diretor da `@avolli.inc`.\n- **Gancho (3s):** frase de entrevista escrita em tela — `TÁ MUITO FÁCIL VENDER GOIÂNIA NO BRASIL INTEIRO`.\n  Afirmação de orgulho de praça, em primeira pessoa, sobre a cidade.\n- **Formato:** recorte de entrevista com citação em tela.\n- **Estrutura de copy:** tese sobre Goiânia → **fonte nomeada** (Dário Oliveira, Ávolli) → **números de\n  demanda** (≈400 mil novos moradores na região metropolitana entre 2010 e 2020, ~190 mil só na capital) →\n  credencial de projeto (arquiteto Greg Bousquet, do Triptyque, de Cidade Matarazzo e Biotic) → comparação\n  internacional (Londres, Nova York, Berlim, Paris, São Paulo).\n- **Ângulo:** racional, de tese de mercado com lastro de fonte.\n- **Achado decisivo:** **4,31% de taxa de curtida — a melhor de todas as dissecações brasileiras**, num reel\n  de só 4.102 views. É exatamente o formato que o Formato Vencedor propõe no slide 6: **dado de mercado com\n  fonte nomeada**. Converte pouca view em muita afinidade.\n- **Ressalva de dado:** os números de 400 mil / 190 mil são **declaração de executivo em legenda de Instagram**,\n  não série oficial. **Não entram no radar de mercado** sem fonte primária.\n\n### Comparativo das seis dissecações\n| Reel | Views | Curtidas | Taxa | O que carregou |\n|---|---|---|---|---|\n| @autimob · tese de mercado com fonte | 4.102 | 177 | **4,31%** | dado de Goiânia com fonte nomeada |\n| @robsonstalyn_3i · tour `800 metros` | 624.000 | 24.300 | **3,89%** | número em tela sobre tour |\n| @remaxbr · `MELHOR OUTUBRO DA HISTÓRIA` | 26.700 | 871 | 3,26% | recorde com o macro como contraste |\n| @corretormaquinadevendas · `o fim dos sites` | 102.000 | 2.619 | 2,57% | ruptura + comment-gate |\n| @adaoimoveisoficial · `110 unidades / R$ 52 mi` | 21.300 | 320 | 1,50% | número de resultado na capa |\n| @capitalconcreto · bastidor de obra (collab) | 182.000 | 1.088 | **0,60%** | alcance emprestado do collab |\n\n**A ordem de views e a ordem de engajamento são praticamente inversas.** O reel de **menor view** do conjunto\n(4.102) tem a **maior taxa de curtida** (4,31%); o de maior view entre os dissecados (182.000) tem a menor\n(0,60%). Medir peça por view bruta leva a decisão errada.\n\n**Os três primeiros colocados em engajamento têm a mesma espinha:** um número ou uma tese verificável,\nescrita em tela, sobre um alvo que interessa a quem compra — a metragem do imóvel, a cidade, o recorde\ncontra o cenário. **Nenhum dos três depende de produção cara.**\n\n---\n\n## 3. Bloco de performance de venda × bloco institucional de rede\n\n| | Performance de venda | Institucional de rede |\n|---|---|---|\n| Views ÷ seguidores (média do bloco) | **12,73%** | 8,86% |\n| Maior múltiplo de outlier | 7,47x (@capitalconcreto) | 8,14x (@remaxbr) |\n| Natureza do maior outlier | ativo/obra/ruptura de mercado | **recorde de vendas da rede** |\n| Unidade de conteúdo | o **ativo** ou a **tese de mercado** | a **marca** e o **time** |\n| Destaques nomeados por ativo | `Consolação`, `Jardins I`, `R496`, `Stay NK`, `Brickel`, `Miami` | **nenhum** |\n| Destaque de objeção | `Dúvidas` (@capitalconcreto) | nenhum |\n| Destaque de prova | `Resultados`, `Depoimentos` | `Cases`, `Pódios`, `Recordes` |\n\n**O outlier do @remaxbr (26.700 views, 8,14x — o maior múltiplo de todo o levantamento) é `O MELHOR OUTUBRO\nEM VENDAS DA HISTÓRIA`.** O outlier da Adão é `110 UNIDADES VENDIDAS / R$ 52 MILHÕES EM VGV`. **Os dois maiores\nmúltiplos relativos dos dois blocos são o mesmo formato: número de recorde na capa.** Isso é convergência\nindependente, em perfis com público e porte diferentes — a evidência mais forte do levantamento.\n\nA diferença é que o institucional **só** faz isso, e sempre sobre a própria marca. O bloco de performance\nusa o número sobre **o ativo** (`800 metros`) e sobre **a tese de mercado** (`o fim dos sites`) — alvos que\ninteressam a quem compra, não só a quem vende.\n\n---\n\n## 4. FORMATO PADRÃO VENCEDOR DA ADÃO ACTION\n\n**Peça de um único ativo, aberta por um número absoluto escrito por cima da imagem nos primeiros 3 segundos,\ncom o tour do imóvel como miolo e um dado de mercado com fonte como virada — o número no gancho é do imóvel\nou do resultado de venda dele, nunca da marca, e a legenda fecha em objeção respondida + conversa privada.**\n\n### Os 7 tempos da peça\n| # | Tempo | Conteúdo | Origem obrigatória |\n|---|---|---|---|\n| 1 | 0–3s | **Um número absoluto por cima da imagem**: metragem, preço ou unidades vendidas | XML do CRM |\n| 2 | 3–8s | O ativo nomeado: setor, quartos, suítes, vagas | XML do CRM |\n| 3–5 | miolo | Tour dos 3 ambientes de maior impacto, em movimento | **Drive** (foto do XML tem marca d'água) |\n| 6 | virada | Um dado de mercado com a **fonte impressa na tela** | `cerebro/02_radar_de_mercado.json` |\n| 7 | fecho | Objeção respondida + convite a conversa privada | — |\n\n### A justificativa, número por número\n1. **Número absoluto em tela bate legenda.** O reel de melhor engajamento do levantamento\n   (@robsonstalyn_3i, **3,89%**) tem a legenda mais fraca de todas e o número `800 metros` escrito sobre o\n   tour. Prova direta de que o gancho é visual e numérico.\n2. **Número de resultado é o formato do topo em três perfis independentes.** @remaxbr\n   `MELHOR OUTUBRO DA HISTÓRIA` = **8,14x** a própria média (maior múltiplo do levantamento);\n   @adaoimoveisoficial `110 UNIDADES / R$ 52 MI` = **4,73x**; e o maior reel de todo o conjunto,\n   @_k.elsie com **1,4 mi views e 38,5 mil curtidas**, é uma recapitulação de resultado\n   (*\"Quarter one closed at $10 million... over 30 families served\"*). Três perfis, três portes e três\n   públicos diferentes, **mesmo formato no topo**. A própria Adão já provou que funciona na casa dela.\n3. **Um ativo por peça.** Os dois perfis de performance com maior média (@capitalconcreto 24.378 e\n   @corretormaquinadevendas 18.829) organizam os destaques por ativo nomeado (`R496`, `Stay NK`,\n   `Consolação`). No bloco institucional isso aparece **zero vez em três perfis**.\n4. **Tour, não vitrine estática.** O único formato do levantamento que combinou alcance alto **e** engajamento\n   alto foi o tour (3,89%). O bastidor de obra em collab teve 182 mil views e **0,60%** — alcance sem afinidade.\n5. **Dado de mercado com fonte é o formato de melhor engajamento medido.** O reel de `@autimob` com tese\n   sobre Goiânia e fonte nomeada fez **4,31% de taxa de curtida — a melhor de todas as dissecações**, com\n   apenas 4.102 views. E o outlier de maior múltiplo do levantamento (@remaxbr, 8,14x) usa **o cenário macro\n   como contraste** do número de resultado. A Adão tem 29 indicadores auditados no radar e nenhum concorrente\n   os está usando com consistência: é a vantagem disponível e não ocupada.\n6. **Objeção no fecho.** @capitalconcreto, o perfil de maior média do bloco, é o único com destaque `Dúvidas`.\n7. **Por que não sai do institucional:** o bloco institucional converte pior (8,86% contra 12,73%) e seu\n   único formato de estouro fala **da marca para a própria rede**. O outlier da Adão provou isso na prática:\n   21.300 views com os comentários tomados por corretores da casa. **A Adão já sabe falar para dentro. O\n   Formato Vencedor é para virar o número para fora — para o comprador.**\n\n### Primeiro ajuste operacional que decorre disso\nA Adão tem média de 4.499 e mediana de 2.690: **estoura pouco**. Os dois estouros dela (21.300 e 11.400)\nsão 4,73x e 2,53x. A meta da primeira semana não é subir a média — é **repetir o formato que já estourou,\nagora com o número do imóvel e não só o da venda**, e distribuir fora da rede de corretores.\n\n---\n\n## 5. Referências de montagem observadas\n\n**Nenhum dos perfis desta seção define a estética da Adão Action.** A linguagem visual própria será decidida\nà parte, com as referências que o diretor ainda vai enviar. O que está aqui é **insumo de análise estrutural**:\no que funciona em termos de retenção e formato, não como a peça deve parecer.\n\n### @_k.elsie — 173.241 seguidores · 365 posts\nPerfil de corretora nos EUA (Hickory & Charlotte Metro, NC). Entra como referência de **montagem**, no mesmo\nnível dos demais, por pedido da sessão irmã.\n\n**Métrica completa coletada — views · curtidas · comentários:**\n\n| Reel | Views | Curtidas | Comentários | Taxa de curtida |\n|---|---|---|---|---|\n| fixado 1 | 592.000 | 17.000 | 248 | 2,87% |\n| fixado 2 | **1.400.000** | **38.500** | 483 | 2,75% |\n| fixado 3 | 692.000 | 23.600 | 564 | 3,41% |\n| recentes | 206.000 | 7.725 | 124 | 3,75% |\n| | 200.000 | 3.711 | 78 | 1,86% |\n| | 191.000 | 3.681 | 79 | 1,93% |\n| | 186.000 | 5.022 | 99 | 2,70% |\n| | 164.000 | 5.306 | 57 | 3,24% |\n| | 163.000 | 3.905 | 101 | 2,40% |\n| | 151.000 | 5.929 | 139 | 3,93% |\n| | 113.000 | 3.681 | 79 | 3,26% |\n| | 90.700 | 2.244 | 68 | 2,47% |\n| | 86.600 | 2.223 | 58 | 2,57% |\n| | 81.900 | 5.103 | 77 | 6,23% |\n| | 47.700 | 1.195 | 45 | 2,51% |\n\n**Média dos recentes: 140.075 views · mediana 157.000 · 80,9% de views por seguidor.**\n\n**O que a métrica diz, e é o ponto estrutural que importa:** a mediana (157.000) é **maior** que a média\n(140.075), e o maior outlier recente é só **1,47x**. É o **oposto** de todos os 8 perfis brasileiros, onde a\nmédia é puxada por um ou dois estouros e a mediana fica muito abaixo. Este perfil não vive de estouro — vive\nde **consistência alta**. Para a Adão isso é a referência de regime, não de estética: um perfil pode operar\ncom piso alto em vez de picos isolados.\n\n**O que foi observado nas capas** (grid logado): quase toda capa tem **texto grande em tela sobre a pessoa\nfalando**, com palavra isolada em destaque (`and this?`, `until`, `Yeah,`, `And`, `who you are`, `ONE thing`,\n`$17 M`, `I have sold`). O gancho é **palavra de tela, não produção de imóvel** — em 15 reels, só 3 capas são\nde imóvel; as outras 12 são a pessoa em plano médio com texto.\n\n**Montagem — observado em um reel, por amostragem de tela**\nReel de maior alcance do perfil: `https://www.instagram.com/reel/DYwset0R5kP/` · 25/05/2026 ·\n**1,4 mi views · 38,5 mil curtidas · 483 comentários · taxa 2,75%**. Assistido com capturas em intervalos\nde 2s e depois de 1s.\n\n- **O que é o reel:** **recapitulação de resultado em números.** Legenda abre em *\"Quarter one closed at\n  $10 million. We're now sitting at $14 million year-to-date and over 30 families served so far in 2026\"*,\n  e segue para história pessoal de superação e fé, fechando em agradecimento. **O maior reel de todo o\n  levantamento (1,4 mi) é, de novo, um post de número de resultado** — mesma espinha do outlier da Adão\n  (`110 unidades / R$ 52 mi`) e do @remaxbr (`MELHOR OUTUBRO DA HISTÓRIA`). Três perfis, três países de\n  audiência diferentes, mesmo formato no topo.\n- **Estrutura visual recorrente:** ela em plano médio/inteiro, **cena diferente a cada corte** (beira de lago\n  → passarela → varanda → piscina), com **cartões gráficos flutuando ao lado dela** (fotos, prints, capas)\n  que trocam junto com a cena.\n- **Ritmo de corte:** **irregular e proposital.** Amostrando de 2 em 2 segundos, a cena mudou **toda vez**;\n  amostrando de 1 em 1 segundo, a cena de piscina **permaneceu por 4 amostras seguidas**. Planos de ~2s a\n  ≥4s no mesmo reel: trechos de troca rápida alternados com trechos que respiram.\n- **Tipografia em tela:** texto branco entrando **no topo do quadro, por cima da imagem** — não atrás da\n  pessoa, neste reel.\n\n**Ainda NÃO medido, e não afirmado:** duração exata de cada plano em frames · tipo de transição (whip pan,\nspeed ramp, camera shake, match cut) — nenhuma transição foi capturada entre amostras · se o corte cai na\nbatida da música · se a legenda é palavra a palavra · tratamento de cor e exposição. Isso exige extrair o\nvídeo e analisar quadro a quadro, o que esta varredura não fez.\n\n> **Nota de procedência:** existe em `~/Desktop/Lux flamboyant/_CLAUDE/briefing.md` um briefing de projeto\n> anterior do diretor que descreve montagem \"estilo @_k.elsie\" com vocabulário detalhado (speed ramps de\n> 6–8 frames, whip pan, curva de velocidade em \"U\", look `Luxury Warm Editorial`). **Esse documento é de outro\n> projeto, de outra pessoa e de outro contexto — não é observação deste levantamento e não foi verificado\n> contra os reels.** Está registrado aqui só para que ninguém o confunda com dado coletado.\n\n---\n\n## 6. O que esta varredura entregou e o que não entregou\n\n**Entregou, com dado lido no grid logado:** views de 129 reels em 9 perfis · média, mediana e múltiplo de\noutlier por perfil · views por seguidor por perfil e por bloco · curtidas e comentários completos de\n`@_k.elsie` · dissecação completa (views, curtidas, copy, gancho, URL, data) de 6 outliers · seguidores,\nseguindo, bio e destaques dos 9 perfis.\n\n**Não entregou:** curtidas e comentários dos reels **não dissecados** (exigiria abrir um a um) ·\ndissecação dos outliers de `@sharksimobiliaria` (11.500 e 11.100), `@brokersbr` (6.469),\n`@corretormaquinadevendas` (93.400) e do segundo outlier da Adão (11.400) ·\nanálise quadro a quadro de `@_k.elsie` (duração de plano em frames, tipo de transição, corte na batida, cor —\no ritmo aproximado, a tipografia e a estrutura visual **foram** observados por amostragem, na seção 5) ·\nmétricas de carrossel e de post estático — esta varredura cobriu **apenas a aba Reels**.\n\n**Nada foi estimado.** Todo número deste relatório foi lido na tela em 2026-11-17.\n"}, {"arquivo": "boletim_7h.md", "modulo": "02_boletim", "titulo": "Boletim das 7h — Adão Action", "texto": "# Boletim das 7h — Adão Action\n**Segunda-feira, 17 de novembro de 2026 · 07h00**\n**Agentes:** LEITOR DE NOTÍCIAS → CURADOR DA MEMÓRIA\n**Fonte de todo número deste boletim:** `cerebro/02_radar_de_mercado.json` — 29 indicadores e 9 notícias,\ncada um com `url_fonte` acessível e `valido_ate`. Nenhum número aqui existe sem origem rastreável.\n\n---\n\n## 1. Resumo executivo\n\n**O juro parou de cair e o imóvel de Goiânia não parou de subir. É esse o descolamento da semana.**\n\nO Copom manteve a Selic em **13,75% ao ano** em 4 de novembro, por unanimidade, interrompendo cinco cortes\nseguidos de 0,25 ponto iniciados em março. O mercado estava rachado: de 75 casas ouvidas pela Projeções\nBroadcast, 39 esperavam corte para 13,50% e 36 a manutenção — a Selic ficou acima da mediana do mercado pela\nprimeira vez desde junho de 2025. A próxima decisão é **9 de dezembro**.\n([BCB, série SGS 432](https://api.bcb.gov.br/dados/serie/bcdata.sgs.432/dados/ultimos/1?formato=json) ·\n[O Liberal / Estadão Conteúdo](https://www.oliberal.com/economia/bc-copom-interrompe-ciclo-de-calibracao-e-mantem-taxa-selic-em-13-75-ao-ano-1.1190560))\n\nA inflação ao consumidor deu trégua — **IPCA de 0,14% em outubro**, contra 0,82% em setembro, puxado para\nbaixo pela conta de luz (bandeira amarela → verde) e pelas passagens aéreas. Mas o acumulado de **4,63% em\n12 meses** segue acima do teto de 4,5% da meta, o que sustenta o discurso de juro parado.\n([Agência Gov / IBGE](https://agenciagov.ebc.com.br/noticias/202611/inflacao-desacelera-e-fica-em-0-14-em-outubro))\n\nDo outro lado, **o custo de construir acelerou**: INCC-M de **0,35% em outubro** (contra 0,25% em setembro) e\n**6,75% em 12 meses** — mais de dois pontos acima do IPCA. Materiais para estrutura saltaram de 0,07% para\n0,72% no mês; vidro subiu 2,96%.\n([Brasil 61 / FGV](https://brasil61.com/n/custo-da-construcao-sobe-0-35-em-outubro-aponta-fgv-bras2617395))\n\n**Em Goiânia, o estoque está secando.** No primeiro semestre de 2026 a capital vendeu **7.323 unidades** e\nlançou **6.606** — vendeu mais do que lançou, e o estoque disponível recuou **6%** sobre o fim de 2025. Só no\nresidencial foram **7.219 unidades, alta de 42%** contra o mesmo período de 2025: o maior semestre da série\nhistórica local, e a **4ª posição entre as capitais brasileiras** em volume. O país cresceu 5,4% no mesmo\nperíodo (CBIC) — Goiânia cresceu quase oito vezes a média nacional. Os lançamentos, porém, vieram 16,4%\nmenores que no segundo semestre de 2025.\n([Jornal Opção, 25/09/2026](https://www.jornalopcao.com.br/goiania/mercado-imobiliario-goiania-vendas-estoque-marista-871938/))\n\n**E o preço acompanhou.** Pela Ademi-GO, o m² residencial de Goiânia chegou a **R$ 11.681** no acumulado de\n2026 até junho, **alta de 7,4%** sobre o fechamento de 2025 (R$ 10.872) — e **105% acima de 2021**, quando\nestava em R$ 5.687. No recorte Bueno + Marista + Oeste + Jardim Goiás, a média sobe para **R$ 13.147/m²**, e\no Marista se aproxima de R$ 14 mil, com unidades comercializadas a **R$ 18 mil e R$ 19 mil/m²**. Bueno e\nMarista, sozinhos, concentram **31,8% de toda a oferta da cidade**.\n([Jornal Opção, 23/09/2026](https://www.jornalopcao.com.br/ultimas-noticias/bueno-e-marista-concentram-318-dos-imoveis-a-venda-em-goiania-metro-quadrado-chega-a-r-116-mil-870840/))\n\n**O dado que quase ninguém está usando** está no informe de outubro do FipeZAP. Goiânia subiu **6,34% em 12\nmeses** (preço médio de R$ 8.531/m², amostra de 28.726 anúncios), acima da média das 56 cidades (+5,44%). Mas\npor bairro a ordem se inverte: **Jardim América +10,0%** e **Setor Oeste +8,3%** valorizaram mais rápido que\n**Marista +3,4%** e **Bueno +2,6%**. Os bairros consagrados já precificaram; o ganho marginal migrou para a borda.\n([Informe FipeZAP outubro/2026](https://downloads.fipe.org.br/indices/fipezap/fipezap-202610-residencial-venda.pdf))\n\n| Bairro de Goiânia | R$/m² (out/2026) | 12 meses |\n|---|---|---|\n| Marista | 11.502 | +3,4% |\n| Sul | 10.933 | +4,1% |\n| Jardim Goiás | 9.932 | +4,3% |\n| Bueno | 9.849 | +2,6% |\n| Setor Oeste | 8.833 | **+8,3%** |\n| Jardim América | 8.812 | **+10,0%** |\n\n> **Nota de método, para o Revisor:** há duas séries de m² neste boletim e elas **não** são comparáveis.\n> O FipeZAP (R$ 8.531/m²) mede **preço de anúncio de usado pronto**. A Ademi-GO (R$ 11.681/m²) mede\n> **oferta de lançamento**. Usar a série certa para cada argumento, e nunca somar nem cruzar as duas numa\n> mesma peça.\n\n---\n\n## 2. Impacto prático\n\n### Para o comprador de alto padrão em Goiânia\n- **Não há alívio de parcela no curto prazo.** A Selic ficou em 13,75% e a próxima decisão é só em 9 de\n  dezembro. Quem estava esperando o juro cair para fechar tem agora um custo de espera concreto: o m² da\n  cidade subiu 7,4% em seis meses (Ademi-GO). **Esperar seis meses custou mais do que o corte de 0,25 ponto\n  que não veio.**\n- **O que a Adão pode afirmar sobre financiamento, e só isso:** a Caixa publica na página oficial\n  financiamento de **até 90% do valor do imóvel**, prazo de **até 35 anos**, e uso de FGTS para amortizar e\n  pagar parte das prestações. **A taxa efetiva não é publicada** — depende de linha, relacionamento e análise\n  de crédito, e só sai no simulador. Nenhuma peça da Adão cita taxa de juros.\n  ([Caixa](https://www.caixa.gov.br/voce/habitacao/Paginas/default.aspx))\n- **A escassez é geográfica, não financeira.** 31,8% da oferta da cidade está em dois bairros. Quem quer\n  andar alto, melhor orientação solar ou planta privilegiada no Marista ou no Bueno está disputando dentro de\n  um terço da cidade, com estoque caindo 6% e lançamentos 16,4% menores. A causa é estrutural: o Plano\n  Diretor restringiu as manchas de adensamento justamente em Bueno, Marista e Oeste.\n  ([O Popular, 19/01/2025](https://opopular.com.br/economia/imovel-em-goiania-segue-entre-maiores-valorizac-es-do-pais-1.3221738))\n- **A próxima tabela sai mais alta.** INCC-M a 6,75% em 12 meses, com material de estrutura a 0,72% no mês,\n  significa que o lançamento seguinte nasce com custo maior que o atual. Para quem compra na planta, é\n  argumento de urgência factual.\n\n### Para o investidor de alto padrão em Goiânia\n- **Ganho real, medido:** imóvel em Goiânia +6,34% em 12 meses (FipeZAP) contra IPCA de 4,63% — cerca de\n  **1,7 ponto de ganho real**, só de preço, sem contar aluguel.\n- **O argumento contra a renda fixa existe, mas tem que ser dito com honestidade.** A Selic a 13,75% rende\n  mais, nominalmente, que os 6,34% de valorização do FipeZAP. O que a Ademi-GO afirma é diferente: pela série\n  de **oferta de lançamento**, a valorização de 2026 deve fechar em **dois dígitos**, acima da Selic — e foram\n  dois anos consecutivos de alta de 18%, com o m² dobrando em cinco anos (+105%). **A comparação honesta é\n  \"lançamento bem escolhido vs. Selic\", não \"imóvel vs. Selic\".**\n- **Onde está o ganho marginal agora:** Jardim América (+10,0%) e Setor Oeste (+8,3%) rodam acima de Marista\n  (+3,4%) e Bueno (+2,6%) nos últimos 12 meses do FipeZAP. E a Ademi-GO aponta o transbordo da demanda para\n  **Serrinha (R$ 11.300/m²), Coimbra e Jardim América**. Entrada mais barata na mesma infraestrutura.\n- **O perfil do comprador mudou, e isso é dado.** O capital do agro goiano migrou de terra para ativo urbano\n  como preservação de patrimônio e geração de renda. O sinal mais claro: o **Dual O.M. Stay**, da OM\n  Incorporadora, no Setor Marista, **vendeu todas as unidades em quatro horas** no lançamento, com tipologia\n  Double Suites (21 m² + 40 m² integráveis, ~60 m²) feita para render aluguel.\n  ([Curta Mais, 27/02/2026](https://curtamais.com.br/goiania/mercado-imobiliario-de-goiania-acelera-e-unidades-somem-em-poucas-horas-de-lancamento/))\n- **Sinal de atenção, para ser dito e não escondido:** o VGV do semestre ficou em **R$ 4,1 bilhões, contra\n  R$ 4,2 bilhões no 1S2025**, apesar de 42% mais unidades residenciais vendidas. Mais unidade com faturamento\n  igual signific
