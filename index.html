Os dois números são da **mesma série** (FipeZAP, 12 meses até out/2026), então a comparação é legítima.\n\nAlternativa de capa, se a direção preferir a régua inteira a um par: `JARDIM AMÉRICA +10,0% · OESTE +8,3% · JARDIM GOIÁS +4,3% · SUL +4,1% · MARISTA +3,4% · **BUENO +2,6%**`. Último colocado, e o único abaixo da média da cidade. A régua se explica sozinha e não precisa de adjetivo.\n\n**Público:** comprador analítico e investidor de Goiânia — o que abre o Zap antes de abrir o Instagram, calcula R$/m² de cabeça e desconfia de folheto. Não é o público da Ávolli (que é o do sonho, do pôr do sol e da modelo de terno claro). É o público da **Adão**, que tem divisão de inteligência e pode falar com números.\n\n**A tese, em quatro movimentos:**\n\n1. **Abre pela objeção, não pela virtude.** A régua completa de Goiânia em 12 meses (FipeZAP out/26): Jardim América **+10,0%**, Setor Oeste **+8,3%**, Jardim Goiás **+4,3%**, Sul **+4,1%**, Marista **+3,4%**, **Bueno +2,6%**. Média da cidade: **+6,34%**. O Bueno é o **último colocado** e o único **abaixo da média**. Dito assim, soa como argumento contra. É o gancho — e a defasagem é mensurável, não retórica.\n2. **Separa o usado do novo, e troca \"sobe mais\" por \"acaba antes\".** Bueno e Marista concentram **31,8%** de toda a oferta à venda da cidade (Ademi-GO): o que está abundante no Bueno é apartamento **pronto**. Enquanto isso o estoque da cidade caiu **6%** no 1S2026 e os lançamentos vieram **16,4% menores** que no 2S2025 (Brain/Ademi-GO) — Goiânia vendeu mais do que lançou. E a causa estrutural que a Ademi-GO aponta é a restrição de adensamento do Plano Diretor em Bueno, Marista e Oeste (via O Popular, jan/25), que atinge justamente o **novo**.\n\n   **Esta é a correção mais importante da tese:** o argumento não é que o Bueno vai subir mais — o percentual não sustenta isso. É que o produto **novo** no Bueno vai acabar antes. \"Acaba antes\" é mais verdadeiro que \"sobe mais\", e não depende do percentual fraco.\n3. **Mostra o ativo pelo que ele é juridicamente.** O Óra Vaca Brava é um **Alvará de Construção nº 45.753, de 10 de outubro de 2026**, para 44 pavimentos e 30.877,32 m² construídos sobre 2.250 m² de terreno no Bueno. São **13,7 m² construídos para cada metro de terreno**. Quem compra aqui não está comprando um apartamento a mais no estoque do Bueno — está comprando uma licença que o bairro está deixando de emitir.\n4. **Fecha no preço, com honestidade.** Numa unidade nomeada, não numa faixa: o Home de 51,93 m² do 28º pavimento sai a **R$ 723.187**, ou **R$ 13.926/m²** — o menor metro quadrado das 10 simuladas. É 1,4x o anúncio médio de usado do Bueno — e é a comparação errada. Contra o recorte de bairros nobres da Ademi (R$ 13.147/m²) são 1,06x a 1,36x, e fica abaixo do teto do Marista (R$ 18–19 mil/m²). Com 47 mensais a partir de R$ 490 e financiamento só em jan/31, com a Selic parada em 13,75% e o INCC correndo a 6,75% ao ano.\n\n**Por que este ângulo e não outro:**\n- **Não dá para competir com a Ávolli no terreno dela.** Eles têm render de R$ 100 mil, Greg Bousquet, Jayme Bernardo e uma campanha fotografada. A Adão não ganha de \"Conectado por natureza\" fazendo uma versão mais escura de \"Conectado por natureza\".\n- **A brecha é factual, não estética.** Varri as 7 peças públicas deles (carrossel institucional, carrossel jurídico, carrossel saúde, stories): **não há um único número de mercado em nenhuma.** Todo argumento de valorização é adjetivo (\"mais valorização\", \"a força do entorno\"), e o único número que arriscaram — os 140% — tem a nota de rodapé que não o sustenta. A Adão tem radar com fonte e data de validade. É a única coisa que ela tem e eles não.\n- **Casa com o Formato Padrão Vencedor** da gaveta 1 (Sessão A, 2026-11-17), que pede um ativo nomeado como eixo, um slide de dado de mercado com fonte visível e um slide de objeção respondida. Aqui a objeção **é** a capa.\n- **Serve aos três produtos.** O mesmo argumento vende Stay, Home e Office Park, porque é sobre o endereço e a licença, não sobre a planta.\n\n### Desdobramento por peça (para quando a direção de arte estiver definida)\n- **Carrossel** — a tese acima, com o slide de R$/m² como peça central.\n- **Vídeo vertical** — o gesto arquitetônico: a piscina em balanço e o átrio de elevadores panorâmicos. É o que a foto estática não entrega.\n- **Arte do simulador** — os mesmos valores oficiais, legíveis. Com as duas correções de unidade que a arte deles errou, e com a marcação de \"sujeito à tabela vigente\" visível, não escondida em corpo 6.\n\n---\n\n## 7. Pendências declaradas\n\n| # | Pendência | Estado |\n|---|---|---|\n| 1 | **Registro de incorporação e matrícula** | Não existem em nenhum material. O próprio book declara que a comercialização só começa após o registro. Sai `[A CONFIRMAR]` em toda peça. Protótipo — o diretor já sabe. |\n| 2 | **Tabela de vendas oficial do Óra** | A pasta `1 - Tabela de Vendas` está vazia. A única fonte de valor publicada são os 9 simuladores e a pág. 41 da apresentação. Toda peça marca \"valores de nov/2026, sujeitos à tabela vigente\". |\n| 3 | **Prazo de entrega da obra** | Não consta do book nem do memorial. O financiamento das simulações começa em jan/31, mas **isso é cronograma de pagamento, não data de entrega**. Não inferir. |\n| 4 | **Taxa de juros do financiamento** | A Caixa publica LTV de até 90% e prazo de até 35 anos, mas não a taxa. Em peça: citar LTV e prazo, nunca taxa (radar, Sessão A). |\n| 5 | **Métrica de Instagram** | A gaveta 1 declara que nenhum outlier foi isolado — o grid estava bloqueado. O \"Formato Padrão Vencedor\" é inferência estrutural, não padrão validado. Levei isso em conta, não como lei. |\n| 6 | **Direção de arte** | Reprovada pelo diretor em 2026-11-17 (\"cara de padrão ou modelo pronto\"). Carrossel, vídeo e arte do simulador estão **retidos** até a nova direção. Esta análise independe dela. |\n| 7 | **Formato do carrossel** | O briefing do módulo 4.1 pede 5 slides; a gaveta 1 recomenda 7. Decisão do diretor. |\n"}, {"arquivo": "03_catalogo_de_assets.md", "modulo": "04_lancamento", "titulo": "Catálogo de assets do Óra Vaca Brava — o que eu usaria, por nome de arquivo", "texto": "# Catálogo de assets do Óra Vaca Brava — o que eu usaria, por nome de arquivo\n\n**Agente:** DIRETOR DE ARTE · módulo 4.1 · 2026-11-17\n**Origem:** Drive público Ávolli, pasta `1 - Óra Vaca Brava - Ávolli + Bild`.\n**Status:** nada baixado além dos documentos e dos 9 simuladores. Esta é a lista de compra — baixar só quando a direção de arte estiver aprovada.\n**Como baixar:** `.venv/bin/gdown -O <destino> <id>`, ou, se o gdown for recusado por limite, `curl -sL -o <destino> \"https://drive.usercontent.google.com/download?id=<id>&export=download&authuser=0\"`.\n\n---\n\n## Já baixado · `entregas_reais/04_lancamento/_material/`\n\n```\ndocs/BOOK_DIGITAL_ORA_VF_B.pdf                           55 pág.   1wPNqP5yud0wleQQmobYVOB3YbTK40K9h\ndocs/Memorial_Descritivo_T30_R00_V2.pdf                  27 pág.   1T49IaFjfdkRycoP3xSnemacRmPvd4sPu\ndocs/Avolli_Apresentacao_Imobiliarias_Pos_Meeting.pdf    46 pág.   1yoHnvsiY4MWJD7HjkWZN84U_oe8FURl-\ndocs/PASTA_DE_PLANTAS_V3.pdf                                       1qCzV49_eO9iHknTxB_ig6_nxuGvbdD7B\nsimuladores/  (9 PNG — ver simulacoes.json)\n```\n\n---\n\n## 1. Para o carrossel — fotos fixas\n\nA tese do carrossel é o endereço e a licença, não a decoração. Por isso a prioridade é **fachada e implantação urbana**, não decorado.\n\n### Primeira escolha — o gesto arquitetônico\n| Arquivo | ID | Por quê |\n|---|---|---|\n| `05_GPE_T30_FACHADA_DE_BAIXO_PARA_CIMA_EF.jpg` | `1pAjkoyUA3HEc3_OGELvArNa633s12QxC` | Contra-plongée na torre inteira. É a imagem que diz \"44 pavimentos\" sem escrever. **Capa.** |\n| `22_GPE_T30_EXTERNO_PISCINA01_EF_web.jpg` | `1H-OAuqxJyjg6TMaFKNqtbh_URyFgFjc0` | A piscina em balanço. Único atributo do projeto que não tem equivalente em Goiânia. |\n| `08_GPE_T30_ALAMEDA_E_MOBILIARIO_URBANO_EF.jpg` | `1oGZQitoWFxp6eSQc9eZ_uxCRk3pEQt7j` | Fachada ativa ao nível da calçada. Sustenta o argumento de bairro, não de condomínio. |\n| `15_GPE_T30_VISTA_VAZIO_EF_web.jpg` | `1or4gYeN1YNOoiEWBB0dVg1CIOt9Fr901` | O vão central e os elevadores panorâmicos. Peça de arquitetura pura. |\n| `01_GPE_T30_FACHADA_INTEIRA_EF.jpg` | `1teDqu3oQ8VXQy271saRsgVzAUdULr_MM` | Fachada inteira, enquadramento neutro. Reserva para o slide de dado. |\n\n### Segunda escolha — se a direção pedir ambiente\n| Arquivo | ID |\n|---|---|\n| `10_GPE_T30_LOBBY_RECEPCAO_EF_web.jpg` | `1PNjCqGanQxMoyKjOR4IxQMRC-MBfWgXd` |\n| `25_GPE_T30_COWORKING_EF_web.jpg` | `1x5f4HyviRXv34PCw44bWCUAbR9UI2Yhi` |\n| `27_GPE_T30_SKY_BAR_C01_EF_web.jpg` | `1FR45UAleEScfrVBeG63zJpa7bKbxPEsq` |\n| `16_GPE_T30_ACADEMIA_OP01_EF_web.jpg` | `184LMstXLOnXE0lSidTwfCHbCpI-QKdp5` |\n| `19_GPE_T30_ESPACO_ZEN01_SAUNA_EF_web.jpg` | `1RqLUZRzA_pzLaCBROcj0iFyvdGdq5eIn` |\n| `42_GPE_T30_M2_LAVANDERIA_EF_web.jpg` | `1dP9_3FU1anBX3Be4xZMHK0riyBBzlzoy` |\n\n### Vista aérea — para o slide de localização\n| Arquivo | ID |\n|---|---|\n| `01 - Vista ae?rea do parque.png` | `1sPSu1pZWr0ed-mYjFVg-1tlrlnfVcaZM` |\n| `10 - GPE_T30_FOTOMONTAGEM_OP01_EF.jpg` | `1Z1R4U_VvmYrtf4klIVvmdy7Gzu4ETImW` |\n\n> **Atenção:** a pasta `3 - Áreas comuns` tem duas versões de cada ambiente — os `*_web.jpg` (comprimidos) e a subpasta `Humanizadas/` (PNG, com pessoas, nomes descritivos tipo `Academia Reebok com treino funcional.png`). As humanizadas são mais bonitas, mas **todas têm gente de banco de imagem**. Para uma peça da Adão que fala de dado, as versões vazias (`_web`) são mais coerentes. Decisão de direção.\n\n---\n\n## 2. Para o vídeo vertical 1080x1920\n\nO vídeo tem que entregar o que a foto não entrega: movimento sobre a torre e sobre a piscina em balanço.\n\n### Base — vídeos de produto da Ávolli\n| Arquivo | ID | Uso |\n|---|---|---|\n| `FACHADA DE BAIXO PARA CIMA.mov` | `1jh6Pm4ecie04j6wINlfGxZ1nG71WT2oW` | **Abertura.** Subida pela fachada. Corta em vertical sem perder o assunto. |\n| `FACHADA_INTEIRA.mov` | `1XMd_1_N00w_ZN5AFN8w_VQbwPc49JGC6` | Plano de estabelecimento. |\n| `FACHADA_PASSEIO_LOBBY_PISCINA.mov` | `1Xpm0FfjRYFKD4U5ATtrJ-YlofAR-9sUw` | Travelling calçada → lobby → piscina. É o percurso da tese inteira num plano só. |\n| `ANIMAÇÃO LOBBY.mp4` | `11f_GoMqDe_wHGy40RXQ7XAJ8FIBCkZb3` | Corte de respiro. |\n| `ANIMAÇÃO LOUNGE COFFEE.mp4` | `1PCYcRVQYB-99kwxAG1SRRxFrvu77od7-` | Corte de respiro. |\n| `ANIMAÇÃO SPORT BAR.mp4` | `11Zt3z1ghWdN327Sbmo0e1V_yXSOeSHrQ` | Rooftop. |\n| `ATRIO ÓRA VACA BRAVA.mp4` | `17eJe9aP6bzD5pQcXcXT8C38XWQVjjTZp` | Átrio e elevadores panorâmicos. |\n| `ACADEMIA ÓRA VACA BRAVA.mp4` | `1UK_dmXueKqSgM0z7wVuJDKC4UaIyb5eX` | Reebok. |\n| `VIDEO DA MAQUETE - BILD(1).mp4` | `1BzJCoblREgCFzK_TRLNGNmo-OBbp3edz` | Maquete física — material raro, dá textura de \"obra real\". |\n\n### O que NÃO usar\n- `9 - Videos Produto / [ÁVOLLI] ÓRA - Vídeo produto_FHD.mp4` e as três `Pilula - *.mov` — são **peças finalizadas da Ávolli**, com a marca, a trilha e o lettering deles. Reusar é republicar a campanha alheia, não fazer peça da Adão. **Proibido pela regra 3 do briefing.**\n- `1 - Teaser / [Avolli] Teaser *.mov` — mesmo caso.\n- `10 - Videos Time de Vendas` — 27 depoimentos. Só o da **GUTTYANE** está liberado (inventário, linha 78). Não entra neste módulo.\n\n### Nota de produção\nOs `.mov` são horizontais. Em 1080x1920 cada um precisa de crop central com pan, ou de moldura. **A moldura preta com o fio vermelho é a saída coerente com o design system** — mas a direção de arte está em revisão, então isso fica em aberto.\n\n---\n\n## 3. Para a arte do simulador\n\nFundo. Um por tipologia, ecoando a escolha deles sem copiar o layout:\n\n| Tipologia | Render | ID |\n|---|---|---|\n| ÓRA STAY | `11_GPE_T30_VISTA_CAFE_PARA_VAO_EF_web.jpg` | `10ec8XoIwOR5AWhGPR5LdyU_K54sfg4KI` |\n| ÓRA HOME | `23_GPE_T30_EXTERNO_PISCINA02_EF_web.jpg` | `1exZ9g-calzuYWfWlm3zP3PYzjdamrauR` |\n| ÓRA OFFICE PARK | `14_GPE_T30_SALA_REUNIAO_EF_web.jpg` | `110Q4ht6F3SWtHBtv2crxaQtcRtI-9s_8` |\n\nAlternativa para o Home, do decorado fotografado de verdade (não render) — `4 - Decorados / 2S - Borboleta - 56m2 / Fotos / Vertical`, 23 arquivos `221A92xx.jpg`. Foto real vale mais que render numa peça que fala de dado.\n\n---\n\n## 4. Logos\n- Ávolli, SVG por cor: `7 - Logos` — Marrom Café, Ocre, Off White, Verde Luz, Verde Militar, Verde Oliva, Verde Ávolli.\n- Óra: `7 - Logos / Óra Vaca Brava / Logo Óra.pdf` — `1dKzxeK77FqJDjjniiKSHYEiJVjsxe3JR`.\n- Bild: pasta **vazia**. Se a peça precisar citar a Bild, cita por extenso, sem marca.\n\n> O design system proíbe logo grande sobre foto (`proibicoes[0]`). Vale para o logo da Adão **e** para o da Ávolli: a peça é da Adão divulgando o lançamento, não um anúncio da incorporadora.\n\n---\n\n## 5. O que o Drive NÃO tem\n- Tabela de vendas do Óra — pasta `1 - Tabela de Vendas` **vazia**.\n- Registro de incorporação, matrícula, número de cartório — **nenhum arquivo, em lugar nenhum**.\n- Manual de marca ou diretriz de divulgação da Ávolli — só pastas de logo.\n- Qualquer `.pptx` — todo material fechado é PDF.\n"}, {"arquivo": "04_leitura_design_avolli.md", "modulo": "04_lancamento", "titulo": "Leitura do design da Ávolli — o padrão de lançamento de alto padrão em Goiânia", "texto": "# Leitura do design da Ávolli — o padrão de lançamento de alto padrão em Goiânia\n\n**Agente:** DIRETOR DE ARTE · pedido extra do diretor · 2026-11-17\n**Para:** definir a nova direção da Adão sabendo de que ela se diferencia.\n**Peças analisadas:** 4 páginas do `BOOK_DIGITAL_ORA_VF_B.pdf`, carrossel institucional `CARROSSEL ORA` (3 lâminas), carrossel `PÚBLICO JURÍDICO` (2 lâminas), carrossel `PÚBLICO SAÚDE`, `Stories ORA10`, e as 9 artes de `5 - Simuladores`.\n**Não é referência para copiar.** É mapa do que já está ocupado.\n\n---\n\n## 1. O sistema deles, em seis decisões\n\n### 1.1 Peso como hierarquia, não tamanho\nA assinatura tipográfica mais forte deles. Uma frase de quatro linhas, **mesmo corpo do começo ao fim**, com as duas primeiras palavras em bold e o resto em light:\n\n> **HÁ ENDEREÇOS**\n> QUE TAMBÉM\n> FAZEM PARTE DA SUA\n> APRESENTAÇÃO.\n\nCaixa alta, uma única família geométrica sem serifa, entrelinha apertada, tracking generoso. Zero mudança de corpo. É barato, é confiante e lê bem no celular — o olho pega o bold primeiro e desce sozinho. **A coisa mais inteligente que eles fazem.**\n\n### 1.2 O fio que sai do quadro\nDebaixo do bloco de texto corre um fio branco de 1px que **não termina no texto: segue até a borda sangrada da peça**. Nas lâminas de produto, esse mesmo fio vira linha de chamada, apontando para partes da torre com rótulos (`ÓRA HOME`, `ÓRA STAY`, `ÓRA OFFICE PARK`). Anotação de arquiteto usada como recurso gráfico.\n\nÉ o paralelo direto do **fio vermelho de 2px** da Adão — mas hoje a Adão usa o fio como traço curto de 44px, decorativo. A Ávolli usa o fio como **vetor**: ele leva o olho para fora da peça ou para dentro da foto.\n\n### 1.3 Zero painel\nEm nenhuma das peças institucionais há caixa, tarja, faixa ou bloco de cor atrás de texto. Todo texto é branco direto sobre a foto, segurado pela própria foto (céu, sombra de fachada, área escura do render). Exige escolher a foto pensando no texto. **É a maior diferença de maturidade em relação a uma peça de imobiliária média** — e é a tentação que o layout anterior da Adão caiu, com o bloco off-white.\n\n### 1.4 Cor: quase nenhuma\nNas peças institucionais a paleta é **só branco sobre fotografia**. A cor toda vem da imagem: verde da vegetação, céu de fim de tarde, bege do concreto. Não há cor de marca aplicada.\n\nO **verde-limão** (chartreuse, algo como `#C9DC6E`) aparece **exclusivamente nos simuladores** — na linha destacada da tabela, no cifrão, no rótulo da tipologia e no valor do financiamento. É um acento de função, não de marca: marca \"o número que importa\". Uso disciplinado.\n\n### 1.5 Fotografia: contra-plongée sempre\nTodas as peças institucionais são feitas de baixo para cima. A pessoa entra no quadro em escala pequena contra a torre, roupa clara ou terno, luz de fim de tarde, lente aberta. O prédio é sempre o protagonista; a pessoa dá escala e aspiração. Em nenhuma peça a pessoa é o assunto.\n\n### 1.6 Logo subordinado\nO logo `ÓRA` fica no topo esquerdo, pequeno, branco, com `VACA BRAVA` em corpo mínimo encaixado no contraforma do Ó, e a tagline `CONECTADO POR NATUREZA` em caixa alta espaçada embaixo. Nunca grande, nunca centralizado sobre a foto. Mesma disciplina que o design system da Adão já exige.\n\n---\n\n## 2. Os simuladores — onde eles tropeçam\n\nAs 9 artes de simulador são 9:16 (5 em 1080x1920, 4 em 4500x8000) com render de fundo e **cartões de vidro fosco arredondados** (glassmorphism pesado) empilhados: um cartão-pílula com a tipologia e a metragem, e abaixo um cartão grande com o valor total e a tabela de pagamento.\n\n**O que funciona:** o número total é gigante e em peso fino, com os centavos em corpo pequeno sobrescrito. Bonito. A linha das 47 mensais vem com fundo verde-limão sólido — o olho vai direto pro número que decide a compra. Nas versões multimoeda, bandeirinhas minúsculas de Brasil, EUA e União Europeia identificam as colunas sem precisar de rótulo.\n\n**O que não funciona:**\n1. **Contraste.** Vidro fosco sobre render colorido e ocupado. No `Simulador_OFFICE_43m.png` o cartão fica quase transparente sobre o lobby iluminado e a tabela some. No `Simulador_STAY_32m.png` o verde-limão sobre vidro claro perde contraste.\n2. **O rodapé legal é ilegível.** Quatro linhas em corpo minúsculo e baixo contraste no canto inferior esquerdo. É justamente a ressalva que protege o cliente e a imobiliária — esconder isso é erro de ofício, não escolha estética.\n3. **Erros de dado.** `Simulador_HOME_52m.png` traz título \"51,93 m²\" e rodapé \"Unidade 4008 · 51 m²\", quando a 4008 tem 51,89 m² e quem tem 51,93 m² é a 2807. Os dois simuladores da 916 discordam entre si sobre a área (27 m² vs. 27,05 m²), e a planta diz 27,11 m². **Isso é o que acontece quando o layout é lindo e ninguém confere contra a fonte.**\n\n---\n\n## 3. A brecha\n\nVarri as sete peças públicas deles. **Não há um único número de mercado em nenhuma.**\n\nTodo argumento de valorização é adjetivo: *\"mais valorização\"*, *\"a força do entorno\"*, *\"lazer no 41º andar é sinônimo de mais valorização\"*, *\"proximidade é sinônimo de valor\"*. O único número que arriscaram — **140% de evolução nominal do entorno, 2014→2025** — está na apresentação para imobiliárias (pág. 09) com uma nota de fonte ABRAINC/GeoBrain que cobre **jan-set/2024 contra jan-set/2023**. Um ano de fonte para onze anos de afirmação.\n\nEles têm render de altíssimo custo, Greg Bousquet, Jayme Bernardo, campanha fotografada e uma academia Reebok. **O que eles não têm é prova com fonte e data de validade.** A Adão tem — é literalmente a gaveta 2.\n\n---\n\n## 4. O que eu levaria para a nova direção (estrutura, nunca conteúdo)\n\n1. **Peso como hierarquia dentro da mesma linha.** Bodoni Moda 600 nas duas primeiras palavras e 500 no resto, mesmo corpo. Resolve o problema de \"Bodoni nunca abaixo de 56px\" sem encolher nada.\n2. **Promover o fio vermelho de traço a vetor.** Hoje são 44px decorativos. Fazer o fio de 2px correr até a sangria, ou virar linha de chamada apontando para um ponto da foto. Mesmo token, uso incomparavelmente mais ousado. **Custo zero no design system.**\n3. **Matar o painel.** O bloco editorial off-white é o que faz a peça parecer modelo pronto. Texto direto sobre foto escolhida para isso, com a foto fazendo o trabalho do painel.\n4. **Linha de chamada como recurso de dado.** A anotação de arquiteto deles existe para nomear andares. Na Adão ela nomearia **números**: o fio vermelho saindo do \"R$ 13.926/m²\" e apontando para o 28º pavimento na foto da torre. É o mesmo gesto a serviço de outra coisa — o que é adaptar, não copiar.\n5. **O rodapé legal como elemento de design, não como culpa.** Eles escondem; a Adão expõe. Rodapé legível é diferencial de confiança numa categoria que esconde letra miúda por hábito.\n\n## 5. O que eu NÃO levaria\n- **Glassmorphism.** É a estética mais datada do conjunto e falha em contraste.\n- **O verde-limão.** É cor de marca deles. A Adão tem `#C10F0F`.\n- **Contra-plongée com modelo entrando em quadro.** É a campanha deles. Repetir é fazer versão mais pobre do original.\n- **Caixa alta em bloco de quatro linhas.** Funciona na geométrica sem serifa deles. Em Bodoni Moda, caixa alta em quatro linhas fecha os contraformas e vira mancha.\n"}, {"arquivo": "ESTADO_SESSAO_C.md", "modulo": "04_lancamento", "titulo": "Estado da Sessão C — Lançamento Óra Vaca Brava", "texto": "# Estado da Sessão C — Lançamento Óra Vaca Brava\n\n**Atualizado:** 2026-11-18\n**Para quem nunca viu o projeto.** Leia `CONTINUIDADE.md` na raiz primeiro; ele explica a agência inteira. Este documento cobre só o módulo do lançamento e é suficiente para retomar o trabalho do zero.\n\n---\n\n## 1. Quem eu sou e o que posso tocar\n\nSou a **Sessão C** da Agência Adão Action, responsável pelo **lançamento Óra Vaca Brava** — torre de uso misto da incorporadora Ávolli em parceria com a Bild, na Rua T-30, Setor Bueno, Goiânia.\n\n**Minha pasta é `entregas_reais/04_lancamento/` e só ela.** Outras três sessões escrevem ao mesmo tempo em outras pastas:\n\n- **Sessão A** — `cerebro/01_*`, `cerebro/02_*`, `entregas_reais/01_inteligencia/`, `entregas_reais/02_boletim/`\n- **Sessão B** — `entregas_reais/03_revenda/`, `acervo_drive/`, `cerebro/03_banco_de_pautas.json`\n- **Coordenadora** — `ferramentas/`, `painel_diretoria/`, `cerebro/00_*`, `cerebro/04_*`, `dados/`, raiz\n\n**Nunca edite `ferramentas/render_carrossel.mjs`.** A Sessão B o altera para a capa de revenda. Eu uso um fork na minha pasta, explicado na seção 3.\n\nLeio `cerebro/` à vontade; escrevo só na minha pasta. A única exceção foi uma correção de três pontos no `CONTINUIDADE.md`, feita a pedido explícito da coordenação.\n\n---\n\n## 2. O que foi entregue\n\n### Peças finais\n| O quê | Caminho | Formato |\n|---|---|---|\n| Carrossel do Óra | `carrossel/slide-01..08.png` | 8 PNG · 1080x1350 |\n| Reel para story e feed | `reel/ora_vaca_brava_reel.mp4` | 1080x1920 · 30,2 s · 8 planos · **sem trilha** |\n| Artes de simulador | `simulador/simulador_ra_{stay_2702,home_2807,office_park_303}.png` | 3 PNG · 1080x1350 |\n\n**A sequência do carrossel:**\n1. DE FRENTE PRO PARQUE · *Vaca Brava* — aérea do Parque Vaca Brava\n2. MORAR / ALUGAR / *trabalhar* — fachada; mapeia Home, Stay e Office\n3. PISCINA · *climatizada* — deck e raia com a cidade ao fundo\n4. REEBOK 250 M² — academia\n5. **POR DENTRO — interior do decorado 2S de 56 m² (foto real, não render)**\n6. COWORKING — conveniência\n7. 41º ANDAR — sky bar\n8. R$ 490 POR MÊS — a condição, com o logo da Adão\n\n**O slide 5 foi a última mudança.** Até 18/11 era o spa. Eu mesma levantei a lacuna: o carrossel não mostrava nenhum interior de apartamento, só áreas comuns — e num lançamento isso é grave, porque a pessoa compra o que ainda não existe, e foto real de decorado prova padrão de acabamento de um jeito que render nenhum prova. O spa saiu porque dividia território de bem-estar com a Reebok no slide 4; o coworking ficou por ser o único slide de conveniência.\n\n### Camada de dados e análise\n| O quê | Caminho |\n|---|---|\n| As 10 unidades simuladas, auditadas por script | `simulacoes.json` |\n| Travas editoriais R1 a R6 do lançamento | `regras_editoriais.md` |\n| Análise do empreendimento, da Ávolli e da Bild | `01_analise_ora_vaca_brava.md` |\n| Levantamento bruto dos simuladores (superado; mantido como trilha de auditoria) | `02_simuladores_ora.json` |\n| Catálogo de renders e vídeos do Drive, por ID | `03_catalogo_de_assets.md` |\n| Leitura do design da Ávolli | `04_leitura_design_avolli.md` |\n| Tese de mercado reprovada, empacotada para a Sessão B | `insumo_tese_de_mercado.md` |\n| Carrossel e reel do ângulo reprovado | `_arquivo_angulo_mercado/` |\n\n### Material de origem\n`_material/` tem os 4 PDFs oficiais, os 9 PNGs de simulador da Ávolli, 19 renders (os recortes 4:5 têm prefixo `c_`), 23 fotos do decorado, 5 vídeos, os cartões do reel e a árvore completa do Drive em `ora_drive_tree.txt`.\n\n**São ~2,4 GB**, quase tudo em dois `.mov` ProRes de 476 MB e 1,4 GB. Se precisar de espaço, esses dois saem primeiro: o reel já está montado e não depende mais deles.\n\n---\n\n## 3. Como eu trabalhei — o que você precisa saber para não repetir meus erros\n\n### O fork do renderizador, e a armadilha da RAIZ\nUso `render_ora.mjs`, cópia do `ferramentas/render_carrossel.mjs` dentro da minha pasta, para não colidir com a Sessão B. Duas diferenças: o fio vermelho vira régua curta sobre foto (R14) e um slide pode levar o logo da Adão.\n\n**O original calcula `RAIZ` subindo um nível; o meu precisa subir dois**, porque mora duas pastas abaixo da raiz:\n\n```js\nconst RAIZ = resolve(dirname(fileURLToPath(import.meta.url)), \"../..\");\n```\n\nCopiei sem corrigir isso na primeira vez. **As oito fotos sumiram e os slides saíram pretos com o logo quebrado** — e o log não acusou nada, porque um `src` que não resolve não é erro de execução.\n\n### Download do Drive, e a falha silenciosa\nTrês passos, nesta ordem:\n\n1. **Listar** — `_material/drive_ls.py <FOLDER_ID> <profundidade>`, que lê a pasta pública sem login. O `gdown` estoura cota em pasta grande.\n2. **Baixar arquivo pequeno** — `https://drive.usercontent.google.com/download?id=<FILE_ID>&export=download`\n3. **Baixar arquivo grande** — a URL acima devolve a **página HTML de confirmação de antivírus**, não o arquivo. O download sai com **2,5 KB e parece ter funcionado**: o `curl` retorna 0 e o arquivo existe. Use `_material/drive_get.py`, que lê o formulário e refaz o pedido com o token.\n\n**Falha silenciosa é pior que falha barulhenta.** Depois de baixar em lote, confira: `find <pasta> -size -10k`.\n\n### Overlays de vídeo como PNG, não como texto\nO ffmpeg desta máquina **não tem `drawtext`**. Todo texto sobre vídeo é PNG transparente gerado pelo Playwright em `reel_cards.mjs` e composto com `overlay`. Vantagem: a tipografia do reel é exatamente a mesma do carrossel, com as fontes locais.\n\n### O script que se recusa a entregar número errado\n`_material/gerar_simulacoes.py` gera o `simulacoes.json`. Nenhum total e nenhum R$/m² é digitado: o total é a **soma do plano de pagamento** e o R$/m² é o total dividido pela área de planta. O script **aborta** se a soma não bater com o valor impresso na arte oficial, ou se algum valor em USD/EUR não bater com a cotação travada. O `simulador_cards.mjs` repete a conferência de soma antes de desenhar.\n\nFoi essa trava que pegou o meu erro de leitura. Veja a seção 6.\n\n---\n\n## 4. As duas viradas de ângulo\n\n### Versão 1 — tese de mercado. Reprovada.\nO Setor Bueno é o último da régua de valorização de Goiânia (+2,6% em 12 meses contra +6,34% da média da cidade), mas o que sobra ali é usado: o produto **novo** acaba antes, porque o Plano Diretor restringiu o adensamento. O ativo era apresentado como o Alvará de Construção nº 45.753.\n\n> *\"No carrossel do Óra vocês estão falando de alvará????? nada a ver. E falando de preço de simulador, nada a ver. Balanço? Nós precisamos chamar a atenção dos clientes.\"*\n\nVirou a **R07: peça de lançamento não é peça de mercado.** Alvará, Plano Diretor, régua de bairros, 31,8% da oferta e comparação de R$/m² com usado são registro de balanço, e o cliente de feed não lê balanço.\n\n**O que sobreviveu:** tudo, mudando de lugar. A tese está inteira em `insumo_tese_de_mercado.md` com as fontes, pronta para virar peça de marca ou de notícia — o lado dos 40% da semana, que é da Sessão B. O carrossel antigo é reaproveitável trocando as fotos, porque o argumento não depende do empreendimento. E as travas R5 e R6, que nasceram ali, continuam valendo (seção 5).\n\n### Versão 2 — lifestyle. Aprovada, com um corte.\n> *\"Aproveitar o que a Ávolli já produziu e só remodelar para o nosso modelo, não inventar.\"*\n\nProduto, endereço, lifestyle e condição de pagamento. O acervo caro que a Ávolli já produziu, vestido com a linguagem da Adão.\n\nDentro desse ângulo o diretor ainda cortou um slide, o `25 METROS em balanço`:\n\n> *\"Esquece detalhes que não mudam nada na hora da compra, como balanço — isso é informação que chama atenção de engenheiro, e não de comprador final. O comprador final quer saber se ele tem piscina.\"*\n\nVirou a **R13**. O slide virou **PISCINA** + *climatizada*. **Mantive os 25 metros da raia** no chip, e essa foi uma decisão de leitura: balanço é proeza estrutural, mas 25 metros de raia é o comprador sabendo que dá para nadar de verdade. Não é técnica, é benefício.\n\n### A lição\nO erro foi o mesmo nas duas vezes: **buscar o ângulo raro e defensável em vez do óbvio que o comprador quer ver.** Uma tese bem construída, com fonte em tudo, continua sendo a peça errada se o leitor não é analista.\n\n---\n\n## 5. De onde vem cada número\n\n**Nada foi inventado.** Nenhum preço, nenhuma data de entrega, nenhum número de cartório.\n\n| Dado | Fonte |\n|---|---|\n| Valores, parcelas e totais | 9 artes de `5 - Simuladores` do Drive + pág. 41 da apresentação para imobiliárias. **É a única fonte de valor publicada** — a pasta de tabela de vendas do Drive está **vazia** |\n| Áreas das unidades | Plantas individualizadas por final, em `2 - Book e Caderno de Plantas / Plantas Baixas`. A área está **no nome do arquivo** (`51,89M²_PH_APTO_TIPO_02Q_FINAL_8_EF.jpg`). É o desenho da unidade e **prevalece sobre tabela e sobre arte de simulador** |\n| Lazer, acabamentos, pavimentos | `Memorial Descritivo - T30_R00 _V2.pdf` — documento contratual |\n| Ficha técnica, assinaturas, alvará | `BOOK_DIGITAL_ORA_VF_B.pdf`, pág. 53 e 55 |\n| Dados de mercado (só no insumo arquivado) | `cerebro/02_radar_de_mercado.json`, da Sessão A |\n\n**A unidade que aparece nas peças:** Óra Stay de 33,56 m², unidade 2702. R$ 490 em 47 mensais, ato e 3 parcelas de R$ 8.900, total de R$ 503.517.\n\n**Cotações das artes multimoeda:** travadas em 06/11/2026, US$ 1 = R$ 5,4930 e € 1 = R$ 6,1400. São referenciais; o contrato é em real.\n\n### As travas editoriais que criei\nPor extenso em `regras_editoriais.md`, e legíveis por máquina em `simulacoes.json` → `_meta.regras_editoriais`, para o Revisor conferir.\n\n- **R1** — faixa derivada das 10 unidades **não é** faixa do lançamento. O empreendimento tem 424 unidades.\n- **R2** — citar unidade específica, com produto, área e pavimento. Nunca \"a partir de\".\n- **R3** — um R$/m² ancorado em unidade nomeada, nunca média das 10.\n- **R4** — Stay só com planta (pav. 12 ao 27). **A unidade 1101 está marcada como fora de peça**: o 11º é andar de lazer com 6 apartamentos e não tem planta no Drive.\n- **R5** — **nunca misturar série de usado com série de lançamento.** FipeZAP e Ademi medem anúncio de usado pronto; o Óra é obra a entregar.\n- **R6** — **a manchete carrega a régua junto com o número.** \"O Bueno subiu 2,6%\" sozinho faz o leitor achar que 2,6% é bom, e a peça mente por omissão mesmo com o corpo correto.\n\nR5 e R6 nasceram do ângulo reprovado e **sobrevivem a ele**.\n\n---\n\n## 6. Erros, e como cada um foi pego\n\nRegistrados porque o histórico de erro é material de apresentação, não sujeira a esconder.\n\n### Meus\n\n**1. Li 20 centavos errados.** No financiamento da unidade 4008 em dólar, li US$ 95.297,63; o valor é **95.297,83**.\n*Como foi pego:* o `gerar_simulacoes.py` divide cada valor em real pela cotação travada e compara com o que eu transcrevi, com tolerância de um centavo. Ele **abortou** e imprimiu a linha divergente. Fui conferir recortando a região da arte em resolução cheia (4500x8000) e o erro era meu, não da Ávolli.\n*O que mudou:* eu estava lendo de um preview reduzido a 1400px de altura. **Não ler número em preview reduzido** — recortar a região em resolução nativa.\n\n**2. As oito fotos sumiram do carrossel.** Copiei o renderizador para a minha pasta sem ajustar o cálculo de `RAIZ`.\n*Como foi pego:* abrindo os PNGs. O log imprimiu \"carrossel pronto · 8 slides\" sem um aviso sequer, porque um `src` que não resolve não é erro de execução. Só a folha de contato mostrou oito retângulos pretos.\n\n**3. Colisões tipográficas, cinco rodadas.** Acento do Ú e do Á atravessando o olho; o fio cortando a palavra ao meio em quatro slides diferentes; \"MÊS\", \"?\" e \"climatizada\" cortados na sangria; \"trabalhar\" sobre ALUGAR e \"Vaca Brava\" sobre DE FRENTE.\n*Como foram pegos:* todos abrindo o PNG, nenhum pelo log.\n*Causa recorrente:* eu calculava a posição do fio supondo que o herói tinha duas linhas, mas \"PRO PARQUE\" e \"POR DENTRO\" quebravam em três e duas linhas respectivamente. A fórmula é `fio_top = lockup_top + 34 (se houver olho) + 0,84 × display_px × número de linhas **renderizadas** + 40`.\n\n**4. Escrevi um script em `ferramentas/`**, que não é minha pasta. Movido para `_material/` assim que percebi.\n\n**5. Corpo de 20px ilegível sobre render claro.** Regra que ficou: **slide de foto não usa `corpo`** — o argumento longo vive nos slides escuros, e a foto carrega herói, olho e barra de specs.\n\n### No material oficial da Ávolli\nDocumentados em `simulacoes.json`, campo `divergencia`, e corrigidos nas nossas peças.\n\n**1. Unidade 4008 — anunciada com a área da 2807.** As duas artes dela discordam entre si: uma diz \"51,93 m²\" no título e \"51 m²\" no rodapé, a outra diz \"52 m²\" e \"51,93 m²\". A planta individualizada diz **51,89**.\n*Como foi pego:* cruzando o rodapé das artes com o nome do arquivo de planta. E 51,93 m² **é a área da unidade 2807** (`51,93M²_PH_APTO_T+28_FINAL_07_EF.jpg`) — parece que copiaram o número da simulação do 28º andar ao montar a do 40º.\n\n**2. Unidade 916** — uma arte diz 27 m², outra 27,05. A planta diz **27,11**. Nenhuma das duas bate.\n\n**3. Unidade 810** — arte diz 43 m², planta diz **43,74**. Derruba o R$/m² de 18.239 para 17.930.\n\n**4. \"140% de evolução do entorno, 2014→2025\"**, apresentação pág. 09, com nota de fonte ABRAINC/GeoBrain que cobre **jan-set/24 contra jan-set/23**. Um ano de fonte para onze anos de afirmação. **Não usar.**\n\n**5. Vagas por pavimento** divergem entre o resumo do book (41/55/60) e o memorial (43/57/61). O total bate. O memorial é contratual e prevalece.\n\n### O diagnóstico que vale como princípio\n\nNas primeiras artes de simulador, dois fios vermelhos pareciam violar a R14. **Só um violava.** O de cima sangrava de ponta a ponta sobre a foto; o de baixo, na linha \"47 mensais\", já estava contido na largura da tabela, porque é `border-bottom` da própria linha.\n\n> **Uma linha errada ao lado de uma certa contamina a leitura da certa.**\n\nCorrigida a de cima, a de baixo passou a ler como o que sempre foi: a marcação da parcela que decide a compra. Vale como princípio de revisão, não só para aquele caso — ao achar um defeito, confira se o vizinho é defeito mesmo ou só vítima da vizinhança.\n\n---\n\n## 7. Pendências\n\n1. **Nada bloqueando.** As três peças estão em disco, conferidas visualmente uma a uma, e o painel foi rodado.\n2. **Registro de incorporação e matrícula não existem** em nenhum material. O book declara que a comercialização só começa após o registro em cartório. Sai `[A CONFIRMAR]` em toda peça, e está assim nas três artes de simulador e no cartão final do reel. **É protótipo e o diretor sabe.**\n3. **Não existe data de entrega** no book nem no memorial. O financiamento das simulações começa em jan/31, mas isso é cronograma de pagamento, **não entrega**. Nunca inferir.\n4. **Taxa de juros do financiamento** não é publicada pela Caixa. Em peça: citar LTV de até 90% e prazo de até 35 anos; nunca a taxa.\n5. **Legenda, copy e stories do lançamento** não foram escritos. O módulo pediu as peças visuais; texto de publicação é trabalho do Redator, que não rodou aqui.\n6. **Só um slide de interior.** As 23 fotos verticais do decorado estão baixadas em `_material/decorado/`; usei uma. As 31 horizontais nem foram baixadas. Um segundo slide de interior (uma suíte — as candidatas são `v_221A9232`, `v_221A9235` e `v_221A9245`) custaria tirar outra área comum, e o carrossel fica em 8.\n7. **Os ~2,4 GB de `_material/`** podem ser podados: os dois `.mov` ProRes somam 1,9 GB e o reel já não depende deles.\n\n---\n\n## 8. Como retomar\n\n**Leia nesta ordem:** `CONTINUIDADE.md` (raiz) → este arquivo → `regras_editoriais.md` → `cerebro/00_direcao_visual.md` → `cerebro/04_historico_e_regras_ceo.md` (regras R01 a R15).\n\n**Para mexer nas peças:**\n\n```bash\n# carrossel — edite carrossel_spec.json antes\nnode entregas_reais/04_lancamento/render_ora.mjs \\\n     entregas_reais/04_lancamento/carrossel_spec.json \\\n     entregas_reais/04_lancamento/carrossel\n```\n\n```bash\n# artes de simulador — lê simulacoes.json e aborta se a soma não bater\nnode entregas_reais/04_lancamento/simulador_cards.mjs\n```\n\n```bash\n# reel — cartões primeiro, montagem depois\nnode entregas_reais/04_lancamento/reel_cards.mjs && bash entregas_reais/04_lancamento/montar_reel.sh\n```\n\n```bash\n# sempre depois de qualquer peça nova\npython3 ferramentas/gerar_painel.py\n```\n\n**E confira abrindo o PNG.** Seis dos meus erros passaram pelo log sem um aviso sequer — inclusive o pior deles, oito slides pretos anunciados como \"carrossel pronto\".\n"}, {"arquivo": "insumo_tese_de_mercado.md", "modulo": "04_lancamento", "titulo": "Insumo para as peças de marca e notícia (os 40% da semana · Sessão B)", "texto": "# Insumo para as peças de marca e notícia (os 40% da semana · Sessão B)\n\n**De:** Sessão C · Diretor de Arte · lançamento Óra Vaca Brava\n**Data:** 2026-11-17\n**Status:** material pronto, **fora da peça de lançamento**. O diretor reprovou esta tese para o feed do Óra, com razão — é registro de balanço, e balanço não vende apartamento no Instagram. Mas é exatamente o conteúdo de que uma peça de marca ou de notícia precisa.\n\n---\n\n## A tese, em quatro movimentos\n\n1. **O Setor Bueno é o último da régua de valorização de Goiânia e o único abaixo da média da cidade.**\n   Em 12 meses até outubro de 2026: Jardim América +10,0% · Setor Oeste +8,3% · Jardim Goiás +4,3% · Sul +4,1% · Marista +3,4% · **Bueno +2,6%**. Média de Goiânia: **+6,34%**.\n   *Fonte: FipeZAP, Informe de outubro de 2026 — preço de **anúncio de usado pronto**.*\n\n2. **O que está abundante no Bueno é usado, não novo.**\n   Bueno e Marista concentram **31,8%** de toda a oferta à venda da cidade.\n   *Fonte: Ademi-GO.*\n\n3. **Enquanto isso, a oferta nova encolhe.**\n   Estoque da cidade **−6%** no 1º semestre de 2026; lançamentos **16,4% menores** que no 2º semestre de 2025; Goiânia vendeu mais do que lançou (7.323 unidades vendidas contra 6.606 lançadas).\n   *Fonte: Brain Inteligência Estratégica, divulgado pela Ademi-GO.*\n\n4. **A causa é estrutural, não cíclica.**\n   A Ademi-GO atribui a valorização dos bairros nobres às mudanças nos Planos Diretores que **restringiram manchas de adensamento em Bueno, Marista e Oeste**.\n   *Fonte: O Popular, 19/01/2025 — o fato mais antigo do radar; usar como causa de fundo, nunca como número atual.*\n\n**A frase que resume:** o argumento não é que o Bueno vai subir mais — o percentual não sustenta isso. É que o produto **novo** no Bueno **acaba antes**.\n\n---\n\n## Outros números cruzados que sobraram da análise\n\n| Fato | Valor | Fonte |\n|---|---|---|\n| Vendas residenciais Goiânia 1S26 | 7.219 un. · **+42% a/a** (Brasil: +5,4%) | Brain / Ademi-GO · CBIC |\n| m² residencial Goiânia, 5 anos | R$ 5.687 (2021) → R$ 11.681 (1S26) · **+105%** | Ademi-GO |\n| Recorte Bueno + Marista + Oeste + Jardim Goiás | R$ 13.147/m² | Ademi-GO |\n| Marista, teto observado | R$ 18 mil a R$ 19 mil/m² | Ademi-GO |\n| Selic | 13,75% a.a., mantida em 04/11/2026 | BCB, série SGS 432 |\n| INCC-M | +6,75% em 12 meses, acima do IPCA de 4,63% | FGV/IBRE |\n\n---\n\n## Duas armadilhas que já mapeei\n\n1. **Nunca misturar série de usado com série de lançamento.** FipeZAP e Ademi medem **anúncio de usado pronto**; lançamento na planta é outro produto. Pôr os dois lado a lado sem dizer isso engana. Ver regra R5 em `regras_editoriais.md`.\n2. **A manchete tem que carregar a régua junto com o número.** \"O Bueno subiu 2,6%\" sozinho faz o leitor achar que 2,6% é bom. Ver regra R6.\n\n---\n\n## Peças já construídas sobre essa tese (reaproveitáveis)\n\nEm `_arquivo_angulo_mercado/`: carrossel de 7 slides e reel de 32s, renderizados e conferidos visualmente, na direção v2. Se a Sessão B quiser uma peça de marca sobre o mercado de Goiânia, o carrossel está pronto — basta trocar as fotos do Óra por imagem de acervo da Adão, porque o argumento não depende do empreendimento.\n\nO que precisaria sair, por ser específico do Óra: o slide 4 (Alvará 45.753) e o slide 6 (preço da unidade 2807).\n"}, {"arquivo": "regras_editoriais.md", "modulo": "04_lancamento", "titulo": "Regras editoriais do Óra Vaca Brava", "texto": "# Regras editoriais do Óra Vaca Brava\n\n**Travadas em:** 2026-11-17 pela coordenação do projeto.\n**Valem para:** toda peça da Adão sobre o Óra Vaca Brava — carrossel, vídeo, arte do simulador, legenda, story, kit dos corretores.\n**Quem cobra:** o REVISOR, na auditoria. Versão legível por máquina em `simulacoes.json`, bloco `_meta.regras_editoriais`.\n\n---\n\n## De onde elas vêm\n\nNão são preferência de estilo. Saem de dois limites que este levantamento declarou sobre a própria fonte:\n\n1. **As 10 unidades simuladas não são a tabela.** O empreendimento tem **424 unidades** (ficha técnica, book pág. 53; memorial, item 2). A pasta `1 - Tabela de Vendas - Óra Vaca Brava` do Drive está **vazia**. O que existe são 9 artes de simulador e 4 simulações na pág. 41 da apresentação — 10 unidades distintas ao todo.\n2. **As 10 não são uma amostra, são uma conveniência.** Quatro delas (303, 301, 1101, 2807) vêm do PDF sob o rótulo \"VALORES A PARTIR DE\" e são de **andar baixo**; as outras seis vêm das artes e são de **andar alto**. A diferença de preço entre os dois grupos é de **andar**, não de tabela.\n\nQuem não sabe disso lê as 10 como se fossem o lançamento. Não são.\n\n---\n\n## R1 · Faixa derivada das 10 não é faixa do lançamento\n\n**Proibido** apresentar `R$ 13.926 a R$ 17.930/m²`, ou `R$ 433.218 a R$ 784.258`, ou qualquer faixa derivada destas 10 unidades, como se fosse a faixa do empreendimento.\n\n**Por quê:** o dado não sustenta a afirmação. Dez unidades simuladas não descrevem 424.\n\n**Se precisar mesmo de uma faixa**, ela tem que vir nomeada pelo que é: *\"nas 10 unidades que a Ávolli publicou em simulador, o metro quadrado vai de R$ 13.926 a R$ 17.930\"*. A frase inteira, não a metade.\n\n---\n\n## R2 · Unidade específica, sempre\n\n**Obrigatório** citar **produto + área + pavimento**, com a origem clara.\n\n| | |\n|---|---|\n| ✅ Certo | \"ÓRA Home de 51,93 m², 28º pavimento — R$ 723.187.\" |\n| ❌ Errado | \"A partir de R$ 433 mil.\" |\n| ❌ Errado | \"Apartamentos a partir de R$ 450 mil no Setor Bueno.\" |\n\n**Por quê:** \"a partir de\" transforma uma unidade concreta numa promessa sobre o estoque inteiro, que ninguém conferiu. E esconde o andar, que é metade da explicação do preço.\n\n---\n\n## R3 · Um R$/m² ancorado, nunca uma média\n\nSe o argumento precisar de um número único de R$/m² para comparar com o Setor Bueno, usar **um** valor ancorado numa unidade nomeada.\n\n**Proibido:** média das 10 unidades.\n**Por quê:** média de amostra de conveniência não é média do empreendimento. As 10 não foram escolhidas para representar nada — foram as que a Ávolli resolveu simular.\n\n**Lembrete da comparação**, que também precisa estar na peça: o FipeZAP mede **preço de anúncio de usado pronto**; o Óra é **lançamento na planta**. A comparação direta é incorreta e a ressalva vai na própria peça, não no rodapé.\n\n---\n\n## R4 · Stay só com planta. A 1101 fica fora.\n\nSe a peça citar ÓRA STAY, usar unidade do **pavimento 12 ao 27**, que tem planta individualizada (2702 e 2704 estão disponíveis e conferidas).\n\n**A unidade 1101 não entra em peça.**\n\n**Por quê:** o pav. 11 é o LAZER 02 e tem apenas 06 apartamentos (memorial, item 2.10), enquanto a planta de pavimento tipo 1Q cobre o pav. 12 ao 27, com 12 por andar. **Não existe planta do pav. 11 no Drive.** Os 31,58 m² da 1101 vêm só da pág. 41 da apresentação — e essa mesma tabela já erra em outro ponto: lista 31,58 m² para as finais 06 e 07, quando as plantas dessas finais dizem **31,54 m²**.\n\nO `simulacoes.json` marca isso por unidade, em `uso_em_peca.permitido`.\n\n---\n\n## R5 · Nunca misturar série de usado com série de lançamento\n\nOs **2,6%** e os **R$ 9.849/m²** do Setor Bueno são **FipeZAP: preço de anúncio de imóvel usado pronto**. O preço do Óra é **lançamento na planta**. São séries diferentes, de produtos diferentes, medidas de formas diferentes.\n\n**Proibido** pôr os dois lado a lado sem dizer, na própria peça, que são séries diferentes.\n\n| | |\n|---|---|\n| ✅ Certo | \"O anúncio médio de usado no Bueno está em R$ 9.849/m² (FipeZAP, out/26). O Óra é lançamento na planta: o Home de 51,93 m² do 28º sai a R$ 13.926/m². São séries diferentes — usado pronto contra obra a entregar — e é exatamente por isso que a conta direta engana.\" |\n| ❌ Errado | \"O Bueno está a R$ 9.849/m² e o Óra a R$ 13.926/m².\" |\n\n**Por quê:** essa é a conta que o cliente faz sozinho no Zap, e é a objeção central do ângulo. A peça só ganha se **fizer a conta antes dele e explicar por que ela está errada**. Esconder a comparação é pior do que fazê-la: faz a peça parecer que tem algo a esconder.\n\nVale também para as comparações com o recorte Ademi-GO (R$ 13.147/m², quatro bairros nobres) e com o teto do Marista (R$ 18–19 mil/m²): dizer sempre de que série e de que órgão vem cada número.\n\n---\n\n## R6 · A manchete da capa carrega a régua junto com o número\n\nNuma capa de carrossel só a primeira linha é lida de verdade.\n\n**Proibido** uma manchete em que o número apareça sozinho quando o argumento depende de ele ser **baixo**. \"O Bueno subiu 2,6%\" faz o leitor assumir que 2,6% é bom — e a peça mente por omissão, mesmo com o corpo de texto correto.\n\n**Obrigatório** que o número apareça **ao lado da régua**: contra a média da cidade, ou contra o primeiro colocado, ou a régua inteira.\n\n| | |\n|---|---|\n| ✅ Certo | \"Goiânia subiu 6,34% em um ano. O Setor Bueno subiu 2,6%.\" |\n| ✅ Certo | Régua inteira: \"Jardim América +10,0% · Oeste +8,3% · Jardim Goiás +4,3% · Sul +4,1% · Marista +3,4% · **Bueno +2,6%**\" |\n| ❌ Errado | \"O Bueno subiu 2,6% em um ano.\" |\n\n**A régua, para referência** (FipeZAP, 12 meses até out/2026): Jardim América +10,0% · Setor Oeste +8,3% · Jardim Goiás +4,3% · Sul +4,1% · Marista +3,4% · Bueno +2,6%. Média de Goiânia: **+6,34%**. O Bueno é o último colocado e o único abaixo da média.\n\n**Os dois números da capa recomendada são da mesma série** (FipeZAP, 12 meses), então a comparação é legítima e não esbarra na R5.\n\n---\n\n## Hierarquia de fontes, para desempate\n\nQuando duas fontes oficiais discordarem sobre área:\n\n1. **Planta individualizada por final** (`Plantas Baixas`, área no nome do arquivo) — é o desenho da unidade. **Prevalece.**\n2. **Memorial descritivo** — documento contratual.\n3. **Ficha técnica do book** (pág. 53).\n4. **Tabela de pavimento tipo** da apresentação.\n5. **Arte de simulador** — a mais fraca. São quatro casos já documentados em que ela erra (ver `simulacoes.json`, campo `divergencia` das unidades 4008, 916, 810 e 1101).\n\n---\n\n## Rodapé obrigatório em toda peça\n\n> Valores e condições de novembro de 2026, sujeitos à tabela vigente e a alteração sem aviso prévio. Financiamento sujeito à aprovação de crédito. Registro de incorporação [A CONFIRMAR].\n\nE **legível** — não em corpo 6 no canto, como a Ávolli faz (ver `04_leitura_design_avolli.md`). Rodapé legível é diferencial de confiança numa categoria que esconde letra miúda por hábito.\n\n---\n\n## O que nunca entra em peça\n\n- **Data de entrega.** Não consta do book nem do memorial. O financiamento começa em jan/31, mas isso é **cronograma de pagamento, não entrega**. Não inferir.\n- **Taxa de juros do financiamento.** A Caixa publica LTV de até 90% e prazo de até 35 anos, mas não a taxa. Citar LTV e prazo; nunca taxa.\n- **Os \"140% de evolução do entorno, 2014→2025\"** da apresentação pág. 09. A nota de fonte (ABRAINC/GeoBrain) cobre jan-set/24 contra jan-set/23 — um ano de fonte para onze anos de afirmação.\n- **Os números de Goiânia da apresentação pág. 3** (2ª mais arborizada, 2º polo farmacêutico, PIB de R$ 75,8 bi, 1º centro de IA do Centro-Oeste) sem atribuição. Vêm sem fonte. Se usados, a atribuição é \"segundo a Ávolli\", nunca como fato de mercado.\n- **\"1.800 m² de lazer\"** sem a ressalva do próprio book (pág. 26): a metragem é aproximada e é o **somatório de áreas comuns distribuídas em pavimentos diferentes**, não um lazer contíguo.\n"}, {"arquivo": "auditoria.md", "modulo": "05_auditoria_e_kit", "titulo": "Auditoria — Divisão de Qualidade · semana 47 (23–28/11/2026)", "texto": "# Auditoria — Divisão de Qualidade · semana 47 (23–28/11/2026)\nGerado em 2026-11-18. Modelo: Sonnet 5.5. Opus: não usado (nenhuma disputa que as regras R01–R15 não resolvessem).\n\nReprovação não é decorativa. Esta auditoria reprovou **4 itens** e aprovou o resto.\n\n## 1. REVISOR (dado) — `python3 ferramentas/revisor.py`\nResultado: **0 reprovações · 9 achados** (`revisor_resultado.json`). Confere, por peça: cada número da capa existe na fonte, CRECI, código, nº de PNGs = nº de slides, R12 (slide limpo só com foto), CTA do Óra contra `simulacoes.json`, faixas de metragem, rótulo de decorado, ausência de faixa de preço.\n\n**Erro do próprio Revisor (registrado, corrigido):** a primeira rodada reprovou o Portal do Sol por \"número 1 não existe na fonte\" (ficha \"1 escritório\", \"1 terraço\"). Falso positivo: a fonte diz \"escritório · terraço\" no singular, o \"1\" vem do singular. Regra do script corrigida: `1` é aceito quando o substantivo do rótulo está na fonte. Padrão do erro: rigor mecânico lendo a letra e perdendo o sentido, o mesmo da pergunta \"condomínio R$ 1\".\n\n## 2. DIRETOR DE QUALIDADE (estética) — 30 PNGs de revenda, 8 do Óra, 3 simuladores\nConferido contra R03, R04, R05, R12, R14, R15, R09.\n\n| Peça | Veredito | Observação |\n|---|---|---|\n| Opus Gyro (8) | **APROVADO** | Capa simétrica, ficha legível, interiores limpos |\n| Aldeia do Vale (8) | **APROVADO** | Capa limpa, R10 respeitada (arquitetura e cômodos, sem autonomia como gancho) |\n| Portal do Sol (6) | **APROVADO** | R15 conferido ampliado: placa do carro na capa está ilegível sem chamar atenção. Só 6 fotos: limite do acervo, shot list de recaptação em rascunho |\n| Ravenallas (8) | **APROVADO** | Capa e slides limpos |\n| Simuladores (3) | **APROVADO** | Fio vermelho separa a linha \"47 mensais\", não corta texto. R09 ok: nenhuma chamada para Direct |\n| Óra carrossel slide 1, 5, 6, 7, 8 | **APROVADO** | Rótulo de decorado no slide 5 |\n| Óra carrossel slide 3 | **REPROVADO → CORRIGIDO** | \"climatizada\" nasce em cima da perna direita do \"A\" de PISCINA. O \"c\" some |\n| Óra carrossel slide 4 | **REPROVADO → CORRIGIDO** | \"REEBOK\" e \"250 M²\" se tocam: o pé do primeiro encosta no topo do segundo. Entrelinha curta demais |\n| Óra carrossel slide 2 | **REPROVADO → CORRIGIDO** | \"trabalhar\" cruza o \"R\" de ALUGAR e \"MORAR\" encosta no topo de \"ALUGAR\". Legível, mas sujo |\n\nCausa raiz, igual à já registrada: o fio e o cruzamento itálico são posicionados por **estimativa**, não por medida do elemento renderizado. Correção estrutural pendente em `render_carrossel.mjs` (medir `boundingBox()` antes do screenshot). Dono do conserto: Sessão C (`entregas_reais/04_lancamento/`).\n\n**Reprovação de texto (Opus Gyro, `01_redacao.md`):**\n- A trava da linha 9 diz \"Nenhuma foto de interior da unidade decorada. Só áreas comuns\". Está obsoleta: a R08 passou a exigir interior rotulado, e o carrossel mostra interior em 5 das 8 fotos.\n- Nenhuma das três legendas traz o rótulo exigido pelo `_rotulo` do spec: *\"as fotos de interior são da unidade decorada, mesma tipologia\"*. Peça com interior sem rótulo reprova (R08).\n- Ajuste exigido: linha de rótulo entra nas 3 legendas (já aplicada no kit; o arquivo do redator é da Sessão B).\n\n## 3. AGENTE CEO\n**Ajuste real exigido antes de aprovar:** o conjunto não sai com os slides 2, 3 e 4 do Óra colidindo nem com a legenda do Opus sem rótulo. Primeira peça da semana a ir ao ar é a escada (S47-01), que mostra o Opus Gyro: o rótulo entra primeiro.\n\n**Parecer geral:** a carteira está coerente (escada R$ 650 mil → R$ 10,5 mi), a capa é simétrica nos quatro imóveis, e as travas de dado (condomínio, faixa de preço, simulador sem Direct) seguraram. Nenhuma peça publica número fora de fonte.\n\n\"Por que este post\" por peça: já está no `cerebro/03_banco_de_pautas.json` (4 bullets) e aparece no painel, aba 2. Não reescrito: está bom.\n\n## 4. Pendências\n- **Guttyane:** imagem autorizada pelo diretor em 2026-11-18. S47-03 destravada. O reel (corte de 25 s do depoimento) ainda **não foi produzido**.\n- **Aldeia do Vale:** data de entrega vencida tratada como entregue (diretor, 2026-11-18). Nota `_nao_publicar` no spec está obsoleta, remoção é da Sessão B.\n- **Portal do Sol, recaptação:** liberação pendente com a diretoria.\n- **Peças planejadas sem arte renderizada:** S47-01 (escada), S47-03 (reel Guttyane), S47-05 (Morar no Aldeia do Vale), S47-10 (contraste do Bueno). O kit cobre só o que existe.\n\n## 5. Reprovações corrigidas (2026-11-18, Sonnet)\n- Óra slide 3: \"climatizada\" desceu para baixo da palavra, à direita. Sem cruzar o \"A\".\n- Óra slide 4: nova opção `respiro` no `render_ora.mjs` (margem entre as duas linhas do título), 22 px. REEBOK e 250 M² não se tocam mais.\n- Óra slide 2: `respiro` de 18 px e \"trabalhar\" abaixo de ALUGAR. Fio movido junto.\n- Opus Gyro: trava velha revogada e linha de rótulo de decorado nas 3 legendas e nos stories que citam o rooftop (`01_redacao.md`).\nRerender conferido a olho nos três slides. O `render_ora.mjs` continua posicionando por estimativa; a correção estrutural (medir `boundingBox()`) segue pendente.\n\n## 6. Peças de marca renderizadas (2026-11-18, Sonnet) — `entregas_reais/06_marca/`\n- **S47-01 `escada_semana/`** (5 slides): preços e metragens conferidos à mão contra as fontes (R$ 650 mil / 1,8 mi / 1,89 mi / 10,5 mi; 49, 191 e 645 m²). Aprovada pelo diretor.\n- **S47-10 `bueno_contraste/`** (5 slides): título corrigido de \"studio\" para \"apartamento compacto\" (o Opus Gyro tem 1 suíte). Slide 4 traz a ressalva \"unidades distintas: preço e metragem não se comparam por m²\", para a peça não virar comparação de preço por metro quadrado. Só área comum do Opus (rooftop), então não precisa de rótulo de decorado.\n- **S47-05 `aldeia_morar/`** (5 slides): texto do condomínio vem da descrição da diretoria; as fotos são da casa (exterior e vista), nenhuma finge ser lago ou área comum. Slide final antecipa a peça de quinta.\n- **Reprovação do próprio render:** a primeira passada saiu com títulos quebrando em 3 linhas e o fio vermelho cortando o texto no S47-10 (slides 1 e 4) e no S47-05 (slides 2, 4 e 5). Causa: título comprido demais para a largura. Corrigido encurtando (\"DOIS JEITOS DE MORAR\", \"ESCOLHA SEU JEITO\", \"LAGOS E LAZER\", \"TUDO POR PERTO\", \"QUINTA, A CASA\").\n\n## 7. Reel da Guttyane (S47-03) — `entregas_reais/06_marca/reel_guttyane/reel_guttyane.mp4` (26,3 s, 1080x1920)\nDecisões fechadas com o diretor pelo grill-me (2026-11-18): corte sem as falas problemáticas; destaques só em 6 palavras; efeito \"texto atrás dela\" onde ela está na tela; legenda queimada mantida; lower-third com cargo informado por ele.\n\n- **Achados do Revisor no material bruto:** a fala \"primeiro lançamento de 2026 no Setor Bueno\" não tem fonte no projeto e \"vai ser um sucesso\" é promessa de resultado. As duas ficaram fora do corte (0–5 s, 5,1–7,1 s, 10,7–15,3 s, 35,9–49 s).\n- **Achado de qualidade:** o arquivo recebido já era um vídeo editado, com legenda embutida e cenas de render. Ela só aparece na tela nos 5 primeiros segundos, então \"palavra atrás dela\" só vale no gancho (ATRAVESSAR GOIÂNIA, com máscara de pessoa do Apple Vision). As outras 5 palavras (ÓRA VACA BRAVA, ÁVOLLI + BILD, ROOFTOP, 250 M², PISCINA 25 M) entram sobre a imagem, acima da legenda queimada, que o diretor mandou manter.\n- **Limite conhecido:** a legenda queimada mostra a palavra \"primeiro\" por menos de 1 s em \"ÓRA VACA BRAVA, primeiro\" (a frase do dado sem fonte, cortada do áudio). Não há como removê-la sem estragar a imagem.\n- **Erros do próprio render, corrigidos:** \"ATRAVESSAR\" encostava nas bordas (150 px → 128 px); o logo do frame final não carregava, porque o Chromium bloqueia imagem `file://` a partir de página em branco (agora a página vai de arquivo em disco); lower-third e badge estavam pequenos demais (13 px → 16–18 px).\n- **Padrão R05:** badge \"Óra Vaca Brava · Setor Bueno\", fio vermelho no lower-third (4 s) e frame final de 1,6 s com logo e CRECI. O diretor não respondeu a esse item; assumi a recomendação, fácil de remover.\n- **Calendário:** mantida como lado 40 (rosto do time). Semana segue 6/4.\n- **Ferramentas novas:** `ferramentas/recorte_pessoa.swift` (máscara de pessoa por quadro), `reel_guttyane/cartoes.mjs` e `montar.sh`.\n\n## 8. Office Park (S47-08), acentos e fechamento (2026-11-18, Sonnet)\n- **Erro meu, corrigido:** ao propor a peça, afirmei ao diretor que a faixa \"27,10 a 63,56 m²\" não aparecia em nenhuma fonte e propus omiti-la. Errado: a análise oficial (`01_analise_ora_vaca_brava.md`) traz 63,56 m² como a área da planta do 3º pavimento (a ficha técnica diz 63,62). A peça usa 27,10 a 63,56 m² com a referência \"planta oficial\". Padrão do erro: afirmar ausência sem procurar na pasta de análise antes.\n- **S47-08 renderizado** (`04_lancamento/carrossel_office/`, 5 slides): capa, recepção do térreo, coworking do 11º, salas do 3º ao 9º pavimento e CTA da unidade 303 (47 × R$ 1.190, 3 × R$ 7.900, total R$ 433.218, valores lidos do `simulacoes.json` por script). O Revisor ganhou checagem própria para essa peça: 0 reprovações.\n- **Acentos no banco de pautas:** o arquivo inteiro estava sem acento. Restaurei nos três campos que aparecem no painel (`por_que_este_post`, `angulo`, `imovel_ou_tema`) com trava automática: a única diferença permitida era acentuação. Nomes e citações do material oficial ficaram com a grafia oficial (\"não é casa de construtor\", \"Espatódias\", \"Ávolli\"). Campos internos (`fonte`, `travas`, `ideias_nao_usadas`) ficaram como estavam.\n- **Painel:** 10 cartões, cada um ligado à sua pauta. O reel e os simuladores do Óra, que se soltaram quando o módulo ganhou o segundo carrossel, foram reanexados por `_anexos` em `painel_diretoria/vinculos.json`.\n- **Passagem de design do painel:** decisão do diretor: fica para uma etapa individual, depois de todas as entregas, feita junto com ele (design e UI/UX).\n\n## 9. Painel novo: auditoria com as 5 skills (2026-11-18, Sonnet)\nSkills instaladas em `.claude/skills/` (autorizadas pelo diretor). Esta sessão não as carregou como comandos, então li cada `SKILL.md` e apliquei como lista de verificação, com testes automáticos em 390x844 e 1470x956, temas escuro e claro.\n- **web-design-guidelines (Vercel):** achou placeholders sem \"…\", imagens sem largura e altura, `touch-action` ausente, campos sem `name` e `autocomplete`, `theme-color` fixo, dias da semana escritos à mão em vez de `Intl`, marcas sem `translate=\"no\"` e peça aberta fora da URL. Corrigido tudo; a peça agora tem link direto (`#/fila/p/<peça>`) e o botão Voltar do navegador fecha a janela.\n- **web-animation-design:** achou modal em 400 ms (limite 300), mola com overshoot de 1,56, entrada de página com deslocamento a cada troca de seção e hover em 250 ms. Corrigido: modal 250 ms, mola 1,2, entrada só com fade de 150 ms e sem animar no primeiro carregamento, hover 150 ms. `prefers-reduced-motion` verificado.\n- **make-interfaces-feel-better:** achou escalas de toque inconsistentes (0,97, 0,985, 0,9), raio das etiquetas fora do concêntrico, falta de contorno de 1 px nas imagens e animação de ícone fora do padrão. Corrigido: 0,96 em tudo, raio 4 nas etiquetas, contorno 1 px nas imagens, ícone com escala de 0,25 a 1 e desfoque de 4 px a 0.\n- **audit-as-a11y-eng:** achou o foco não voltando ao cartão ao fechar a peça (corrigido), atalhos que paravam após redesenhar (corrigido), campo de comentário sem `aria-describedby` e `aria-invalid` (corrigido), tema claro com status abaixo de 4,5:1 (corrigido), foco sem ir para o conteúdo ao trocar de seção (corrigido). Verificado: 0 controles sem nome, foco preso dentro da janela, 0 falhas de contraste além dos números decorativos da fileira em ordem (ocultos para leitor de tela).\n- **audit-as-ux-eng:** achou beco sem saída depois de \"Pedir ajuste\" (a peça nunca voltava), rascunho de comentário perdido ao fechar e fonte vaga no pedido com anexos. Corrigido: botão para receber a peça reenviada em versão 2, rascunho salvo por peça, aprendizado guardado em histórico mesmo depois do reenvio.\n**Não verificado:** iPhone e Safari reais, leitor de tela real e a conexão real com Drive e XML.\n"}, {"arquivo": "kit_corretores_whatsapp.md", "modulo": "05_auditoria_e_kit", "titulo": "Kit dos corretores — semana 47 (23–28/11/2026)", "texto": "# Kit dos corretores — semana 47 (23–28/11/2026)\nPara o corretor postar no perfil pessoal. Três legendas por imóvel: **direta**, **consultiva**, **curta**. Só entra número que está na fonte. Rodapé de toda legenda: `REF. <código> · CRECI-GO J-40518`.\n\nMensagem de abertura no WhatsApp:\n> Kit da semana chegou. Três versões de legenda por imóvel, roteiro de stories e as artes em alta. Escolhe a versão que combina com a sua voz e posta no horário sugerido.\n\n---\n\n## Opus Gyro · AT38302 · R$ 650.000 · Setor Bueno\nArtes: `entregas_reais/03_revenda/opus_gyro/slide-01..08.png` · Reel: `reel_at38302.mp4` (26 s, áudio de trend à escolha do corretor)\nLegendas completas e stories: `entregas_reais/03_revenda/opus_gyro/01_redacao.md`.\n**Obrigatório em qualquer versão (R08):** acrescente a linha *\"Fotos de interior: unidade decorada, mesma tipologia.\"* Já aplicado em `01_redacao.md`.\n\n## Portal do Sol Green · AT42341 · R$ 1.800.000 · Corretora Ludmila Dias\nArtes: `entregas_reais/03_revenda/portal_sol_green/slide-01..06.png`\n\n**Direta**\n> Sobrado de arquitetura autoral no Portal do Sol Green.\n> 4 suítes plenas, 4 vagas (2 cobertas), escritório e terraço. R$ 1.800.000.\n> Não é casa de construtor. Foi construída para morar.\n> Os quartos não têm armários planejados: a sua mão entra no projeto.\n> REF. AT42341 · CRECI-GO J-40518\n\n**Consultiva**\n> A diferença entre uma casa feita para vender e uma feita para morar aparece nos detalhes.\n> Piso inferior com sala ampla, cozinha integrada, área gourmet e piscina. Piso superior com 4 suítes e um escritório.\n> Arquitetura autoral, no Portal do Sol Green, Rodovia GO-020.\n> Quer conhecer? Me chama no Direct.\n> REF. AT42341 · CRECI-GO J-40518\n\n**Curta**\n> Feita para morar.\n> 4 suítes · 4 vagas · piscina.\n> REF. AT42341 · CRECI-GO J-40518\n\n## Ravenallas · AX43709 · R$ 1.890.000 · Setor Bueno · Corretora Juliana Bernardini\nArtes: `entregas_reais/03_revenda/ravenallas/slide-01..08.png`\n\n**Direta**\n> 191 m², 3 suítes plenas, 3 vagas individuais e elevador privativo no Setor Bueno. R$ 1.890.000.\n> Living integrado com a varanda e o espaço gourmet. Vista livre.\n> A poucos passos do Orion.\n> REF. AX43709 · CRECI-GO J-40518\n\n**Consultiva**\n> Elevador privativo, 3 vagas individuais e vista livre.\n> Sala de TV, sala de jantar com vista livre, cozinha com cooktop e armários planejados em todos os ambientes, incluindo o closet.\n> Condomínio com piscinas, sauna, academia, brinquedoteca e portaria 24h.\n> Quer ver pessoalmente? Me chama no Direct.\n> REF. AX43709 · CRECI-GO J-40518\n\n**Curta**\n> 191 m². 3 suítes. Elevador privativo.\n> Setor Bueno. R$ 1.890.000.\n> REF. AX43709 · CRECI-GO J-40518\n\n## Aldeia do Vale · AP42861 · R$ 10.500.000 · Corretora Amanda Rezende\nArtes: `entregas_reais/03_revenda/aldeia_do_vale/slide-01..08.png`\n(R10: o gancho é arquitetura e cômodos. Usina, poço e automação ficam no rodapé, nunca na abertura.)\n\n**Direta**\n> Casa moderna semi térrea no Aldeia do Vale. 645 m² construídos em 2.167 m² de terreno.\n> 4 suítes, 6 vagas cobertas e elevador. R$ 10.500.000.\n> Projeto em L: social, lazer e ala íntima, cada um no seu lugar.\n> REF. AP42861 · CRECI-GO J-40518\n\n**Consultiva**\n> Todos os quartos são nascentes e voltados para a piscina.\n> A casa é desenhada em L, e a piscina de borda infinita fica no centro da rotina: social de um lado, ala íntima do outro.\n> Cozinha integrada, sala de jantar, churrasqueira a carvão, adega no subsolo.\n> Quer ver por dentro? Me chama no Direct.\n> REF. AP42861 · CRECI-GO J-40518\n\n**Curta**\n> Quartos nascentes. Piscina de borda infinita.\n> 645 m² no Aldeia do Vale.\n> REF. AP42861 · CRECI-GO J-40518\n\n## Óra Vaca Brava · lançamento · Ávolli + Bild\nArtes: `entregas_reais/04_lancamento/carrossel/slide-01..08.png` · Reel: `reel/ora_vaca_brava_reel.mp4`\nSlides 2, 3 e 4 corrigidos e reconferidos (ver `auditoria.md`). Liberado.\nNunca anunciar faixa de preço. Citar a unidade nomeada. Registro de incorporação: `[A CONFIRMAR]`. Interior do slide 5 é decorado: manter a ressalva \"mobiliário e decoração não integram a unidade\".\n\n**Direta**\n> De frente pro Parque Vaca Brava, na Rua T-30, Setor Bueno.\n> Piscina climatizada, academia Reebok de 250 m² e coworking no mesmo prédio.\n> Óra Stay 33,56 m² (unidade 2702): 47 mensais de R$ 490, depois do ato e de 3 parcelas de R$ 8.900. Valor total R$ 503.517.\n> CRECI-GO J-40518\n\n**Consultiva**\n> Morar, alugar ou trabalhar: uma torre, três jeitos de usar.\n> Sky bar no 41º andar, piscina climatizada no 10º, academia Reebok e coworking.\n> Valores de novembro de 2026, sujeitos à tabela vigente. Financiamento sujeito à aprovação de crédito.\n> CRECI-GO J-40518\n\n**Curta**\n> R$ 490 por mês.\n> Óra Vaca Brava, Setor Bueno.\n> CRECI-GO J-40518\n\nSimuladores (3 artes em `entregas_reais/04_lancamento/simulador/`): peça de post, **nunca chamada para o Direct (R09)**.\n\n## Óra Office Park · sala comercial · quinta 27/11, 12h\nArtes: `entregas_reais/04_lancamento/carrossel_office/slide-01..05.png`. Exemplo de condição: unidade 303, 27,11 m². Nunca anunciar faixa de preço; citar a unidade nomeada. Registro de incorporação: `[A CONFIRMAR]`.\n\n**Direta**\n> Sua sala no Bueno. Óra Office Park, do 3º ao 9º pavimento, com salas de 27,10 a 63,56 m².\n> Unidade 303, 27,11 m²: 47 mensais de R$ 1.190, depois do ato e de 3 parcelas de R$ 7.900. Valor total R$ 433.218.\n> Valores de novembro de 2026, sujeitos à tabela vigente.\n> CRECI-GO J-40518\n\n**Consultiva**\n> Receber o cliente em um endereço que já é referência. Recepção com café e locker no térreo, coworking com 2 salas privativas e 2 de reunião no 11º pavimento.\n> Óra Office Park, Setor Bueno.\n> CRECI-GO J-40518\n\n**Curta**\n> R$ 1.190 por mês.\n> Sala de 27,11 m² no Óra Office Park.\n> CRECI-GO J-40518\n\n---\n\n## Stories — roteiro único (3 telas)\n1. **Capa do imóvel** com a ficha (metragem, suítes, vagas) e o preço.\n2. **O que ninguém vê no anúncio**: um ambiente-herói do carrossel.\n3. **Chamada**: \"Quer ver pessoalmente? Me chama.\" Sem enquete, sem sorteio.\n\n## Pendentes\nNenhuma. As 10 peças da semana estão renderizadas: `entregas_reais/06_marca/` (escada, Aldeia, Bueno, reel da Guttyane) e `entregas_reais/04_lancamento/` (Óra).\n\n## Notícia · Selic em 13,75% · segunda 23/11, 8h\nArte: `entregas_reais/06_marca/noticia_selic/slide-01.png`. Fontes: Banco Central (Copom, 04/11/2026) e Ademi-GO.\n\n**Direta**\n> O Copom interrompeu cinco cortes seguidos e manteve a Selic em 13,75% ao ano.\n> Em Goiânia, o metro quadrado de lançamentos segue em R$ 11.681, alta de 105% em 5 anos.\n> Fontes: Banco Central e Ademi-GO.\n\n**Consultiva**\n> O juro parou de cair, e quem pensa em comprar imóvel já está fazendo essa conta.\n> A Selic está em 13,75% ao ano e o metro quadrado de lançamentos em Goiânia acumula alta de 105% em 5 anos (Ademi-GO).\n> Quer entender o que isso muda na sua compra? Me chama no Direct.\n\n**Curta**\n> O juro parou. Selic em 13,75%.\n> Fontes: Banco Central e Ademi-GO.\n\n## Notícia · Um terço da oferta de Goiânia · quarta 25/11, 12h\nArte: `entregas_reais/06_marca/noticia_goiania/slide-01.png`. Fontes: Ademi-GO e Brain Inteligência Estratégica.\n\n**Direta**\n> Bueno e Marista concentram 31,8% dos imóveis à venda em Goiânia.\n> No 1º semestre de 2026, a cidade vendeu 7.323 unidades e o estoque caiu 6%.\n> Fontes: Ademi-GO e Brain Inteligência Estratégica.\n\n**Consultiva**\n> Quase um terço de tudo que está à venda em Goiânia está em dois bairros: Bueno e Marista.\n> Ao mesmo tempo, a cidade vendeu 7.323 unidades no semestre e o estoque disponível encolheu 6%.\n> Procura imóvel em um desses bairros? Me chama no Direct.\n\n**Curta**\n> 31,8% da oferta de Goiânia está no Bueno e no Marista.\n> Fontes: Ademi-GO e Brain.\n\n## Setor Bueno · dois jeitos de morar · sábado 28/11, 10h\nArtes: `entregas_reais/06_marca/bueno_contraste/slide-01..05.png`. Fonte: FipeZAP (outubro/2026).\n\n**Direta**\n> No Bueno cabe o apartamento compacto de 49 m² por R$ 650.000 e o de 191 m² com elevador privativo por R$ 1.890.000.\n> Preço médio do m² no bairro: R$ 9.849 (FipeZAP, outubro de 2026).\n> CRECI-GO J-40518\n\n**Consultiva**\n> Dois jeitos de morar no mesmo bairro: o compacto bem localizado ou o apartamento amplo com elevador privativo.\n> Me conta qual combina com a sua rotina e eu separo as opções no Bueno.\n> CRECI-GO J-40518\n\n**Curta**\n> 49 m² ou 191 m²? No Bueno tem os dois.\n> CRECI-GO J-40518\n\n## Guttyane · institucional · terça 24/11, 12h\nReel: `entregas_reais/06_marca/reel_guttyane/reel_guttyane.mp4`. Só publicar com a autorização de imagem da Guttyane por escrito.\n\n**Direta**\n> Quem atende você do outro lado na Adão Imóveis.\n> Guttyane, diretora. Compre, venda ou invista com quem conhece o mercado de Goiânia.\n> CRECI-GO J-40518\n\n**Curta**\n> Conheça quem cuida do seu imóvel.\n> CRECI-GO J-40518\n"}], "cerebro": {"manual_de_padroes": "# Gaveta 1 · Manual de Padrões\nO que funciona, com exemplo real e data. Preenchido pelo Observador de Instagram e pelo Curador.\n\n**Regra estrita:** aprender padrão estrutural (gancho, formato, ritmo, estrutura de copy, ângulo).\nNunca copiar texto, foto, arte ou vídeo de terceiro.\n\n**Coleta desta gaveta:** 2026-11-17, navegador interno com a sessão logada do diretor (`joaozava_imoveis`).\nViews de **129 reels** em 9 perfis. Curtidas e comentários completos em `@_k.elsie` e nos 4 outliers abertos.\nRelatório completo: `entregas_reais/01_inteligencia/relatorio_perfis.md`.\n\n---\n\n## Formato Padrão Vencedor da Adão Action\n\n**Peça de um único ativo, aberta por um número absoluto escrito por cima da imagem nos primeiros 3 segundos,\ncom tour do imóvel no miolo e um dado de mercado com fonte como virada — o número do gancho é do imóvel ou\ndo resultado de venda dele, nunca da marca, e o fecho é objeção respondida + conversa privada.**\n\n| # | Tempo | Conteúdo | Origem obrigatória |\n|---|---|---|---|\n| 1 | 0–3s | **Um número absoluto sobre a imagem**: metragem, preço ou unidades vendidas | XML do CRM |\n| 2 | 3–8s | O ativo nomeado: setor, quartos, suítes, vagas | XML do CRM |\n| 3–5 | miolo | Tour dos 3 ambientes de maior impacto, em movimento | **Drive** (foto do XML tem marca d'água) |\n| 6 | virada | Um dado de mercado com a **fonte impressa na tela** | `cerebro/02_radar_de_mercado.json` |\n| 7 | fecho | Objeção respondida + convite a conversa privada | — |\n\n**Evidência, em número:**\n1. O reel de **melhor taxa de curtida de todo o levantamento (3,89%)** é um tour com a metragem escrita\n   sobre a imagem (`800 metros`) e a legenda mais fraca do conjunto. O gancho é visual e numérico.\n2. **Número de resultado é o formato do topo em três perfis independentes:** @remaxbr `MELHOR OUTUBRO DA\n   HISTÓRIA` = **8,14x** a própria média (maior múltiplo do levantamento); @adaoimoveisoficial\n   `110 UNIDADES / R$ 52 MI` = **4,73x**; e o maior reel de todo o conjunto — @_k.elsie, **1,4 mi views e\n   38,5 mil curtidas** — é uma recapitulação de resultado em números. Três portes, três públicos, mesmo\n   formato no topo.\n3. Os dois perfis de maior média do bloco de performance (@capitalconcreto 24.378, @corretormaquinadevendas\n   18.829) organizam os destaques **por ativo nomeado**. No bloco institucional isso aparece **zero vez**.\n4. Bloco de performance converte **12,73%** de views por seguidor; institucional **8,86%**.\n5. **Dado de mercado com fonte é o formato de melhor engajamento medido:** o reel de @autimob com tese sobre\n   Goiânia e fonte nomeada fez **4,31% de taxa de curtida — a melhor das seis dissecações** — com apenas\n   4.102 views. E o maior múltiplo do levantamento (@remaxbr, 8,14x) usa **o cenário macro como contraste**\n   do número de resultado. A Adão tem 29 indicadores auditados no radar e nenhum concorrente os usa com\n   consistência: vantagem disponível e não ocupada.\n6. **View bruta engana.** Entre as seis dissecações, a ordem de views é quase o inverso da ordem de\n   engajamento: 4.102 views → 4,31% de curtida; 182.000 views → 0,60%. **Medir peça pelo múltiplo da própria\n   média e pela taxa de curtida, nunca pela view absoluta.**\n\n**O Formato Vencedor é sobre estrutura e performance — que formato performa, que gancho retém, que ritmo\nprende. Não é sobre estética, tipografia ou cor.** A linguagem visual da Adão Action será decidida à parte,\ncom as referências do diretor.\n\n---\n\n## Baseline da casa — @adaoimoveisoficial\n\n**46 mil seguidores · 2.927 seguindo · 2.469 posts · destaques `Lançamento`, `Blog`, `Revenda`.**\n\n| Métrica | Adão | Leitura |\n|---|---|---|\n| Média de views (15 reels) | **4.499** | Maior que todo o bloco institucional, que @robsonstalyn_3i e que @autimob |\n| Mediana | 2.690 | Média puxada por 2 estouros |\n| Views ÷ seguidores | **9,8%** | Acima de @remaxbr (4,1%), @brokersbr (5,2%), @autimob (4,6%), @robsonstalyn_3i (7,0%) |\n| Maior outlier | 21.300 (**4,73x**) | `110 UNIDADES VENDIDAS / R$ 52 MILHÕES EM VGV` |\n| Segundo outlier | 11.400 (2,53x) | não dissecado |\n\n**Diagnóstico:** o problema da Adão **não é alcance médio** — é **amplitude**. Ela quase nunca estoura.\nA meta da primeira semana não é subir a média: é **repetir o formato que já estourou na casa**, agora com o\nnúmero do imóvel e não só o da venda, e distribuir fora da rede de corretores.\n\n**Lacunas de arquitetura, contra o bloco de performance:** nenhum destaque de prova · nenhum destaque de\nobjeção · nenhum ativo nomeado em destaque · bio declara tamanho e tempo (`A MAIOR imobiliária do\nCentro-Oeste`, `Há 40 anos`) mas **não declara nicho nem praça**. O CRECI está presente — manter.\n\n---\n\n## Padrões observados\n\n### P01 · Número absoluto em tela bate legenda\n- **Perfil / data:** @robsonstalyn_3i · reel de 15/09/2023, lido em 2026-11-17\n- **Métrica que o isolou:** 624.000 views · **24.300 curtidas** · taxa de **3,89%** — a melhor do levantamento\n- **Gancho:** `800 metros` / `De Luxo` escrito por cima do tour, corretor caminhando de braços abertos\n- **Formato:** tour falado/caminhado de um único imóvel\n- **Estrutura de copy:** genérica e fraca (*\"Experimente o verdadeiro luxo e sofisticação...\"*) + copyright.\n  **Zero número na legenda, zero CTA.**\n- **Ângulo:** emocional na legenda, **racional na tela**\n- **O que a Adão aproveita:** o número vai **na imagem**, não no texto. Metragem e preço do XML na primeira\n  tela. A estrutura, nunca o conteúdo.\n- **Fonte:** `https://www.instagram.com/reel/CxNf3F6O7vp/`\n\n### P02 · Número de recorde na capa é o formato de maior múltiplo\n- **Perfil / data:** @remaxbr e @adaoimoveisoficial · lidos em 2026-11-17\n- **Métrica que o isolou:** @remaxbr `O MELHOR OUTUBRO EM VENDAS DA HISTÓRIA` = 26.700 views = **8,14x** a\n  própria média (maior múltiplo do levantamento). @adaoimoveisoficial `110 UNIDADES VENDIDAS / R$ 52 MILHÕES\n  EM VGV` = 21.300 views = **4,73x**, com 320 curtidas (1,50%).\n- **Gancho:** dois números absolutos em texto grande e cru sobre foto única\n- **Formato:** post de dado/resultado. Não é tour, não é carrossel.\n- **Estrutura de copy (Adão):** resultado → qualificação do produto → agradecimento ao time → CTA de site\n- **Ângulo:** racional na capa, emocional no miolo\n- **O que a Adão aproveita:** ela **já domina este formato**. O ajuste é virar o número para fora.\n- **Ressalva registrada:** os comentários do post da Adão são quase todos de **corretores da própria casa**.\n  O post estourou **para dentro**. O formato funciona; a distribuição foi interna.\n- **Fonte:** `https://www.instagram.com/reel/DfYRP4gtrXT/`\n\n### P03 · Volume de view não é qualidade de view\n- **Perfil / data:** @capitalconcreto · reel de ~13/11/2026, lido em 2026-11-17\n- **Métrica que o isolou:** 182.000 views = 7,47x a própria média, mas **1.088 curtidas** = taxa de **0,60%**,\n  a pior das quatro dissecações\n- **Gancho:** nenhum. Abre na obra em andamento, geotag `Jardins, São Paulo`\n- **Formato:** bastidor de obra em **colaboração** — assinado por `sophiamartins_sp` e outros 2, não pela marca\n- **Estrutura de copy:** uma linha, sem número, sem CTA\n- **Ângulo:** nenhum declarado\n- **O que a Adão aproveita:** a lição negativa. **Alcance emprestado de collab infla view e esvazia\n  afinidade.** Ao avaliar uma peça, olhar taxa de curtida, não view bruta.\n- **Fonte:** `https://www.instagram.com/reel/DfrvWgzAGJt/`\n\n### P04 · Ruptura de mercado + mecânica de comentário\n- **Perfil / data:** @corretormaquinadevendas · reel de 28/06/2026, lido em 2026-11-17\n- **Métrica que o isolou:** 102.000 views = 5,42x a própria média · 2.619 curtidas · taxa 2,57%\n- **Gancho (3s):** legenda em tela `o fim dos sites das imobiliárias` — afirmação que ameaça o status quo\n- **Formato:** reel falado em plano único, câmera na mão, sem produção\n- **Estrutura de copy:** ruptura externa → ação pessoal → promessa de década → **CTA de comentário**\n- **Ângulo:** racional, de ameaça profissional\n- **Mecânica que explica o número:** a seção de comentários é dominada pela **mesma palavra-chave repetida**\n  (`Site com IA`), cada uma com resposta automática. É **comment-gate** disparando DM.\n- **O que a Adão aproveita:** a estrutura de gancho de ruptura. **A mecânica de comment-gate é decisão da\n  diretoria, não do agente** — fica registrada, não recomendada.\n- **Fonte:** `https://www.instagram.com/reel/DaJbqm1h9Q4/`\n\n### P05 · Dado de mercado com fonte nomeada é o melhor engajamento medido\n- **Perfil / data:** @autimob · reel de ~10/11/2026, lido em 2026-11-17\n- **Métrica que o isolou:** 4.102 views = 2,24x a própria média · **177 curtidas** · taxa de **4,31%** —\n  **a melhor taxa de curtida de todas as dissecações brasileiras**, e com a MENOR view do conjunto dissecado\n- **Gancho (3s):** frase de entrevista em tela — `TÁ MUITO FÁCIL VENDER GOIÂNIA NO BRASIL INTEIRO`\n- **Formato:** recorte de entrevista em colaboração, com citação em tela\n- **Estrutura de copy:** tese sobre a cidade → **fonte nomeada** (Dário Oliveira, sócio-diretor da Ávolli) →\n  números de demanda (≈400 mil novos moradores na região metropolitana entre 2010 e 2020) → credencial de\n  projeto (arquiteto Greg Bousquet, do Triptyque) → comparação internacional\n- **Ângulo:** racional, tese de mercado com lastro\n- **O que a Adão aproveita:** **é o slide 6 do Formato Vencedor, já validado em campo.** Dado de mercado com\n  fonte converte pouca view em muita afinidade. A Adão tem 29 indicadore
