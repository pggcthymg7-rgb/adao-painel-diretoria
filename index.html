s auditados no radar.\n- **Ressalva de dado:** os números de 400 mil / 190 mil são declaração de executivo em legenda de Instagram,\n  não série oficial. **Não entram no radar de mercado** sem fonte primária.\n- **Fonte:** `https://www.instagram.com/reel/DfkZJN5Bk-x/`\n\n### P06 · O cenário macro como contraste do número de resultado\n- **Perfil / data:** @remaxbr · reel de 01/11/2026, lido em 2026-11-17\n- **Métrica que o isolou:** 26.700 views = **8,14x a própria média — o maior múltiplo de todo o levantamento**\n  · 871 curtidas · taxa 3,26%\n- **Gancho de capa:** `O MELHOR OUTUBRO EM VENDAS DA HISTÓRIA`\n- **Formato:** reel falado curto com cartela de número, em colaboração (conta do executivo + 4)\n- **Estrutura de copy:** número absoluto (*\"+ de R$ 15 BILHÕES em vendas nos últimos 12 meses\"*) → tese\n  (*\"Quem lidera, bate o próprio recorde\"*) → **o macro como adversário** (*\"Mesmo com juros altos e cenário\n  de incerteza...\"*) → crédito ao time → visão de futuro\n- **Ângulo:** racional, moldura de superação\n- **O que a Adão aproveita:** **a lógica 60/40 em uma peça só.** O dado de juros não é o assunto — é o\n  adversário contra o qual o número da casa brilha. Com Selic em 13,75% parada e o m² de Goiânia subindo\n  7,4% no semestre, a Adão tem o contraste pronto no radar.\n- **Ressalva:** comentários **todos internos** (franqueados e corretores da rede). Mesmo padrão do outlier\n  da Adão: o formato de recorde estoura para dentro se não for distribuído fora.\n- **Fonte:** `https://www.instagram.com/reel/DfNwt7YP82C/`\n\n### P07 · Média não é o alvo; o estouro é\n- **Perfis / data:** todos os 8 · 2026-11-17\n- **Métrica que o isolou:** em quase todos os perfis a **mediana fica muito abaixo da média** —\n  @capitalconcreto 24.378 vs 2.378 · @remaxbr 3.280 vs 1.553 · @adaoimoveisoficial 4.499 vs 2.690.\n  Os perfis vivem de **poucos estouros**, não de consistência.\n- **O que a Adão aproveita:** a meta operacional não é subir a média — é **fabricar o est umo de análise estrutural**.\n\n### @_k.elsie — 173.241 seguidores · 365 posts · corretora em Hickory & Charlotte Metro (NC, EUA)\n\nMédia dos recentes **140.075 views** · mediana **157.000** · **80,9%** de views por seguidor.\nMaior outlier recente: apenas **1,47x**. Fixados: 1,4 mi · 692 mil · 592 mil.\n\n**O ponto estrutural:** a **mediana é maior que a média** e o maior outlier é 1,47x — o **oposto** dos 8\nperfis brasileiros, onde a média é puxada por um ou dois estouros. Este perfil não vive de estouro, vive de\n**piso alto**. Para a Adão é referência de **regime de operação**, não de estética: dá para operar com\nconsistência alta em vez de picos isolados.\n\n**Taxas de curtida medidas (amostra):** 6,23% (81,9 mil views) · 3,93% (151 mil) · 3,75% (206 mil) ·\n3,41% (692 mil) · 2,87% (592 mil) · 2,75% (1,4 mi) · 1,86% (200 mil).\nA taxa **cai conforme a view sobe** — mesma relação inversa vista nas quatro dissecações brasileiras.\n\n**Observado nas capas (grid logado):** em 15 reels, **12 capas são a pessoa em plano médio com texto grande\nem tela**, com palavra isolada em destaque (`and this?`, `until`, `Yeah,`, `And`, `who you are`, `ONE thing`,\n`$17 M`, `I have sold`). Só 3 capas são de imóvel. **O gancho é palavra de tela, não produção de imóvel.**\n\n**Montagem — observado em um reel, por amostragem de tela**\nReel de maior alcance do perfil (`https://www.instagram.com/reel/DYwset0R5kP/` · 25/05/2026 · **1,4 mi views ·\n38,5 mil curtidas · 483 comentários · taxa 2,75%**), assistido com capturas em intervalos de 2s e de 1s.\n\n- **O que é o reel:** **recapitulação de resultado em números.** A legenda abre em\n  *\"Quarter one closed at $10 million. We're now sitting at $14 million year-to-date and over 30 families\n  served so far in 2026\"*, e segue para história pessoal de superação e fé, fechando em agradecimento.\n  **O maior reel de todo o levantamento (1,4 mi) é, mais uma vez, um post de número de resultado** — mesma\n  espinha do outlier da Adão (P pezap/fipezap-202610-residencial-venda.pdf", "valido_ate": "2027-06-30", "orgao": "Fipe com base em dados do IBGE", "observacao": "Goiania: 1.437 mil habitantes, 549 mil domicilios, 153 mil apartamentos (Censo 2022)."}, {"chave": "ademi_m2_residencial_goiania", "valor": 11681, "unidade": "R$/m2", "data_referencia": "2026-06", "url_fonte": "https://www.jornalopcao.com.br/ultimas-noticias/bueno-e-marista-concentram-318-dos-imoveis-a-venda-em-goiania-metro-quadrado-chega-a-r-116-mil-870840/", "valido_ate": "2027-03-31", "orgao": "Ademi-GO (diretor de Pesquisa e Estatistica Credson Batista)", "observacao": "Acumulado de 2026 ate junho. Alta de 7,4% sobre o fechamento de 2025 (R$ 10.872/m2). Serie da Ademi mede preco de LANCAMENTO/oferta; difere do FipeZAP (anuncio de usados, R$ 8.531/m2)."}, {"chave": "ademi_valorizacao_5_anos_goiania", "valor": 105, "unidade": "% acumulado", "data_referencia": "2026-06", "url_fonte": "https://www.jornalopcao.com.br/ultimas-noticias/bueno-e-marista-concentram-318-dos-imoveis-a-venda-em-goiania-metro-quadrado-chega-a-r-116-mil-870840/", "valido_ate": "2027-03-31", "orgao": "Ademi-GO", "observacao": "m2 passou de R$ 5.687 em 2021 para R$ 11.681 em 2026 — mais que dobrou. Dois anos consecutivos de alta de 18%. Ademi projeta alta de dois digitos no fechamento de 2026, acima da Selic."}, {"chave": "ademi_m2_recorte_4_bairros_nobres", "valor": 13147, "unidade": "R$/m2", "data_referencia": "2026-06", "url_fonte": "https://www.jornalopcao.com.br/ultimas-noticias/bueno-e-marista-concentram-318-dos-imoveis-a-venda-em-goiania-metro-quadrado-chega-a-r-116-mil-870840/", "valido_ate": "2027-03-31", "orgao": "Ademi-GO", "observacao": "Recorte Bueno + Marista + Oeste + Jardim Goias. Cerca de R$ 1.500/m2 acima da media da cidade."}, {"chave": "ademi_m2_marista_pico", "valor": 19000, "unidade": "R$/m2 (teto observado)", "data_referencia": "2026-06", "url_fonte": "https://www.jornalopcao.com.br/ultimas-noticias/bueno-e-marista-concentram-318-dos-imoveis-a-venda-em-goiania-metro-quadrado-chega-a-r-116-mil-870840/", "valido_ate": "2027-03-31", "orgao": "Ademi-GO", "observacao": "Media do Marista se aproxima de R$ 14 mil/m2, mas ha empreendimentos comercializados a R$ 18 mil e R$ 19 mil/m2 por ser a regiao mais demandada."}, {"chave": "ademi_m2_serrinha", "valor": 11300, "unidade": "R$/m2", "data_referencia": "2026-06", "url_fonte": "https://www.jornalopcao.com.br/ultimas-noticias/bueno-e-marista-concentram-318-dos-imoveis-a-venda-em-goiania-metro-quadrado-chega-a-r-116-mil-870840/", "valido_ate": "2027-03-31", "orgao": "Ademi-GO", "observacao": "Serrinha, Coimbra e Jardim America aparecem como vetores de transbordo da demanda dos bairros nobres."}, {"chave": "concentracao_oferta_bueno_marista", "valor": 31.8, "unidade": "% da oferta da cidade", "data_referencia": "2026-06", "url_fonte": "https://www.jornalopcao.com.br/ultimas-noticias/bueno-e-marista-concentram-318-dos-imoveis-a-venda-em-goiania-metro-quadrado-chega-a-r-116-mil-870840/", "valido_ate": "2027-03-31", "orgao": "Ademi-GO", "observacao": "Bueno e Marista sozinhos concentram quase um terco de todos os imoveis disponiveis para venda em Goiania."}, {"chave": "vendas_residenciais_goiania_1s26", "valor": 7219, "unidade": "unidades", "data_referencia": "2026-06", "url_fonte": "https://www.jornalopcao.com.br/goiania/mercado-imobiliario-goiania-vendas-estoque-marista-871938/", "valido_ate": "2027-03-31", "orgao": "Brain Inteligencia Estrategica, divulgado pela Ademi-GO", "observacao": "Alta de 42% sobre o 1o semestre de 2025. Maior volume de vendas residenciais em um unico semestre na serie historica local. Goiania foi a 4a capital do pais em volume comercializado."}, {"chave": "vendas_totais_goiania_1s26", "valor": 7323, "unidade": "unidades (residencial + horizontal + comercial)", "data_referencia": "2026-06", "url_fonte": "https://www.jornalopcao.com.br/goiania/mercado-imobiliario-goiania-vendas-estoque-marista-871938/", "valido_ate": "2027-03-31", "orgao": "Brain Inteligencia Estrategica / Ademi-GO", "observacao": "Contra 6.606 unidades lancadas no mesmo periodo. Vendeu mais do que lancou."}, {"chave": "estoque_disponivel_goiania", "valor": -6, "unidade": "% vs fechamento de 2025", "data_referencia": "2026-06", "url_fonte": "https://www.jornalopcao.com.br/goiania/mercado-imobiliario-goiania-vendas-estoque-marista-871938/", "valido_ate": "2027-03-31", "orgao": "Brain Inteligencia Estrategica / Ademi-GO", "observacao": "Lancamentos no 1S26 foram 16,4% menores que no 2S25. Oferta encolhendo com demanda em alta."}, {"chave": "vgv_goiania_1s26", "valor": 4.1, "unidade": "R$ bilhoes", "data_referencia": "2026-06", "url_fonte": "https://www.jornalopcao.com.br/goiania/mercado-imobiliario-goiania-vendas-estoque-marista-871938/", "valido_ate": "2027-03-31", "orgao": "Brain Inteligencia Estrategica / Ademi-GO", "observacao": "Praticamente estavel contra R$ 4,2 bilhoes no 1S2025, apesar de 42% mais unidades residenciais vendidas — sinal de mix com ticket medio menor no volume."}, {"chave": "vendas_residenciais_brasil_1s26", "valor": 5.4, "unidade": "% de crescimento", "data_referencia": "2026-06", "url_fonte": "https://www.jornalopcao.com.br/goiania/mercado-imobiliario-goiania-vendas-estoque-marista-871938/", "valido_ate": "2027-03-31", "orgao": "CBIC (Camara Brasileira da Industria da Construcao)", "observacao": "Goiania cresceu 42% contra 5,4% do pais — quase 8x a media nacional no periodo."}, {"chave": "caixa_ltv_maximo", "valor": 90, "unidade": "% do valor do imovel", "data_referencia": "2026-11-17", "url_fonte": "https://www.caixa.gov.br/voce/habitacao/Paginas/default.aspx", "valido_ate": "2027-02-28", "orgao": "Caixa Economica Federal", "observacao": "Pagina oficial: financia ate 90% do valor do imovel, prazo de ate 35 anos (420 meses), com FGTS podendo amortizar e pagar parte das prestacoes. A taxa de juros efetiva NAO e publicada na pagina — depende de linha, relacionamento e analise de credito, e sai apenas no simulador oficial. NAO usar taxa de blog como fato."}], "noticias": [{"titulo": "BC: Copom interrompe 'ciclo de calibracao' e mantem taxa Selic em 13,75% ao ano", "veiculo": "O Liberal / Estadao Conteudo", "data": "2026-11-04", "url_fonte": "https://www.oliberal.com/economia/bc-copom-interrompe-ciclo-de-calibracao-e-mantem-taxa-selic-em-13-75-ao-ano-1.1190560", "valido_ate": "2026-12-09", "resumo": "Decisao unanime na 282a reuniao, primeira apos a reeleicao. Interrompe 5 cortes de 0,25 p.p. iniciados em marco/2026. De 75 casas ouvidas pela Projecoes Broadcast, 39 esperavam corte para 13,50% e 36 manutencao — a Selic ficou acima da mediana do mercado pela primeira vez desde junho de 2025.", "impacto_alto_padrao_goiania": "Juros parados no alto significa parcela de financiamento sem alivio no curto prazo. Empurra o comprador de alto padrao para pagamento direto com a incorporadora, permuta e entrada maior — e torna o imovel ainda mais atrativo como protecao, porque a Ademi-GO projeta valorizacao de dois digitos em 2026, acima da propria Selic."}, {"titulo": "Inflacao desacelera e fica em 0,14% em outubro", "veiculo": "Agencia Gov (via IBGE)", "data": "2026-11-12", "url_fonte": "https://agenciagov.ebc.com.br/noticias/202611/inflacao-desacelera-e-fica-em-0-14-em-outubro", "valido_ate": "2026-12-11", "resumo": "IPCA de outubro em 0,14%, contra 0,82% em setembro. Acumula 4,10% no ano e 4,63% em 12 meses. Habitacao caiu 0,51% com a troca da bandeira amarela pela verde; Alimentacao e bebidas subiu 1,04%.", "impacto_alto_padrao_goiania": "Inflacao ao consumidor desacelerando mas ainda acima do teto da meta (4,5%) sustenta o discurso de Selic parada. Para o investidor, o ponto que importa e o descolamento: o imovel em Goiania subiu 6,34% em 12 meses (FipeZAP) contra 4,63% de IPCA — ganho real de cerca de 1,7 ponto."}, {"titulo": "Custo da construcao sobe 0,35% em outubro, aponta FGV", "veiculo": "Brasil 61", "data": "2026-11-02", "url_fonte": "https://brasil61.com/n/custo-da-construcao-sobe-0-35-em-outubro-aponta-fgv-bras2617395", "valido_ate": "2026-12-23", "resumo": "INCC-M de outubro em 0,35%, acima dos 0,25% de setembro. Acumula 6,75% em 12 meses e 6,23% no ano. Materiais para estrutura saltaram de 0,07% para 0,72%; vidros +2,96% e massa de concreto +2,16% foram os maiores impactos.", "impacto_alto_padrao_goiania": "Custo de obra correndo a 6,75% em 12 meses, acima do IPCA, significa que a tabela do proximo lancamento sai mais alta que a do atual. Argumento direto de urgencia para quem compra na planta — e fato, nao retorica."}, {"titulo": "Bueno e Marista concentram 31,8% dos imoveis a venda em Goiania; metro quadrado chega a R$ 11,6 mil", "veiculo": "Jornal Opcao", "data": "2026-09-23", "url_fonte": "https://www.jornalopcao.com.br/ultimas-noticias/bueno-e-marista-concentram-318-dos-imoveis-a-venda-em-goiania-metro-quadrado-chega-a-r-116-mil-870840/", "valido_ate": "2027-03-31", "resumo": "m2 residencial de Goiania passou de R$ 5.687 (2021) para R$ 11.681 (1S2026), alta de 105% em cinco anos. Recorte Bueno/Marista/Oeste/Jardim Goias em R$ 13.147/m2; Marista se aproxima de R$ 14 mil com unidades a R$ 18-19 mil. Ademi-GO cita pressao de custo de materiais, cambio, reforma tributaria e capital mais caro para incorporadoras.", "impacto_alto_padrao_goiania": "Concentracao de 31,8% da oferta em dois bairros explica por que o alto padrao em Goiania e um mercado de escassez geografica, nao de escassez de dinheiro. Tambem abre o argumento de transbordo: Serrinha a R$ 11.300/m2, Coimbra e Jardim America como entrada mais barata na mesma infraestrutura."}, {"titulo": "Goiania vende 7,3 mil imoveis em seis meses e estoque disponivel encolhe 6%", "veiculo": "Jornal Opcao", "data": "2026-09-25", "url_fonte": "https://www.jornalopcao.com.br/goiania/mercado-imobiliario-goiania-vendas-estoque-marista-871938/", "valido_ate": "2027-03-31", "resumo": "7.323 unidades vendidas no 1S2026 contra 6.606 lancadas; estoque -6% sobre o fim de 2025. Residencial: 7.219 unidades, +42% a/a, maior semestre da serie historica local e 4a posicao entre as capitais. Lancamentos 16,4% menores que no 2S2025. VGV de R$ 4,1 bi contra R$ 4,2 bi no 1S2025.", "impacto_alto_padrao_goiania": "Vender mais do que se lanca e a definicao operacional de estoque secando. Para o comprador de alto padrao, significa menos opcao de unidade boa (andar alto, melhor orientacao solar, planta privilegiada) a cada mes que passa."}, {"titulo": "Mercado imobiliario de Goiania acelera e unidades somem em poucas horas de lancamento", "veiculo": "Curta Mais", "data": "2026-02-27", "url_fonte": "https://curtamais.com.br/goiania/mercado-imobiliario-de-goiania-acelera-e-unidades-somem-em-poucas-horas-de-lancamento/", "valido_ate": "2027-02-27", "resumo": "Dual O.M. Stay, da OM Incorporadora, no Setor Marista, vendeu todas as unidades em quatro horas no lancamento. Entre 2022 e 2025 o mercado goianiense teve altas proximas de 20% ao ano. Reportagem registra m2 medio acima de R$ 10,6 mil e cerca de R$ 12,5 mil em bairros centrais, com registros acima de R$ 18 mil no alto padrao. Produto usava conceito Double Suites (21 m2 + 40 m2 integraveis em ~60 m2).", "impacto_alto_padrao_goiania": "Mostra o novo perfil: o capital do agro migrando de terra para ativo urbano, e o comprador tratando o imovel como instrumento de renda e protecao patrimonial, nao so como moradia. Esse e o comprador do alto padrao de Goiania em 2026."}, {"titulo": "Imovel em Goiania segue entre maiores valorizacoes do pais", "veiculo": "O Popular", "data": "2025-01-19", "url_fonte": "https://opopular.com.br/economia/imovel-em-goiania-segue-entre-maiores-valorizac-es-do-pais-1.3221738", "valido_ate": "2026-12-31", "resumo": "Residenciais usados em Goiania subiram 11,5% em media em 2024, a 3a maior alta entre as capitais do FipeZAP. Ademi-GO atribui a mudancas nos Planos Diretores que restringiram manchas de adensamento em Bueno, Marista e Oeste, a projetos mais sofisticados e ao encarecimento de terreno e construcao.", "impacto_alto_padrao_goiania": "A restricao de adensamento do Plano Diretor e a causa estrutural da escassez nos bairros nobres. Nao e ciclo passageiro: e limite legal de quanto ainda se pode construir em Bueno, Marista e Oeste. Fato mais antigo do radar — usar como causa de fundo, nunca como numero atual."}, {"titulo": "Indice FipeZAP registra alta de 0,48% nos precos dos imoveis em outubro", "veiculo": "Fipe / Grupo OLX — Informe de outubro de 2026", "data": "2026-10-31", "url_fonte": "https://downloads.fipe.org.br/indices/fipezap/fipezap-202610-residencial-venda.pdf", "valido_ate": "2026-12-20", "resumo": "Valorizacao mensal em 44 das 56 cidades monitoradas. Indice geral em R$ 10.065/m2 (+0,48% no mes, +5,44% em 12 meses). Goiania em R$ 8.531/m2 (+0,04% no mes, +6,34% em 12 meses), com amostra de 28.726 anuncios. Por bairro: Marista R$ 11.502/m2 (+3,4%), Sul R$ 10.933 (+4,1%), Jardim Goias R$ 9.932 (+4,3%), Bueno R$ 9.849 (+2,6%), Oeste R$ 8.833 (+8,3%), Jardim America R$ 8.812 (+10,0%).", "impacto_alto_padrao_goiania": "O dado que ninguem usa: Jardim America (+10,0%) e Oeste (+8,3%) estao valorizando mais rapido que Marista (+3,4%) e Bueno (+2,6%) em 12 meses. Os bairros consagrados ja precificaram; o ganho marginal migrou para a borda. Base factual para uma pauta de investidor."}, {"titulo": "Credito Imobiliario | Habitacao CAIXA — condicoes vigentes", "veiculo": "Caixa Economica Federal (pagina oficial)", "data": "2026-11-17", "url_fonte": "https://www.caixa.gov.br/voce/habitacao/Paginas/default.aspx", "valido_ate": "2027-02-28", "resumo": "Condicoes publicadas na pagina oficial: financiamento de ate 90% do valor do imovel, prazo de ate 35 anos, uso de FGTS para amortizar e pagar parte das prestacoes, acompanhamento pelo app Habitacao CAIXA. Lote urbano residencial com prazo de 120 a 240 meses.", "impacto_alto_padrao_goiania": "LTV de 90% e prazo de 35 anos sao os dois numeros que a Adao pode afirmar sem risco. A taxa de juros efetiva nao e publicada: depende de linha, relacionamento e analise de credito, e so sai no simulador. Em peca, citar LTV e prazo; nunca citar taxa."}], "setores_goiania": ["Marista", "Bueno", "Jardim Goias", "Aldeia do Vale", "Alphaville", "Jardins", "Setor Oeste", "Alto da Gloria", "Sudoeste"], "lacunas_declaradas": [{"tema": "Condominios fechados horizontais — Aldeia do Vale, Alphaville, Jardins, Jardins Porto", "status": "SEM FATO VALIDO", "motivo": "Nenhum indice oficial (FipeZAP, Ademi-GO, CBIC) publica serie de preco ou valorizacao para condominio horizontal fechado em Goiania. O que existe na web e preco de ANUNCIO em portal de corretagem (dfimoveis, wimoveis, zapimoveis), que nao e preco de transacao e nao sustenta afirmacao de valorizacao.", "decisao": "NAO entrou no radar. Peca sobre condominio fechado nao pode citar valorizacao de m2 nem comparativo de bairro. Pode citar apenas atributo verificavel do proprio imovel (metragem e preco do XML, foto do Drive)."}, {"tema": "Setores Alto da Gloria e Sudoeste", "status": "SEM FATO VALIDO", "motivo": "Nao aparecem na amostra de bairros do Informe FipeZAP de outubro/2026 (que lista Marista, Sul, Jardim Goias, Bueno, Oeste, Jardim America, Pedro Ludovico/Bela Vista, Aeroporto, Central, Nova Suica) nem no recorte da Ademi-GO.", "decisao": "NAO entrou no radar. Sem numero proprio, nao virar pauta de dado."}, {"tema": "Taxa de juros efetiva do financiamento imobiliario Caixa e demais bancos", "status": "SEM FATO VALIDO", "motivo": "A pagina oficial da Caixa nao publica taxa. As taxas que circulam na web (TR + 10,99% a 11,49% a.a., etc.) vem de blogs de corretagem e correspondentes bancarios, com numeros divergentes entre si e sem data confiavel.", "decisao": "NAO entrou no radar. Em peca, usar LTV (90%) e prazo (35 anos), que sao oficiais, e remeter a simulacao. Nunca publicar taxa."}, {"tema": "Teto do SFH em R$ 2,25 milhoes e uso de FGTS", "status": "FATO PROVAVEL, FONTE PRIMARIA NAO LOCALIZADA", "motivo": "Varios veiculos atribuem o teto a Resolucao CMN 5.255, de 10/10/2025, com extensao do uso do FGTS aprovada pelo Conselho Curador em 26/11/2025. Nao foi possivel abrir a norma no site do CMN/BCB nesta varredura para confirmar vigencia em novembro/2026.", "decisao": "NAO entrou no radar como indicador. Reabrir quando a resolucao for lida na fonte primaria. E um numero valioso para o alto padrao de Goiania (muitos imoveis da carteira ficam dentro do teto) — vale a checagem na proxima varredura."}]}, "pautas": {"atualizado_em": "2026-11-18", "regra_60_40": {"60": "Busca de cliente: imoveis de revenda da carteira e lancamentos.", "40": "Marca: mercado de Goiania, informativo, institucional, noticia."}, "regra_de_log": "Toda escolha do agente entra aqui com o porque. E este campo que vira o bloco 'Por que este post' no painel.", "semana": {"inicio": "2026-11-23", "fim": "2026-11-28", "volume_alvo": 10, "fechamento_60_40": {"busca_de_cliente": 6, "marca": 4, "confere": "6/10 = 60% · 4/10 = 40%"}, "pecas": [{"id": "S47-01", "dia": "2026-11-23", "hora": "08:00", "lado_60_40": "40 · marca", "formato": "arte única · notícia · 1080x1350", "fonte": "Radar de mercado: Copom (04/11/2026), Banco Central; Ademi-GO", "imovel_ou_tema": "Notícia · Selic em 13,75%: o juro parou", "angulo": "Abre a semana com a notícia que todo comprador de imóvel está acompanhando.", "por_que_este_post": ["Pauta de maior interesse da semana: o Copom interrompeu cinco cortes seguidos e manteve a Selic em 13,75% ao ano (pico anterior: 15%).", "O número que importa para quem compra: o m² de lançamentos em Goiânia segue em R$ 11.681, alta de 105% em 5 anos (Ademi-GO).", "Arte única de segunda de manhã: leitura em segundos, sem deslizar, com fonte impressa na peça.", "Posiciona o perfil como fonte de mercado antes de qualquer imóvel aparecer no feed."], "escolhido_por": "LEITOR DE NOTÍCIAS + ESTRATEGISTA DE PAUTA", "estado": "renderizada", "travas": [], "artefatos": ["entregas_reais/06_marca/noticia_selic/"]}, {"id": "S47-02", "dia": "202 ou": "A escada era um post sobre o planejamento da semana; saiu a pedido do diretor. Arquivadas em 06_marca/_arquivo_semana47_v1/."}], "dependencias_fechadas": ["2026-11-17 · RESOLVIDA. As gavetas 1 e 2 foram preenchidas pela Sessao A (29 indicadores e 9 noticias com url_fonte e valido_ate; manual de padroes com 10 padroes e o Formato Padrao Vencedor). S47-03 e S47-09 destravadas com fonte nomeada. S47-01 reescrito sob o Formato Vencedor: capa virou numero absoluto e entrou slide de virada com dado de mercado e fonte na tela.", "2026-11-17 · RESOLVIDA. dados/inventario_drives.md corrigido pela sessao orquestradora com a refutacao do AT38274."], "dependencias_abertas": ["S47-03 Guttyane: autorizacao de imagem por escrito. Sem o documento, o slot fica vazio — nenhum dos outros quatro depoimentos esta liberado.", "S47-07 Aldeia do Vale: confirmar se o imovel foi entregue. A descricao traz 'Entrega garantida 30/09/2026', data ja passada.", "S47-04 Portal do Sol Green: liberar recaptacao. Seis fotos publicaveis em 42; a shot list esta pronta.", "S47-08 e S47-09: producao da Sessao C. Esta sessao so reservou os espacos.", "Reenvio do exemplo de 'teto' (linha vermelha) que o diretor disse ter anexado: não chegou.", "Número do registro de incorporação do Óra para o rodapé dos simuladores (hoje [A CONFIRMAR]).", "Reel Óra: tamanho do Office (27 a 48 m² no reel; 27,10 a 63,56 m² no carrossel). Conferir com a Ávolli."]}, "regras_ceo": ["- R01 — Nenhum número, preço, metragem ou fato sai sem origem rastreável no XML, no Drive ou em URL de notícia.", "- R02 — Foto com marca d'água do CRM só quando não existir original no Drive.", "- R03 — Bodoni Moda nunca abaixo de 56px.", "- R04 — Vermelho só como acento. Nunca bloco, nunca fundo, nunca área ampla sobre foto.", "- R05 — Os três invariantes de assinatura em 100% das peças: badge de local, fio vermelho, frame final.", "- R06 — (2026-11-17, ajuste da diretoria) **Coerência visual e desejo do cliente vêm antes de rigor de dado.** Isto é uma simulação de capacidade, não um sistema em produção. Não cruzar Drive com XML, não travar peça por falta de fonte rastreável, não encher peça de indicador de mercado. O dado vem do diretor quando faltar — perguntar, nunca inventar, nunca bloquear.", "- R07 — (2026-11-17) **Peça de lançamento não é peça de mercado.** Lançamento vende produto, endereço, lifestyle e condição de pagamento, reaproveitando o material da incorporadora vestido no padrão da Adão. Tese de mercado com fonte pertence aos 40% de marca, nunca ao carrossel do lançamento.", "- R08 — (2026-11-17) **Revenda mostra o interior.** Esconder o apartamento por não poder provar que a foto é da unidade exata é cuidado demais virando erro. Mostrar e rotular como decorado da mesma tipologia.", "- R09 — (2026-11-17) **Simulador é peça de post, não chamada.** Arte bonita com a condição de pagamento em destaque. Proibido post pedindo que o cliente chame no Direct para receber simulação.", "- R10 — (2026-11-18, ajuste da diretoria) **Em imóvel de super luxo, o que vende é arquitetura, disposição e os cômodos — não diferencial periférico.** Usina fotovoltaica, poço, automação e marca de fornecedor são rodapé, nunca gancho. Mostrar os ambientes, a planta, a metragem e como a casa se organiza. Nas palavras do diretor: *o negócio é o simples bem feito*.", "- R11 — (2026-11-18, ajuste da diretoria) **Agente não executa sem plano aprovado.** Ao receber comando: planeja, manda o plano, para. Só produz depois do OK. Proibido antes disso: renderizar, montar vídeo, baixar acervo em massa. O plano traz ângulo, sequência com título-herói e foto de cada slide, e decupagem plano a plano no caso de vídeo. Motivo: refazer peça pronta custa muito mais que corrigir plano.", "- R12 — (2026-11-18, ajuste da diretoria) **Revenda: só a capa tem design.** A capa traz a localização como herói (ex.: CASA ALDEIA DO VALE) com metragem, quartos e vagas distribuídos, e usa a foto mais bonita e chamativa do imóvel. Os demais slides t é para o público do cliente, nunca para a diretoria.** Planejamento da semana, preço de portfólio em escada e bastidor não viram post. A semana abre com um superpost de impacto (notícia ou imóvel-herói).", "- R19 — (2026-11-18, ajuste da diretoria) **Reel de imóvel nunca é vídeo cru.** Abertura animada que identifica o imóvel (nome, tipo, ficha), destaques curtos em palavra-chave, texto na metade de cima, sem trilha, cartão final com preço e CRECI. Vídeo real do Drive primeiro; Higgsfield só para completar."], "historico": "# Gaveta 4 · Histórico e Regras do CEO\nBoletins, auditorias e as regras permanentes que nascem de ajuste pedido pela diretoria.\n\n## Regras permanentes\nRegra entra aqui quando a diretoria pede um ajuste. A partir daí vale para sempre, sem precisar repetir.\n\n- R01 — Nenhum número, preço, metragem ou fato sai sem origem rastreável no XML, no Drive ou em URL de notícia.\n- R02 — Foto com marca d'água do CRM só quando não existir original no Drive.\n- R03 — Bodoni Moda nunca abaixo de 56px.\n- R04 — Vermelho só como acento. Nunca bloco, nunca fundo, nunca área ampla sobre foto.\n- R05 — Os três invariantes de assinatura em 100% das peças: badge de local, fio vermelho, frame final.\n- R06 — (2026-11-17, ajuste da diretoria) **Coerência visual e desejo do cliente vêm antes de rigor de dado.** Isto é uma simulação de capacidade, não um sistema em produção. Não cruzar Drive com XML, não travar peça por falta de fonte rastreável, não encher peça de indicador de mercado. O dado vem do diretor quando faltar — perguntar, nunca inventar, nunca bloquear.\n- R07 — (2026-11-17) **Peça de lançamento não é peça de mercado.** Lançamento vende produto, endereço, lifestyle e condição de pagamento, reaproveitando o material da incorporadora vestido no padrão da Adão. Tese de mercado com fonte pertence aos 40% de marca, nunca ao carrossel do lançamento.\n- R08 — (2026-11-17) **Revenda mostra o interior.** Esconder o apartamento por não poder provar que a foto é da unidade exata é cuidado demais virando erro. Mostrar e rotular como decorado da mesma tipologia.\n- R09 — (2026-11-17) **Simulador é peça de post, não chamada.** Arte bonita com a condição de pagamento em destaque. Proibido post pedindo que o cliente chame no Direct para receber simulação.\n- R10 — (2026-11-18, ajuste da diretoria) **Em imóvel de super luxo, o que vende é arquitetura, disposição e os cômodos — não diferencial periférico.** Usina fotovoltaica, poço, automação e marca de fornecedor são rodapé, nunca gancho. Mostrar os ambientes, a planta, a metragem e como a casa se organiza. Nas palavras do diretor: *o negócio é o simples bem feito*.\n- R11 — (2026-11-18, ajuste da diretoria) **Agente não executa sem plano aprovado.** Ao receber comando: planeja, manda o plano, para. Só produz depois do OK. Proibido antes disso: renderizar, montar vídeo, baixar acervo em massa. O plano traz ângulo, sequência com título-herói e foto de cada slide, e decupagem plano a plano no caso de vídeo. Motivo: refazer peça pronta custa muito mais que corrigir plano.\n- R12 — (2026-11-18, ajuste da diretoria) **Revenda: só a capa tem design.** A capa traz a localização como herói (ex.: CASA ALDEIA DO VALE) com metragem, quartos e vagas distribuídos, e usa a foto mais bonita e chamativa do imóvel. Os demais slides são **fotos limpas**, sem arte por cima — o agente só escolhe as melhores. Economiza render e deixa a foto vender sozinha.\n- R13 — (2026-11-18, ajuste da diretoria) **Lançamento fala com o comprador final, não com engenheiro.** Fora: balanço estrutural, pavimento técnico, área de laje, número de pavimentos como argumento. Dentro: tipologias, parcela barata, localização, lazer completo, novidade (academia Reebok), rendimento, escassez, fachada e conveniência — tudo que descreve a experiência de morar ali e a valorização esperada pelos diferenciais.\n- R14 — (2026-11-18, ajuste da diretoria) **A capa é simétrica e os vetores conversam entre si.** Tudo no mesmo eixo central: logo da Adão no topo, olho, nome do imóvel, localização, régua, ficha e rodapé. A régua tem **a largura da ficha** — ela mede os números, nunca atravessa a foto como divisor solto. O vermelho vive nas barras do logo, não numa linha avulsa. Logo sempre presente, sempre pequeno.\n- R15 — (2026-11-18, achado da Sessão B) **Nenhuma placa de carro legível em peça publicada.** Dado identificável de terceiro não vai ao Instagram. Borrar antes de publicar, preservando o original ao lado, e conferir o resultado ampliado: tem que ficar ilegível sem o borrão chamar atenção. Vale também para rosto, documento, número de casa e qualquer identificador de terceiro.\n- R16 — (2026-11-18, ajuste da diretoria) **A linha vermelha é o \"teto\" da informação.** Ela nasce na largura exata do bloco de texto que ela cobre e fica colada acima dele. Nunca solta, nunca atravessando foto, nunca como divisor ou sublinhado. O vermelho de texto fica só no logo.\n- R17 — (2026-11-18, ajuste da diretoria) **\"Por que este post\" fala como produto, com dado.** 3 a 4 itens curtos: o que o imóvel ou o tema tem de diferencial (XML, Drive), o que a pesquisa de perfis e o radar de mercado mostram, o lugar da peça na semana. Nunca cita regra, erro, correção ou processo interno.\n- R18 — (2026-11-18, ajuste da diretoria) **Post é para o público do cliente, nunca para a diretoria.** Planejamento da semana, preço de portfólio em escada e bastidor não viram post. A semana abre com um superpost de impacto (notícia ou imóvel-herói).\n- R19 — (2026-11-18, ajuste da diretoria) **Reel de imóvel nunca é vídeo cru.** Abertura animada que identifica o imóvel (nome, tipo, ficha), destaques curtos em palavra-chave, texto na metade de cima, sem trilha, cartão final com preço e CRECI. Vídeo real do Drive primeiro; Higgsfield só para completar.\n\n## Boletins\n_(um por dia, mais novo em cima)_\n\n### Boletim das 7h — segunda-feira, 17 de novembro de 2026\n**Entrega completa:** `entregas_reais/02_boletim/boletim_7h.md` · **Fatos:** `cerebro/02_radar_de_mercado.json`\n(29 indicadores, 9 notícias, 10 URLs, 4 lacunas declaradas — todos com `url_fonte` e `valido_ate`).\n\n**Manchete do dia:** o juro parou de cair e o metro quadrado de Goiânia não parou de subir.\n\n**Macro.** Copom manteve a Selic em **13,75% a.a.** em 04/11, por unanimidade, interrompendo cinco cortes de\n0,25 p.p.; próxima decisão em **09/12/2026** ([BCB SGS 432](https://api.bcb.gov.br/dados/serie/bcdata.sgs.432/dados/ultimos/1?formato=json),\n[O Liberal](https://www.oliberal.com/economia/bc-copom-interrompe-ciclo-de-calibracao-e-mantem-taxa-selic-em-13-75-ao-ano-1.1190560)).\nIPCA de outubro em **0,14%**, **4,63% em 12 meses**, ainda acima do teto de 4,5% da meta\n([Agência Gov/IBGE](https://agenciagov.ebc.com.br/noticias/202611/inflacao-desacelera-e-fica-em-0-14-em-outubro)).\nINCC-M em **0,35%** no mês e **6,75% em 12 meses** — mais de dois pontos acima do IPCA\n([Brasil 61/FGV](https://brasil61.com/n/custo-da-construcao-sobe-0-35-em-outubro-aponta-fgv-bras2617395)).\n\n**Goiânia.** 1S2026: **7.323 unidades vendidas** contra **6.606 lançadas**, estoque **-6%**; residencial com\n**7.219 unidades, +42%** a/a — maior semestre da série local e **4ª capital** do país, contra +5,4% do Brasil\n(CBIC); lançamentos **-16,4%** vs. 2S2025; VGV de **R$ 4,1 bi** contra R$ 4,2 bi no 1S2025\n([Jornal Opção 25/09](https://www.jornalopcao.com.br/goiania/mercado-imobiliario-goiania-vendas-estoque-marista-871938/)).\nm² residencial a **R$ 11.681** (Ademi-GO, acum. até junho), **+7,4%** sobre 2025 e **+105%** sobre 2021;\nrecorte Bueno+Marista+Oeste+Jardim Goiás a **R$ 13.147/m²**; Marista perto de R$ 14 mil, com unidades a\n**R$ 18–19 mil/m²**; Bueno+Marista concentram **31,8% da oferta**\n([Jornal Opção 23/09](https://www.jornalopcao.com.br/ultimas-noticias/bueno-e-marista-concentram-318-dos-imoveis-a-venda-em-goiania-metro-quadrado-chega-a-r-116-mil-870840/)).\n\n**O achado do dia.** No FipeZAP de outubro/2026, Goiânia subiu **+6,34% em 12 meses** (R$ 8.531/m², 28.726\nanúncios), acima da média das 56 cidades (+5,44%). Mas por bairro a ordem se inverte: **Jardim América +10,0%**\ne **Setor Oeste +8,3%** valorizaram mais que **Marista +3,4%** e **Bueno +2,6%**. O bairro consagrado já\nprecificou; o ganho marginal migrou para a borda\n([Informe FipeZAP out/2026](https://downloads.fipe.org.br/indices/fipezap/fipezap-202610-residencial-venda.pdf)).\n\n**4 pautas de mercado (os 40%):** 1) \"O juro parou. O metro quadrado não.\" · 2) \"Um terço de Goiânia está em\ndois bairros\" · 3) \"O bairro que mais valorizou em Goiânia não é o Marista\" · 4) \"Goiânia vendeu mais do que\nlançou\". Detalhamento com gancho, formato e fonte no arquivo da entrega.\n\n**Regras de produção que este boletim impõe — candidatas a regra permanente:**\n- **Duas séries de m², nunca misturadas.** FipeZAP (R$ 8.531/m²) mede **anúncio de usado pronto**; Ademi-GO\n  (R$ 11.681/m²) mede **oferta de lançamento**. Não somar, não cruzar, não comparar na mesma peça.\n- **Nunca publicar taxa de juros de financiamento.** A Caixa não a publica; o que circula na web é blog de\n  corretagem com números divergentes. Usar só **LTV de 90%** e **prazo de 35 anos**, que são oficiais\n  ([Caixa](https://www.caixa.gov.br/voce/habitacao/Paginas/default.aspx)), e remeter à simulação.\n- **Condomínio fechado (Aldeia do Vale, Alphaville, Jardins) não tem índice oficial.** Peça sobre eles não\n  cita valorização de m² nem comparativo de bairro — só atributo verificável do próprio imóvel (XML + Drive).\n- **Alto da Glória e Sudoeste** não aparecem na amostra do FipeZAP nem no recorte da Ademi-GO. Sem número\n  próprio, não viram pauta de dado.\n- **Se citar os +42% de vendas, citar o VGV de R$ 4,1 bi vs. R$ 4,2 bi.** Mais unidade com faturamento igual\n  é ticket médio menor; omitir isso faz a peça mentir por recorte.\n\n**Pendência para a próxima varredura:** confirmar na fonte primária o teto do SFH em R$ 2,25 milhões\n(atribuído à Resolução CMN 5.255, de 10/10/2025) e o uso de FGTS até esse teto. Não entrou no radar por falta\nde fonte primária, mas é argumento forte para a carteira de alto padrão da Adão.\n\n**Validade:** Selic até 09/12 · IPCA até 11/12 · FipeZAP até 20/12 · INCC até 23/12 · Ademi-GO até 31/03/2027.\n\n\n\n## Auditorias do CEO\n\n### 2026-11-17 · Erros que o próprio sistema pegou\n1. **Sessão C** achou divergência de área nos simuladores da Ávolli (unidade 4008 anunciada com a área da 2807) e, depois, um erro **próprio** de leitura de 20 centavos, pego pela conferência automática de soma.\n2. **Sessão B** publicou condomínio de R$ 1 e criou uma trava de compliance em cima do próprio erro — os valores eram do AT43159. Diagnóstico dela: *\"o erro se disfarçou de rigor\"*. O parser estava correto.\n3. **Sessão A** auditou o ângulo da Sessão C e impediu que a peça afirmasse por omissão que o Bueno estava valorizando, quando 2,6% era a menor alta da cidade.\n4. **Coordenação** inventou \"12º andar\" numa prova de capa e removeu antes de mostrar.\n5. **Coordenação** recomendou régua de números para o lançamento sem distinguir peça de mercado de peça de lançamento — origem da R07.\n\n### 2026-11-18 · Auditoria do módulo 5\n- **Revisor errou:** reprovou \"1 escritório\" do Portal do Sol por não achar o dígito 1 na fonte. A fonte dizia \"escritório\" no singular. Regra do script corrigida.\n- **Qualidade reprovou Óra slides 2, 3, 4:** colisão tipográfica por posicionamento estimado. Pendente: medir `boundingBox()` no `render_carrossel.mjs`.\n- **CEO reprovou legenda do Opus Gyro:** trava obsoleta (\"nenhuma foto de interior\") contra a R08 e rótulo de decorado ausente.\n- **Coordenadora errou:** a variante de slot do calendário usava a classe `.marca`, que já existia no cabeçalho. Colisão de nome de CSS deixou rótulo e tema lado a lado.\n"}, "kit": "# Kit dos corretores — semana 47 (23–28/11/2026)\nPara o corretor postar no perfil pessoal. Três legendas por imóvel: **direta**, **consultiva**, , R15, R09.\n\n| Peça | Veredito | Observação |\n|---|---|---|\n| Opus Gyro (8) | **APROVADO** | Capa simétrica, ficha legível, interiores limpos |\n| Aldeia do Vale (8) | **APROVADO** | Capa limpa, R10 respeitada (arquitetura e cômodos, sem autonomia como gancho) |\n| Portal do Sol (6) | **APROVADO** | R15 conferido ampliado: placa do carro na capa está ilegível sem chamar atenção. Só 6 fotos: limite do acervo, shot list de recaptação em rascunho |\n| Ravenallas (8) | **APROVADO** | Capa e slides limpos |\n| Simuladores (3) | **APROVADO** | Fio vermelho separa a linha \"47 mensais\", não corta texto. R09 ok: nenhuma chamada para Direct |\n| Óra carrossel slide 1, 5, 6, 7, 8 | **APROVADO** | Rótulo de decorado no slide 5 |\n| Óra carrossel slide 3 | **REPROVADO → CORRIGIDO** | \"climatizada\" nasce em cima da perna direita do \"A\" de PISCINA. O \"c\" some |\n| Óra carrossel slide 4 | **REPROVADO → CORRIGIDO** | \"REEBOK\" e \"250 M²\" se tocam: o pé do primeiro encosta no topo do segundo. Entrelinha curta demais |\n| Óra carrossel slide 2 | **REPROVADO → CORRIGIDO** | \"trabalhar\" cruza o \"R\" de ALUGAR e \"MORAR\" encosta no topo de \"ALUGAR\". Legível, mas sujo |\n\nCausa raiz, igual à já registrada: o fio e o cruzamento itálico são posicionados por **estimativa**, não por medida do elemento renderizado. Correção estrutural pendente em `render_carrossel.mjs` (medir `boundingBox()` antes do screenshot). Dono do conserto: Sessão C (`entregas_reais/04_lancamento/`).\n\n**Reprovação de texto (Opus Gyro, `01_redacao.md`):**\n- A trava da linha 9 diz \"Nenhuma foto de interior da unidade decorada. Só áreas comuns\". Está obsoleta: a R08 passou a exigir interior rotulado, e o carrossel mostra interior em 5 das 8 fotos.\n- Nenhuma das três legendas traz o rótulo exigido pelo `_rotulo` do spec: *\"as fotos de interior são da unidade decorada, mesma tipologia\"*. Peça com interior sem rótulo reprova (R08).\n- Ajuste exigido: linha de rótulo entra nas 3 legendas (já aplicada no kit; o arquivo do redator é da Sessão B).\n\n## 3. AGENTE CEO\n**Ajuste real exigido antes de aprovar:** o conjunto não sai com os slides 2, 3 e 4 do Óra colidindo nem com a legenda do Opus sem rótulo. Primeira peça da semana a ir ao ar é a escada (S47-01), que mostra o Opus Gyro: o rótulo entra primeiro.\n\n**Parecer geral:** a carteira está coerente (escada R$ 650 mil → R$ 10,5 mi), a capa é simétrica nos quatro imóveis, e as travas de dado (condomínio, faixa de preço, simulador sem Direct) seguraram. Nenhuma peça publica número fora de fonte.\n\n\"Por que este post\" por peça: já está no `cerebro/03_banco_de_pautas.json` (4 bullets) e aparece no painel, aba 2. Não reescrito: está bom.\n\n## 4. Pendências\n- **Guttyane:** imagem autorizada pelo diretor em 2026-11-18. S47-03 destravada. O reel (corte de 25 s do depoimento) ainda **não foi produzido**.\n- **Aldeia do Vale:** data de entrega vencida tratada como entregue (diretor, 2026-11-18). Nota `_nao_publicar` no spec está obsoleta, remoção é da Sessão B.\n- **Portal do Sol, recaptação:** liberação pendente com a diretoria.\n- **Peças planejadas sem arte renderizada:** S47-01 (escada), S47-03 (reel Guttyane), S47-05 (Morar no Aldeia do Vale), S47-10 (contraste do Bueno). O kit cobre só o que existe.\n\n## 5. Reprovações corrigidas (2026-11-18, Sonnet)\n- Óra slide 3: \"climatizada\" desceu para baixo da palavra, à direita. Sem cruzar o \"A\".\n- Óra slide 4: nova opção `respiro` no `render_ora.mjs` (margem entre as duas linhas do título), 22 px. REEBOK e 250 M² não se tocam mais.\n- Óra slide 2: `respiro` de 18 px e \"trabalhar\" abaixo de ALUGAR. Fio movido junto.\n- Opus Gyro: trava velha revogada e linha de rótulo de decorado nas 3 legendas e nos stories que citam o rooftop (`01_redacao.md`).\nRerender conferido a olho nos três slides. O `render_ora.mjs` continua posicionando por estimativa; a correção estrutural (medir `boundingBox()`) segue pendente.\n\n## 6. Peças de marca renderizadas (2026-11-18, Sonnet) — `entregas_reais/06_marca/`\n- **S47-01 `escada_semana/`** (5 slides): preços e metragens conferidos à mão contra as fontes (R$ 650 mil / 1,8 mi / 1,89 mi / 10,5 mi; 49, 191 e 645 m²). Aprovada pelo diretor.\n- **S47-10 `bueno_contraste/`** (5 slides): título corrigido de \"studio\" para \"apartamento compacto\" (o Opus Gyro tem 1 suíte). Slide 4 traz a ressalva \"unidades distintas: preço e metragem não se comparam por m²\", para a peça não virar comparação de preço por metro quadrado. Só área comum do Opus (rooftop), então não precisa de rótulo de decorado.\n- **S47-05 `aldeia_morar/`** (5 slides): texto do condomínio vem da descrição da diretoria; as fotos são da casa (exterior e vista), nenhuma finge ser lago ou área comum. Slide final antecipa a peça de quinta.\n- **Reprovação do próprio render:** a primeira passada saiu com títulos quebrando em 3 linhas e o fio vermelho cortando o texto no S47-10 (slides 1 e 4) e no S47-05 (slides 2, 4 e 5). Causa: título comprido demais para a largura. Corrigido encurtando (\"DOIS JEITOS DE MORAR\", \"ESCOLHA SEU JEITO\", \"LAGOS E LAZER\", \"TUDO POR PERTO\", \"QUINTA, A CASA\").\n\n## 7. Reel da Guttyane (S47-03) — `entregas_reais/06_marca/reel_guttyane/reel_guttyane.mp4` (26,3 s, 1080x1920)\nDecisões fechadas com o diretor pelo grill-me (2026-11-18): corte sem as falas problemáticas; destaques só em 6 palavras; efeito \"texto atrás dela\" onde ela está na tela; legenda queimada mantida; lower-third com cargo informado por ele.\n\n- **Achados do Revisor no material bruto:** a fala \"primeiro lançamento de 2026 no Setor Bueno\" não tem fonte no projeto e \"vai ser um sucesso\" é promessa de resultado. As duas ficaram fora do corte (0–5 s, 5,1–7,1 s, 10,7–15,3 s, 35,9–49 s).\n- **Achado de qualidade:** o arquivo recebido já era um vídeo editado, com legenda embutida e cenas de render. Ela só aparece na tela nos 5 primeiros segundos, então \"palavra atrás dela\" só vale no gancho (ATRAVESSAR GOIÂNIA, com máscara de pessoa do Apple Vision). As outras 5 palavras (ÓRA VACA BRAVA, ÁVOLLI + BILD, ROOFTOP, 250 M², PISCINA 25 M) entram sobre a imagem, acima da legenda queimada, que o diretor mandou manter.\n- **Limite conhecido:** a legenda queimada mostra a palavra \"primeiro\" por menos de 1 s em \"ÓRA VACA BRAVA, primeiro\" (a frase do dado sem fonte, cortada do áudio). Não há como removê-la sem estragar a imagem.\n- **Erros do próprio render, corrigidos:** \"ATRAVESSAR\" encostava nas bordas (150 px → 128 px); o logo do frame final não carregava, porque o Chromium bloqueia imagem `file://` a partir de página em branco (agora a página vai de arquivo em disco); lower-third e badge estavam pequenos demais (13 px → 16–18 px).\n- **Padrão R05:** badge \"Óra Vaca Brava · Setor Bueno\", fio vermelho no lower-third (4 s) e frame final de 1,6 s com logo e CRECI. O diretor não respondeu a esse item; assumi a recomendação, fácil de remover.\n- **Calendário:** mantida como lado 40 (rosto do time). Semana segue 6/4.\n- **Ferramentas novas:** `ferramentas/recorte_pessoa.swift` (máscara de pessoa por quadro), `reel_guttyane/cartoes.mjs` e `montar.sh`.\n\n## 8. Office Park (S47-08), acentos e fechamento (2026-11-18, Sonnet)\n- **Erro meu, corrigido:** ao propor a peça, afirmei ao diretor que a faixa \"27,10 a 63,56 m²\" não aparecia em nenhuma fonte e propus omiti-la. Errado: a análise oficial (`01_analise_ora_vaca_brava.md`) traz 63,56 m² como a área da planta do 3º pavimento (a ficha técnica diz 63,62). A peça usa 27,10 a 63,56 m² com a referência \"planta oficial\". Padrão do erro: afirmar ausência sem procurar na pasta de análise antes.\n- **S47-08 renderizado** (`04_lancamento/carrossel_office/`, 5 slides): capa, recepção do térreo, coworking do 11º, salas do 3º ao 9º pavimento e CTA da unidade 303 (47 × R$ 1.190, 3 × R$ 7.900, total R$ 433.218, valores lidos do `simulacoes.json` por script). O Revisor ganhou checagem própria para essa peça: 0 reprovações.\n- **Acentos no banco de pautas:** o arquivo inteiro estava sem acento. Restaurei nos três campos que aparecem no painel (`por_que_este_post`, `angulo`, `imovel_ou_tema`) com trava automática: a única diferença permitida era acentuação. Nomes e citações do material oficial ficaram com a grafia oficial (\"não é casa de construtor\", \"Espatódias\", \"Ávolli\"). Campos internos (`fonte`, `travas`, `ideias_nao_usadas`) ficaram como estavam.\n- **Painel:** 10 cartões, cada um ligado à sua pauta. O reel e os simuladores do Óra, que se soltaram quando o módulo ganhou o segundo carrossel, foram reanexados por `_anexos` em `painel_diretoria/vinculos.json`.\n- **Passagem de design do painel:** decisão do diretor: fica para uma etapa individual, depois de todas as entregas, feita junto com ele (design e UI/UX).\n\n## 9. Painel novo: auditoria com as 5 skills (2026-11-18, Sonnet)\nSkills instaladas em `.claude/skills/` (autorizadas pelo diretor). Esta sessão não as carregou como comandos, então li cada `SKILL.md` e apliquei como lista de verificação, com testes automáticos em 390x844 e 1470x956, temas escuro e claro.\n- **web-design-guidelines (Vercel):** achou placeholders sem \"…\", imagens sem largura e altura, `touch-action` ausente, campos sem `name` e `autocomplete`, `theme-color` fixo, dias da semana escritos à mão em vez de `Intl`, marcas sem `translate=\"no\"` e peça aberta fora da URL. Corrigido tudo; a peça agora tem link direto (`#/fila/p/<peça>`) e o botão Voltar do navegador fecha a janela.\n- **web-animation-design:** achou modal em 400 ms (limite 300), mola com overshoot de 1,56, entrada de página com deslocamento a cada troca de seção e hover em 250 ms. Corrigido: modal 250 ms, mola 1,2, entrada só com fade de 150 ms e sem animar no primeiro carregamento, hover 150 ms. `prefers-reduced-motion` verificado.\n- **make-interfaces-feel-better:** achou escalas de toque inconsistentes (0,97, 0,985, 0,9), raio das etiquetas fora do concêntrico, falta de contorno de 1 px nas imagens e animação de ícone fora do padrão. Corrigido: 0,96 em tudo, raio 4 nas etiquetas, contorno 1 px nas imagens, ícone com escala de 0,25 a 1 e desfoque de 4 px a 0.\n- **audit-as-a11y-eng:** achou o foco não voltando ao cartão ao fechar a peça (corrigido), atalhos que paravam após redesenhar (corrigido), campo de comentário sem `aria-describedby` e `aria-invalid` (corrigido), tema claro com status abaixo de 4,5:1 (corrigido), foco sem ir para o conteúdo ao trocar de seção (corrigido). Verificado: 0 controles sem nome, foco preso dentro da janela, 0 falhas de contraste além dos números decorativos da fileira em ordem (ocultos para leitor de tela).\n- **audit-as-ux-eng:** achou beco sem saída depois de \"Pedir ajuste\" (a peça nunca voltava), rascunho de comentário perdido ao fechar e fonte vaga no pedido com anexos. Corrigido: botão para receber a peça reenviada em versão 2, rascunho salvo por peça, aprendizado guardado em histórico mesmo depois do reenvio.\n**Não verificado:** iPhone e Safari reais, leitor de tela real e a conexão real com Drive e XML.\n"};</script>

/* ============================== utilidades ============================== */
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NF = new Intl.NumberFormat('pt-BR'), NF1 = new Intl.NumberFormat('pt-BR',{maximumFractionDigits:2});
const fmtN = n => NF.format(Math.round(n));
const DF = new Intl.DateTimeFormat('pt-BR',{weekday:'short',day:'numeric'});
const DFL = new Intl.DateTimeFormat('pt-BR',{weekday:'long',day:'numeric',month:'long'});
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const fmtDia = d => cap(DF.format(d).replace('.','').replace(',',''));
const fmtHora = d => d.getMinutes()? `${d.getHours()}h${String(d.getMinutes()).padStart(2,'0')}` : `${d.getHours()}h`;
const hash = s => [...s].reduce((h,c)=>Math.imul(h^c.charCodeAt(0),16777619),2166136261)>>>0;
const rng = seed => { let a=seed>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; };
const inl = t => esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
  .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/g,'$1<em>$2</em>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
function md(src){
  const L = String(src||'').replace(/\r/g,'').split('\n'); const out=[]; let i=0;
  const isTab = (a,b) => a&&b&&a.includes('|')&&/^\s*\|?\s*:?-{2,}/.test(b);
  const cells = l => l.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
  while(i<L.length){
    const l=L[i];
    if(!l.trim()){ i++; continue; }
    let m;
    if(/^```/.test(l)){ const b=[]; i++; while(i<L.length&&!/^```/.test(L[i])) b.push(L[i++]); i++; out.push(`<pre><code>${esc(b.join('\n'))}</code></pre>`); continue; }
    if((m=l.match(/^(#{1,4})\s+(.*)$/))){ const n=Math.min(m[1].length+1,4); out.push(`<h${n}>${inl(m[2])}</h${n}>`); i++; continue; }
    if(/^\s*(-{3,}|\*{3,})\s*$/.test(l)){ out.push('<hr>'); i++; continue; }
    if(isTab(l,L[i+1])){ const h=cells(l); i+=2; const rows=[]; while(i<L.length&&L[i].includes('|')&&L[i].trim()) rows.push(cells(L[i++]));
      out.push(`<div class="tbl" tabindex="0" role="region" aria-label="Tabela"><table><thead><tr>${h.map(c=>`<th>${inl(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${inl(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`); continue; }
    if(/^>\s?/.test(l)){ const b=[]; while(i<L.length&&/^>\s?/.test(L[i])) b.push(L[i++].replace(/^>\s?/,'')); out.push(`<blockquote>${b.map(x=>x.trim()?`<p>${inl(x)}</p>`:'').join('')}</blockquote>`); continue; }
    if(/^\s*([-*]|\d+\.)\s+/.test(l)){ const ord=/^\s*\d+\./.test(l); const it=[]; while(i<L.length&&/^\s*([-*]|\d+\.)\s+/.test(L[i])) it.push(L[i++].replace(/^\s*([-*]|\d+\.)\s+/,'')); out.push(`<${ord?'ol':'ul'}>${it.map(x=>`<li>${inl(x)}</li>`).join('')}</${ord?'ol':'ul'}>`); continue; }
    const p=[]; while(i<L.length&&L[i].trim()&&!/^(#{1,4}\s|```|>|\s*([-*]|\d+\.)\s|\s*(-{3,})\s*$)/.test(L[i])&&!isTab(L[i],L[i+1])) p.push(L[i++]); out.push(`<p>${inl(p.join(' '))}</p>`);
  }
  return out.join('\n');
}

  if(k==='a'&&dlg.querySelector('#ap')){ e.preventDefault(); aprova(); }
  else if(k==='r'&&dlg.querySelector('#aj')){ e.preventDefault(); dlg.querySelector('#cmt').focus(); }
  else if(k==='j'||k==='k'){ e.preventDefault(); troca(k==='j'?1:-1); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); dlg.querySelector('#sr')?.click(); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); dlg.querySelector('#sl')?.click(); }
});

/* ============================== confirmar execução ============================== */
function abreConf(){
  const novos=PECAS.filter(p=>stat(p)==='aprovada').sort((a,b)=>a.dt-b.dt), fora=PECAS.filter(p=>['pendente','ajuste'].includes(stat(p)));
  conf.innerHTML=`<div class="sm-body"><h2 id="conf-t">Confirmar execução do plano</h2><p>${novos.length?`A agência programa ${novos.length} ${novos.length===1?'peça':'peças'} nos horários da semana e envia o kit ao grupo dos corretores.`:'Não há peças aprovadas para programar.'}</p>
    <ul aria-label="Peças a programar">${novos.map(p=>`<li><span translate="no">${esc(p.nome)}</span><span>${esc(p.quando2)}</span></li>`).join('')}</ul>
    ${fora.length?`<p class="muted">${fora.length} ${fora.length===1?'peça fica':'peças ficam'} de fora até você decidir (pendentes ou em ajuste).</p>`:''}
    <div class="sm-act"><button class="btn btn-gray" type="button" id="cv">Voltar</button><button class="btn btn-red" type="button" id="cc" ${novos.length?'':'disabled'}>${svg('send')}Confirmar execução</button></div></div>`;
  conf.showModal();
  conf.querySelector('#cv').onclick=()=>conf.close();
  conf.querySelector('#cc').onclick=()=>{ const ja=S.plano?S.plano.itens:[]; S.plano={em:S.plano?S.plano.em:Date.now(),itens:[...ja,...novos.map(p=>p.s)]}; save(); conf.close(); refresh(); aviso('Plano confirmado. Posts programados e kit enviado ao grupo.'); };
}
function abreSheet(titulo,corpo,op){ sheet.innerHTML=`<div class="sm-body"><h2 id="sheet-t">${esc(titulo)}</h2>${corpo}<div class="sm-act"><button class="btn btn-gray" type="button" id="sx">Fechar</button></div></div>`; sheet.showModal(); sheet.querySelector('#sx').onclick=()=>sheet.close(); sheet.addEventListener('close',()=>{ if(op&&op.isConnected) op.focus(); },{once:true}); }
[conf,sheet].forEach(d=>d.addEventListener('click',e=>{ if(e.target===d) d.close(); }));

/* ============================== aviso ============================== */
const toast=$('toast'); let tt;
function aviso(txt,comDesfazer){ $('toast-t').textContent=txt; $('toast-b').style.display=comDesfazer?'':'none'; toast.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>toast.classList.remove('on'),5000); }
$('toast-b').onclick=()=>{ if(desfazer){ desfazer(); desfazer=null; } toast.classList.remove('on'); };

route();
</script>
