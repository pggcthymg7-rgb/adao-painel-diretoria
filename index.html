a **ticket médio menor no volume** — o crescimento de 42% não foi puxado pelo alto padrão.\n\n---\n\n## 3. Quatro ideias de pauta de mercado (os 40%)\n\nProntas para virar carrossel ou reel institucional. Cada pauta traz os números exatos e a fonte, e nenhuma\ndepende de dado que não esteja no radar.\n\n### Pauta 1 — \"O juro parou. O metro quadrado não.\"\n- **Formato:** carrossel de 5 slides, post de dado.\n- **Gancho da capa:** *Em 2021 o m² de Goiânia era R$ 5.687. Hoje é R$ 11.681.*\n- **Miolo:** Selic parada em 13,75% desde 4 de novembro, próxima decisão só em 9 de dezembro · m² da cidade\n  +7,4% em seis meses · +105% em cinco anos · dois anos consecutivos de alta de 18%.\n- **Virada:** quem esperou o corte de 0,25 ponto que não veio pagou, nesses seis meses, 7,4% mais caro pelo\n  mesmo metro.\n- **Ângulo:** racional, custo de oportunidade.\n- **Fontes:** [BCB SGS 432](https://api.bcb.gov.br/dados/serie/bcdata.sgs.432/dados/ultimos/1?formato=json) ·\n  [Jornal Opção 23/09](https://www.jornalopcao.com.br/ultimas-noticias/bueno-e-marista-concentram-318-dos-imoveis-a-venda-em-goiania-metro-quadrado-chega-a-r-116-mil-870840/)\n- **Cuidado do Revisor:** o 105% e o R$ 11.681 são série Ademi-GO (oferta de lançamento). Não misturar com\n  FipeZAP no mesmo slide.\n\n### Pauta 2 — \"Um terço de Goiânia está em dois bairros\"\n- **Formato:** carrossel de 6 slides, post de dado com mapa.\n- **Gancho da capa:** *31,8% de todos os imóveis à venda em Goiânia estão em dois setores.*\n- **Miolo:** Bueno + Marista = 31,8% da oferta · recorte dos quatro bairros nobres a R$ 13.147/m² · Marista\n  perto de R$ 14 mil, com unidades a R$ 18–19 mil · causa estrutural: o Plano Diretor restringiu o\n  adensamento justamente em Bueno, Marista e Oeste.\n- **Virada:** não é o dinheiro que está escasso em Goiânia, é o terreno onde ainda se pode construir.\n- **Ângulo:** racional, escassez estrutural.\n- **Fontes:** [Jornal Opção 23/09](https://www.jornalopcao.com.br/ultimas-noticias/bueno-e-marista-concentram-318-dos-imoveis-a-venda-em-goiania-metro-quadrado-chega-a-r-116-mil-870840/) ·\n  [O Popular 19/01/2025](https://opopular.com.br/economia/imovel-em-goiania-segue-entre-maiores-valorizac-es-do-pais-1.3221738)\n\n### Pauta 3 — \"O bairro que mais valorizou em Goiânia não é o Marista\"\n- **Formato:** carrossel de 7 slides — um bairro por slide, em ordem crescente de valorização, com o ranking\n  revelado no fim.\n- **Gancho da capa:** *Marista subiu 3,4% em 12 meses. Jardim América subiu 10,0%.*\n- **Miolo:** a tabela de seis bairros do FipeZAP de outubro/2026 (Marista 11.502 / +3,4% · Sul 10.933 / +4,1% ·\n  Jardim Goiás 9.932 / +4,3% · Bueno 9.849 / +2,6% · Oeste 8.833 / +8,3% · Jardim América 8.812 / +10,0%) ·\n  transbordo da demanda para Serrinha (R$ 11.300/m²), Coimbra e Jardim América.\n- **Virada:** o bairro consagrado já precificou. O ganho marginal migrou para a borda da mancha nobre.\n- **Ângulo:** racional, contraintuitivo — é a pauta mais forte das quatro, porque contraria o senso comum do\n  mercado com número oficial.\n- **Fontes:** [Informe FipeZAP outubro/2026](https://downloads.fipe.org.br/indices/fipezap/fipezap-202610-residencial-venda.pdf) ·\n  [Jornal Opção 23/09](https://www.jornalopcao.com.br/ultimas-noticias/bueno-e-marista-concentram-318-dos-imoveis-a-venda-em-goiania-metro-quadrado-chega-a-r-116-mil-870840/)\n- **Cuidado do Revisor:** série FipeZAP (anúncio de usado) no slide do ranking; o Serrinha é Ademi-GO. Marcar\n  a fonte em cada slide, não só no último.\n\n### Pauta 4 — \"Goiânia vendeu mais do que lançou\"\n- **Formato:** reel institucional de 30 a 40 segundos, falado, com os números entrando em tela.\n- **Gancho dos 3 primeiros segundos:** *7.323 vendidos. 6.606 lançados. O estoque de Goiânia caiu 6%.*\n- **Miolo:** residencial +42% contra o 1S2025, maior semestre da série histórica local · 4ª capital do país em\n  volume · Brasil cresceu 5,4% no mesmo período (CBIC) · lançamentos 16,4% menores que no 2S2025 · custo de\n  construir a 6,75% em 12 meses, acima do IPCA de 4,63% · o Dual O.M. Stay, no Marista, esgotou em quatro horas.\n- **Virada:** menos lançamento com mais venda e obra mais caendo não é aquecimento passageiro — é a próxima\n  tabela nascendo mais alta.\n- **Ângulo:** racional com tensão de tempo.\n- **Fontes:** [Jornal Opção 25/09](https://www.jornalopcao.com.br/goiania/mercado-imobiliario-goiania-vendas-estoque-marista-871938/) ·\n  [Brasil 61 / FGV](https://brasil61.com/n/custo-da-construcao-sobe-0-35-em-outubro-aponta-fgv-bras2617395) ·\n  [Agência Gov / IBGE](https://agenciagov.ebc.com.br/noticias/202611/inflacao-desacelera-e-fica-em-0-14-em-outubro) ·\n  [Curta Mais 27/02/2026](https://curtamais.com.br/goiania/mercado-imobiliario-de-goiania-acelera-e-unidades-somem-em-poucas-horas-de-lancamento/)\n- **Honestidade obrigatória nesta pauta:** se o reel citar os 42%, tem que citar que o VGV ficou em R$ 4,1 bi\n  contra R$ 4,2 bi — o volume cresceu com ticket médio menor. Omitir isso faria a peça mentir por recorte.\n\n---\n\n## 4. O que o radar NÃO tem, e por que nenhuma peça pode usar\n\nQuatro lacunas foram declaradas em `cerebro/02_radar_de_mercado.json`. Elas são instrução de produção, não\nobservação:\n\n1. **Condomínios fechados horizontais — Aldeia do Vale, Alphaville, Jardins, Jardins Porto.** Nenhum índice\n   oficial (FipeZAP, Ademi-GO, CBIC) publica série de preço ou valorização para condomínio horizontal em\n   Goiânia. O que existe na web é **preço de anúncio** em portal de corretagem, que não é preço de transação.\n   → Peça sobre condomínio fechado **não cita valorização de m² nem comparativo de bairro**. Cita só atributo\n   verificável do próprio imóvel: metragem e preço do XML, foto do Drive.\n2. **Alto da Glória e Sudoeste.** Não aparecem na amostra de bairros do FipeZAP de outubro/2026 nem no recorte\n   da Ademi-GO. → Sem número próprio, não viram pauta de dado.\n3. **Taxa de juros efetiva de financiamento.** A Caixa não publica. As taxas que circulam vêm de blogs de\n   corretagem, divergem entre si e não têm data confiável. → Usar LTV de 90% e prazo de 35 anos, que são\n   oficiais, e remeter à simulação. **Nunca publicar taxa.**\n4. **Teto do SFH em R$ 2,25 milhões e uso de FGTS.** Fato provável (atribuído à Resolução CMN 5.255, de\n   10/10/2025, com extensão do FGTS aprovada em 26/11/2025), mas a norma não foi lida na fonte primária nesta\n   varredura. → Não entrou como indicador. **Vale a checagem na próxima varredura:** boa parte da carteira de\n   alto padrão da Adão fica dentro desse teto, e seria um argumento forte.\n\n---\n\n## 5. Validade deste boletim\n\n| Fato | Vence em | O que acontece |\n|---|---|---|\n| Selic 13,75% | **2026-12-09** | Reunião do Copom. Qualquer peça que cite a Selic precisa ser revista nesse dia. |\n| IPCA / INPC de outubro | **2026-12-11** | Divulgação do IPCA de novembro pelo IBGE. |\n| Preço médio FipeZAP Goiânia | **2026-12-20** | Informe de novembro do FipeZAP. |\n| INCC-M de outubro | **2026-12-23** | INCC-M de novembro pela FGV. |\n| Dados Ademi-GO / Brain (1S2026) | **2027-03-31** | Levantamento do 2º semestre de 2026. |\n| Condições publicadas da Caixa | **2027-02-28** | Revisão da página oficial. |\n\n**Próxima varredura:** terça-feira, 18 de novembro de 2026, 05h00.\n"}, {"arquivo": "ESTADO_SESSAO_B.md", "modulo": "03_revenda", "titulo": "Estado da Sessão B — Acervo, pauta e peças de revenda", "texto": "# Estado da Sessão B — Acervo, pauta e peças de revenda\nGravado em 2026-11-18, antes de um `/clear`. Escrito para alguém **sem nenhum contexto** retomar exatamente daqui.\n\n---\n\n## 0. Como retomar — leia nesta ordem\n\n1. `CONTINUIDADE.md` na raiz — o que é o projeto, a arquitetura das quatro sessões\n2. `cerebro/04_historico_e_regras_ceo.md` — as regras R01 a R15\n3. `cerebro/00_direcao_visual.md` e `cerebro/00_design_system.json` — a régua visual\n4. **Este arquivo**\n5. `entregas_reais/03_revenda/opus_gyro/00_analise_de_acervo.md` — o raciocínio longo da escolha do primeiro imóvel\n6. `cerebro/03_banco_de_pautas.json` — o calendário com o `por_que_este_post` de cada peça\n7. `dados/imoveis_diretoria.md` — as descrições dos três imóveis novos, fonte de verdade deles\n\nAntes de produzir qualquer coisa: **nada é executado sem plano aprovado** (R11). Escreva o plano, pare, mande, espere o OK. Proibido antes do OK: renderizar PNG, montar vídeo, baixar acervo em massa.\n\n---\n\n## 1. Quem eu sou\n\n**Sessão B — Divisão de Produção.** Dentro do organograma da Agência Adão Action: Analista de Acervo, Estrategista de Pauta, Diretor de Arte, Designer, Editor de Vídeo e Redator. A Qualidade (Revisor, Diretor de Qualidade) e a Direção (Orquestrador, CEO) são de outra sessão, de propósito — quem produz não se fiscaliza.\n\n### Minhas pastas, e só elas\n- `entregas_reais/03_revenda/` — as peças\n- `acervo_drive/` — as fotos baixadas\n- `cerebro/03_banco_de_pautas.json` — o calendário da semana\n\n### O que nunca editar\n- `ferramentas/` — é da coordenação. **Se houver bug lá, reporte, não conserte.** Achei dois e reportei; ela corrigiu.\n- `cerebro/00_*`, `cerebro/04_*`, `dados/`, `painel_diretoria/`, a raiz — coordenação\n- `cerebro/01_*`, `cerebro/02_*`, `entregas_reais/01_*`, `entregas_reais/02_*` — Sessão A\n- `entregas_reais/04_lancamento/` — Sessão C\n\nTrês sessões escrevem ao mesmo tempo. Sair da sua pasta sobrescreve o trabalho de outra.\n\n---\n\n## 2. O que entreguei\n\n### 2.1 Quatro carrosséis · 30 PNGs 1080x1350\n\nFormato R12: **só a capa tem arte**. Os demais slides são fotos limpas, recortadas em 1080x1350 e nada por cima — sem título, sem fio, sem barra.\n\nComando para refazer qualquer um:\n```bash\nnode ferramentas/render_carrossel.mjs entregas_reais/03_revenda/<imovel>/carrossel_spec.json entregas_reais/03_revenda/<imovel>\n```\n\n#### Opus Gyro · AT38302 · R$ 650.000 · 49 m² · 1 suíte · 1 vaga · condomínio R$ 424\nPasta `opus_gyro/`. Fotos do Drive A, `Ap. Opus Gyro Rooftop - Meire Ribeiro`.\n\n| Slide | Arquivo | Por que entrou |\n|---|---|---|\n| 01 capa | `20b_raia_reenquadrada_IMG_8290` | A raia do rooftop com o skyline do Bueno é a imagem mais chamativa do acervo. Reenquadrada — ver 5.6 |\n| 02 | `10_living_cozinha_unidade_IMG_8254` | Living com sofá e cozinha ao fundo: a melhor foto do interior |\n| 03 | `h03_cozinha_varanda_IMG_8241` | Cozinha limpa com a varanda ao fundo |\n| 04 | `h05_quarto_varanda_IMG_8245` | Suíte com cabeceira iluminada e saída para a varanda |\n| 05 | `h06_banheiro_suite_IMG_8247` | Banheiro da suíte |\n| 06 | `17_varanda_skyline_unidade_IMG_8282` | Varanda com a cidade — liga a unidade ao endereço |\n| 07 | `22_rooftop_pergolado_churrasqueira_IMG_8294` | Pergolado e churrasqueira |\n| 08 | `29_academia_vista_IMG_8309` | Academia com janelão: único bloco de cor saturada do conjunto |\n\nAs fotos de interior são da **unidade decorada**, rotulada como tal na legenda. Ver 4.3.\n\n#### Portal do Sol Green · AT42341 · R$ 1.800.000 · 4 suítes · 4 vagas\nPasta `portal_sol_green/`. Seis fotos, e é decisão — ver 4.4.\n\n| Slide | Arquivo | Por que entrou |\n|---|---|---|\n| 01 capa | `IMG_7698b_placa_borrada` | Fachada: identifica o sobrado, céu azul, limpa. Placa borrada — ver 5.5 |\n| 02 | `IMG_7574` | Gourmet com pé-direito duplo, parede de pedra, janelão para a piscina |\n| 03 | `IMG_7565` | Living amplo |\n| 04 | `IMG_7628` | Cozinha com ilha de mármore e janelão — tecnicamente a melhor foto do acervo |\n| 05 | `IMG_7575` | Gourmet aberto para a piscina |\n| 06 | `IMG_7668` | Única suíte com a cama arrumada |\n\n#### Ravenallas · AX43709 · R$ 1.890.000 · 191 m² · 3 suítes · elevador privativo\nPasta `ravenallas/`.\n\n| Slide | Arquivo | Por que entrou |\n|---|---|---|\n| 01 capa | `IMG_8835` | Living com sofá e cortinão, piso espelhado. Vende os 191 m² |\n| 02 | `IMG_8838` | Living de outro ângulo |\n| 03 | `IMG_8853` | Jantar com porta pivotante preta e vista livre |\n| 04 | `IMG_8818` | Cozinha preta |\n| 05 | `IMG_8849` | Escritório com estante preta de parede inteira — dá personalidade |\n| 06 | `IMG_8874` | Suíte com cabeceira de couro |\n| 07 | `IMG_8868` | Banheiro com bancada ripada |\n| 08 | `IMG_8825` | **Elevador privativo**, moldura de mármore verde. O diferencial aparece, não é só afirmado |\n\nDescartadas: lobby com árvore de Natal e Papai Noel (data a peça), garagem, depósito com caixas, banheiro com rodo e plástico de obra.\n\n#### Aldeia do Vale · AP42861 · R$ 10.500.000 · 645,44 m² em 2.167,60 m² · 4 suítes · 6 vagas\nPasta `aldeia_do_vale/`.\n\n| Slide | Arquivo | Por que entrou |\n|---|---|---|\n| 01 capa | `IMG_6915` | Piscina ao entardecer com a casa acesa. A melhor foto do acervo inteiro |\n| 02 | `IMG_6793` | Fachada com brise de madeira e jardineira, luz de fim de tarde |\n| 03 | `IMG_6899` | Social sob forro de madeira corrida, janelão para o vale |\n| 04 | `IMG_6902` | Cozinha com ilha |\n| 05 | `IMG_6868` | Corredor de brises de madeira — a melhor foto de arquitetura do acervo |\n| 06 | `IMG_6874` | Suíte com ripado e porta de correr |\n| 07 | `IMG_6879` | Banheiro com bancada de pedra |\n| 08 | `IMG_6932` | Fachada noturna em pedra, luz quente |\n\nRégua R10 aplicada: o gancho é arquitetura e disposição. Fotovoltaica, poço artesiano, reuso de água, automação, VRF e nomes de fornecedor **não viram título** e ficam numa linha de ficha.\n\n### 2.2 Reel do Opus Gyro · 26,0 s · 1080x1920 · sem trilha\n`opus_gyro/reel_at38302.mp4`. Quatro planos de interior, quatro de rooftop, frame final preto. Ken Burns sobre fotos verticais de 8000 px — **não usa vídeo**, ver 5.7.\n\n**Não está no calendário do feed.** Vai para o kit dos corretores. Ver 4.5.\n\n### 2.3 Calendário · `cerebro/03_banco_de_pautas.json`\nDez peças, 23 a 28/11/2026, **60/40 exato**. Cada uma com `por_que_este_post` — é esse campo que vira o parecer no painel.\n\n| Dia | Marca (40) | Busca de cliente (60) |\n|---|---|---|\n| SEG 23 | 08h a escada da semana | 19h Opus Gyro · R$ 650 mil |\n| TER 24 | 12h Guttyane | 19h Portal do Sol · R$ 1,8 mi |\n| QUA 25 | 12h Morar no Aldeia do Vale | 19h Ravenallas · R$ 1,89 mi |\n| QUI 26 | — | 19h Aldeia do Vale · R$ 10,5 mi |\n| SEX 27 | — | 12h Óra Office Park · 19h Óra STAY |\n| SÁB 28 | 10h Setor Bueno, os dois extremos | — |\n\nQuinta tem peça única de propósito: R$ 10,5 milhões não divide atenção. As duas de sexta são da **Sessão C** — reservei o espaço, não produzi.\n\n### 2.4 Documentos\n- `opus_gyro/00_analise_de_acervo.md` — escolha do imóvel, classificação das 29 fotos, hipótese refutada\n- `opus_gyro/01_redacao.md` — 3 legendas, 3 stories de 60 s, shot list\n- `opus_gyro/reel_at38302_roteiro.md` e `opus_gyro/reel_spec.json` — decupagem plano a plano\n- `portal_sol_green/shot_list_recaptacao.md` — **entregável comercial**, ver 4.4\n- `brief_aldeia_do_vale.md` — brief da coordenação com a R10\n\n### 2.5 Acervo em disco · 2,9 GB\n`acervo_drive/`: `opus_gyro_at38302/` 251 MB · `aldeia_do_vale/` 691 MB · `portal_sol_green/` 1,0 GB · `ravenallas/` 1,0 GB. Horizontais e verticais em resolução original, sem marca d'água. **Não baixe de novo.**\n\n---\n\n## 3. Como trabalhei — o que vai te poupar horas\n\n### 3.1 Baixar do Drive\n**`gdown` estoura cota** depois de ~50 arquivos e passa a devolver `Cannot retrieve the public link`. Perdi tempo tentando contornar com esperas.\n\nDois endpoints funcionam, ambos testados por mim:\n- `https://lh3.googleusercontent.com/d/<FILE_ID>=s0` — serve o original em resolução cheia. Foi o que me destravou.\n- `https://drive.usercontent.google.com/download?id=<FILE_ID>&export=download` — o que trouxe o `.mov`.\n\nPara listar os ids de uma pasta sem baixar: `gdown.download_folder(url=..., skip_download=True)` devolve `(id, path)` de tudo, ou `https://drive.google.com/embeddedfolderview?id=<FOLDER_ID>#list`.\n\n**Não existe `ferramentas/drive_get.py`.** Usei scripts ad-hoc no diretório de rascunho. Se alguém escrever um utilitário permanente, ele é da coordenação, não meu.\n\nAmbiente: `python3 -m venv .venv` na raiz, com `gdown` instalado nele. **Nunca no Python do sistema.**\n\n### 3.2 Vídeo\n- **O ffmpeg desta máquina não tem o filtro `drawtext`.** Tentar texto em vídeo pelo caminho óbvio falha com `No such filter: 'drawtext'`. Por isso escrevi `reel_overlays.mjs`: renderiza os textos como PNG com alpha no Chromium, com as mesmas fontes locais do carrossel, e o `montar_reel.sh` faz overlay.\n- **Todo `ffmpeg` dentro de laço de shell precisa de `-nostdin`.** Sem isso ele come o stdin do `while read` e o laço quebra a partir do segundo item — gastei uma rodada nisso.\n- Ken Burns por `zoompan`, com pré-escala para 2160x3840 antes.\n\n### 3.3 Renderizador\n**Eu não forkei o `render_carrossel.mjs`.** Ele é da coordenação e foi ela quem o reescreveu duas vezes: da v1 (slides com arte) para a v2 (herói gigante) e depois para a R12/R14 (capa simétrica + fotos limpas). Eu só escrevo o `carrossel_spec.json`. Os scripts que são meus são os dois de reel, e ficam na minha pasta por serem da peça.\n\n### 3.4 Duas armadilhas de estrutura de pasta\nEstas derrubam o painel em silêncio — ele não dá erro, só mostra coisa errada.\n\n1. **Os PNGs têm que ficar em `03_revenda/<imovel>/slide-NN.png`.** O `gerar_painel.py` só desce um nível. Se ficarem em `<imovel>/carrossel/`, o painel acha zero peças.\n2. **Nenhum `*spec*.json` solto em `03_revenda/`.** O script varre a pasta-mãe e carimba título e código do primeiro spec que achar em **todas** as peças do módulo. Foi assim que os quatro imóveis apareceram com o nome do Opus Gyro.\n\n### 3.5 Conferência de foto\nAs horizontais são 16:9 e o carrossel é 4:5. O recorte central come 56% da largura. **Conferir no recorte final, nunca no thumbnail** — ver erro 5.4.\n\n### 3.6 Conferir número no XML\n**Isole o elemento `<Listing>` e varra os filhos dele.** Busca por janela de caracteres em volta do código vaza para o imóvel vizinho: minha primeira tentativa devolveu os dados do Le Parc achando que eram do Opus Gyro.\n\n---\n\n## 4. Decisões, e por quê\n\n### 4.1 Por que o Opus Gyro abriu a semana, apesar de não ser o imóvel mais bonito\nA regra inicial era \"foto do Drive, número do XML\", porque as fotos do XML têm marca d'água \"ADÃO\" no centro. Para isso funcionar, o imóvel precisa existir nas duas fontes.\n\n**Descobri que o Drive A e o XML do CRM são acervos quase disjuntos.** Cruzei as 28 pastas do Drive contra os 26 imóveis do XML **abrindo as imagens**, não comparando nomes — os títulos do XML quase nunca nomeiam o prédio. O Drive é o arquivo fotográfico dos corretores; o XML é o feed do CRM. **Opus Gyro foi a única sobreposição confirmada.**\n\nA casa do Aldeia do Vale era de longe a mais bonita do Drive, mas não estava no XML. Sem número rastreável, parei e não usei. Essa restrição caiu depois, quando o diretor passou as descrições dos outros três por escrito (R06), mas foi ela que definiu a primeira peça.\n\n### 4.2 Refutei a hipótese do inventário sobre o Aldeia do Vale\n`dados/inventario_drives.md` registrava a pasta `Casa Aldeia do vale - Amanda Rezende` como provável origem sem marca d'água do **AT38274**. Conferi abrindo as imagens: **são casas diferentes.** O Drive tem pedra bruta, ripado de madeira, piscina e terreno em declive; o AT38274 é uma caixa preta de concreto em terreno plano, sem piscina. Também conferi os outros dois Aldeia do Vale do XML: AT37954 só tem render 3D, AT37760 é sobrado mobiliado antigo.\n\nA casa do Drive é o **AP42861**, e entrou pela descrição da diretoria.\n\n### 4.3 Interior sempre presente, rotulado quando for decorado\nEu tinha travado o uso de foto de interior do Opus Gyro: não dá para provar que a unidade decorada do Drive é a anunciada no XML, porque a torre tem dezenas de unidades iguais e no XML ela está crua, sem acabamento.\n\n**O diretor reprovou, e com razão:** em revenda quem compra compra o apartamento, e esconder o interior esconde o que decide a visita. A saída não é esconder, é **rotular** — \"unidade decorada · mesma tipologia\". Afirmar que é o apartamento à venda seria mentira; mostrar o decorado da mesma planta, rotulado, é prática corrente. Virou a R08.\n\n### 4.4 Portal do Sol Green com seis fotos\nDas 42 horizontais, **seis** estão em padrão de anúncio. As outras mostram casa habitada e despreparada: piscina com lona azul por cima, três closets lotados de roupa e caixas, escritório com papelada, área de serviço com máquina e ração, corredor lateral com grama seca e mangueira, quarto infantil com objetos pessoais, quartos com colchão sem roupa de cama.\n\nPublicar as outras baixaria o nível da semana inteira. Por isso a **shot list de recaptação** existe: diz à diretoria qual imóvel precisa de fotógrafo novo, exatamente o quê, e inclui o checklist de preparação da casa na véspera — que é o que decide o resultado. Leva o imóvel de 6 para cerca de 19 fotos publicáveis. É prova de valor da agência, não desculpa.\n\n### 4.5 Por que a escada de preço virou o eixo da semana\nQuatro imóveis, quatro faixas: R$ 650 mil, R$ 1,8 mi, R$ 1,89 mi, R$ 10,5 mi. Pus em ordem crescente de segunda a quinta, e sexta reinicia no lançamento pelo tíquete de entrada.\n\nResolve dois problemas de uma vez. Primeiro, a crítica do diretor de que a carteira parecia ter um imóvel só — a escada mostra carteira de verdade. Segundo, **nenhum post repete perfil de comprador**: quem acompanha a semana inteira vê do studio à mansão sem sentir repetição. Abrir por baixo é de propósito; se a semana começasse pelos R$ 10,5 milhões, os três degraus seguintes seriam anticlímax.\n\n### 4.6 Por que o reel saiu do feed e foi para o kit\nQuando o Óra Office Park foi corrigido de marca para busca de cliente (o lado da regra é decidido pela **intenção**, não pelo público), a conta foi para 7/3 e uma peça de venda tinha que sair.\n\nTirei o reel, e não um carrossel, porque **remover o reel custa uma peça; remover um imóvel custa o eixo** — a escada deixa de ser escada. O reel era a única duplicata de ativo da semana.\n\nMas ele não foi descartado: foi desenhado desde o roteiro para o corretor postar no perfil pessoal dele, com áudio de trend aplicado no app — por isso sai sem trilha. Ele **nasceu kit, não feed**. Está pronto esperando o módulo do kit dos corretores.\n\n---\n\n## 5. Erros, e como cada um foi pego\n\nEsta seção é o conteúdo do vídeo do diretor. Não resuma.\n\n### 5.1 Copiei condomínio e IPTU de outro imóvel, e construí uma trava em cima do meu erro\n**O que fiz:** registrei nos entregáveis condomínio **R$ 1** e IPTU **R$ 187** para o AT38302, e criei uma trava de compliance dizendo que o condomínio era \"dado quebrado, não publicar\". A trava entrou na análise de acervo, no banco de pautas, no spec do carrossel e na redação.\n\n**Como foi pego:** não fui eu. A sessão coordenadora foi ao XML bruto, conferiu tag por tag e mandou os valores certos — `PropertyAdministrationFee` = 424, `YearlyTax` = 1000. Ela pediu dupla checagem.\n\n**O que achei ao conferir:** minha primeira tentativa de verificação foi por janela de caracteres em volta do código `AT38302` e **vazou para o imóvel vizinho**, devolvendo `ListPrice 1730000` e `LivingArea 143`, que são do Le Parc. Isolei o elemento `<Listing>` e aí bateu. Depois auditei os **26 imóveis** contra o XML bruto em 7 campos: **zero divergências**. O parser está correto.\n\n**A causa real:** os R$ 1 e R$ 187 são do **AT43159**, o primeiro registro do `imoveis.json`, que foi o que li no começo da sessão. Copiei os valores dele sem conferir.\n\n**Por que este é o pior erro da sessão:** eu não só errei o número — construí uma regra de compliance em cima do erro, e a regra fez o erro parecer cuidado. **O erro se disfarçou de rigor.** Um número errado qualquer revisor pega; uma trava de compliance ninguém questiona, porque parece zelo.\n\n**O que mudou:** o condomínio de R$ 424 passou de trava a **argumento central** — piscina de raia, academia, sauna e pergolado por R$ 424 é a prova da tese da peça. E ficou a lição de método em 3.6.\n\n### 5.2 Escrevi três afirmações sem fonte\n**O que fiz:** \"é o tipo de metragem que não encalha: aluga rápido, revende rápido\" · \"Vaca Brava é o endereço mais pesquisado do Bueno\" · \"nessa faixa, com esse lazer, não tem fila de opção\".\n\n**Como foram pegas:** as três por mim, em momentos diferentes. A primeira quando o radar de mercado da Sessão A ficou pronto e fui cruzar o ângulo — o radar mostrou que o m² do Bueno subiu só 2,6% em 12 meses, a **menor alta entre os bairros consagrados**, o que derrubou meu ângulo de valorização inteiro. A segunda caçando no próprio banco de pautas depois disso. A terceira relendo o roteiro do Story 2.\n\n**O que aprendi:** o perigo não é o número inventado, é a **frase de vendedor que soa óbvia**. \"Aluga rápido\" não parece afirmação factual, mas é. Troquei todas por fato com fonte (os 31,8% da Ademi-GO) ou removi.\n\n### 5.3 Prometi no CTA o que não tenho\n**O que fiz:** o frame final oferecia \"a planta, o vídeo do rooftop e a simulação de financiamento\".\n\n**Como foi pego:** por mim, conferindo o PNG renderizado. Ao ler a frase na tela me perguntei se eu conseguiria entregar os três. Não: o Drive A não tem planta nem PDF, o vídeo não servia (5.7), e o radar é explícito que a taxa efetiva da Caixa não é publicada.\n\n**Por que importa:** promessa no Direct que não se cumpre queima o corretor na primeira resposta, e o corretor é quem leva a culpa, não a agência. Reescrito para o que existe.\n\n### 5.4 Classifiquei uma foto errado e só descobri no PNG\n**O que fiz:** anotei a `IMG_6887` do Aldeia do Vale como \"banheiro com bancada de pedra\" e pus no slide 07.\n\n**Como foi pego:** abrindo o PNG renderizado na conferência final. É corredor de armários brancos — e era o slide mais fraco do conjunto. O banheiro é a `IMG_6879`.\n\n**O que aprendi:** classifiquei por contact sheet reduzido. **O recorte 4:5 corta 56% da largura de uma foto 16:9**, então o enquadramento final é outro. Confira no recorte final. Aproveitei a correção para incluir a `IMG_6868`, o corredor de brises, que é a melhor foto de arquitetura do acervo e estava de fora.\n\n### 5.5 Placa de carro legível na peça\n**O que fiz:** escolhi a fachada do Portal do Sol para capa.\n\n**Como foi pego:** conferindo o PNG, achei a placa pequena e ampliei a região da foto original para ter certeza. Lia-se **inteira, caractere por caractere**.\n\n**O que fiz a respeito:** mapeei a coordenada da placa da tela de volta para a foto original pela escala do recorte, apliquei `boxblur` só nessa caixa, e conferi ampliado de novo — ilegível, e o borrão não chama atenção. Original preservado ao lado, sem o sufixo. **Virou a R15:** nenhum identificador de terceiro legível em peça publicada — placa, rosto, documento, número de casa.\n\n**Por que importa:** ninguém tinha pensado nisso. Não era regra, não estava em checklist nenhum. Apareceu porque conferi o arquivo em vez de confiar no render.\n\n### 5.6 Lona de manutenção no meio da capa\n**Como foi pego:** conferindo o PNG da capa do Opus Gyro. Havia um equipamento coberto com lona azul plástica bem no centro da cena — elemento de obra que destoa em peça de alto padrão.\n\n**O que fiz:** reenquadrei a foto original, pegando 52% da direita, o que mantém a raia inteira e o skyline e tira a lona. Só o enquadramento mudou. Original preservado como `20_rooftop_raia_lateral_IMG_8290.jpg`.\n\n### 5.7 Rejeitei o `Vídeo.mov` contra a recomendação da coordenação\n**O que me disseram:** a sessão coordenadora baixou o `Vídeo.mov` do Opus Gyro e disse que ele \"resolve o reel inteiro\" — 1080x1920 nativo, 23,3 s, 30 fps.\n\n**Como foi pego:** os metadados estavam certos, mas ela não tinha aberto o conteúdo. Extraí os 23 frames e olhei. **É um tour da unidade decorada — living, cozinha, banheiro, jantar, quarto, varanda. Zero rooftop.** E fecha com cartela branca de logo \"ADÃO 40 ANOS\" ocupando a tela inteira. Medi o áudio: `max_volume 0.0 dB`, com clipping.\n\n**Por que rejeitei:** logo grande em tela cheia é violação direta do design system. E a peça estava construída em torno do rooftop. Montei o reel com as verticais de 8000 px em Ken Burns, que era o plano B já previsto no roteiro.\n\n**A coordenação concordou depois.** Vale como lição de método: **metadado não é conteúdo.** Resolução, duração e codec certos não dizem o que está no quadro.\n\n### 5.8 Dois bugs que achei no `gerar_painel.py` e não consertei\n**Primeiro:** o comentário dizia \"uma peça por imóvel\", mas o agrupamento era por **módulo**. Com quatro imóveis dentro de `03_revenda`, todos os vídeos caíam no primeiro cartão em ordem alfabética — o cartão do **Aldeia do Vale exibia o reel do Opus Gyro**, duplicado. Com um imóvel por módulo o bug não aparecia.\n\n**Como foi pego:** rodei o painel e li o `dados.json` gerado, em vez de confiar na linha de resumo do console. A linha dizia \"5 peças\" e estava certa; o erro estava dentro.\n\n**Segundo:** o casamento com o banco de pautas usa regex `\"ra Vaca Brava\"` e **para no primeiro resultado**. Com duas peças do Óra na semana, o cartão da Sessão C pega sempre a primeira da lista e pode exibir o `por_que` errado.\n\n**O que fiz:** reportei os dois com diagnóstico e sugestão. **Não mexi em `ferramentas/`** — é da coordenação. Ela corrigiu o primeiro.\n\n---\n\n## 6. Pendências\n\n### Minhas\nNenhuma bloqueada. As quatro peças estão renderizadas e conferidas, o calendário escrito, o painel enxergando tudo.\n\n### Aguardando a diretoria\n1. **Autorização de imagem da Guttyane, por escrito.** Sem ela a peça S47-03 não sai e o slot fica vazio — dos cinco depoimentos da Adão no Drive B (Ana Laura, Érika, França, Grazi, Guttyane), só o dela está liberado, então não há substituto.\n2. **Confirmar se o Aldeia do Vale foi entregue.** A descrição traz \"Entrega garantida: 30/09/2026\", data já passada. Nenhuma menção a prazo entra na peça até a confirmação.\n3. **Liberar a recaptação do Portal do Sol Green.** Shot list pronta em `portal_sol_green/shot_list_recaptacao.md`. Uma captação de meio período leva o imóvel de 6 para cerca de 19 fotos publicáveis. Precisa combinar com a corretora Ludmila Dias a preparação da casa na véspera — sem isso o fotógrafo volta com o mesmo acervo.\n\n### Aguardando outra sessão\n4. **S47-08 e S47-09**, as duas peças do Óra Vaca Brava, são da **Sessão C**. Reservei os espaços no calendário e não produzi.\n\n### Não começado, e não deve começar sem pedido\n5. **Módulo 5** — Revisor, Diretor de Qualidade, Agente CEO e **kit dos corretores**. O reel do Opus Gyro já está pronto esperando o kit.\n"}, {"arquivo": "brief_aldeia_do_vale.md", "modulo": "03_revenda", "titulo": "Brief — AP42861 · Casa Moderna Semi Térrea no Aldeia do Vale", "texto": "# Brief — AP42861 · Casa Moderna Semi Térrea no Aldeia do Vale\nR$ 10.500.000 · 645,44 m² construídos · 2.167,60 m² de terreno · 4 suítes · 6 vagas cobertas\nAcervo: `Casa Aldeia do vale - Amanda Rezende` (72 fotos + vídeo) · corretora Amanda Rezende\n\n## A regra que manda nesta peça (R10)\n> \"É luxo. Foque nos cômodos, na disposição e área do imóvel em si. Esquece coisa não comum e diferencial. **O negócio é o simples bem feito.**\" — diretoria, 18/11/2026\n\n**O gancho é a arquitetura e a disposição da casa**, não achado raro. A peça mostra ambiente por ambiente, como a casa se organiza, e a metragem.\n\n## Vai para o rodapé, nunca para a capa\nUsina fotovoltaica · poço artesiano · reaproveitamento de água de chuva · automação Smartek · VRF SuperAr · elevador ATI · Dekton Cosentino · OG Ambientes · CRJ Esquadrias · SpeedElectrick.\nSão prova de padrão construtivo e cabem numa linha de specs ou no último slide. **Nenhum deles vira título.**\n\n## O que é arquitetura e disposição — é daqui que sai a peça\n- **Projeto em L**, integrando área social, lazer e ala íntima. A planta é o argumento.\n- **Todos os quartos são nascentes e voltados para a piscina.** Decisão de projeto, orientação solar e privacidade numa frase só. É o melhor conteúdo da descrição inteira.\n- **645,44 m² construídos em 2.167,60 m² de terreno.** Proporção generosa, casa semi térrea.\n- **Social:** cozinha integrada, sala de jantar, churrasqueira a carvão.\n- **Íntima:** 4 suítes.\n- **Subsolo:** adega, escritório, área técnica, elevador para 8 pessoas, garagem coberta para 6 carros.\n- **Lazer:** piscina com borda infinita, com hidromassagem e aquecimento.\n- **Entregue completa em armários.**\n\n## Sequência proposta (a contagem é do agente; isto é ponto de partida)\n| # | Herói | Conteúdo | Foto |\n|---|---|---|---|\n| 1 | `R$ 10,5 MI` | capa, número herói, cruzada \"no Aldeia do Vale\" | fachada ou a melhor de arquitetura |\n| 2 | `645 M²` | em 2.167 m² de terreno · semi térrea | implantação / vista ampla |\n| 3 | `PROJETO EM L` | social, lazer e ala íntima integrados | ângulo que mostre a forma |\n| 4 | `NASCENTES` | todos os quartos voltados para a piscina | quarto com a piscina ao fundo |\n| 5 | `A COZINHA` | integrada à sala de jantar | cozinha |\n| 6 | `A SUÍTE` | uma das 4 suítes | suíte |\n| 7 | `BORDA INFINITA` | hidromassagem e aquecimento | piscina |\n| 8 | `O SUBSOLO` | adega, escritório, elevador, 6 vagas cobertas | subsolo ou adega |\n| 9 | CTA | ficha completa · rodapé com padrão construtivo | — |\n\n## Pendência\nA descrição traz \"Entrega garantida: 30/09/2026\", data já passada. **Não publicar sem confirmação da diretoria.**\n"}, {"arquivo": "00_analise_de_acervo.md", "modulo": "03_revenda", "titulo": "Analista de Acervo — carteira de revenda", "texto": "# Analista de Acervo — carteira de revenda\nRodado em 2026-11-17 · Drive A (`1FSuT6u8Q_awpxHkaR-neBc_MpFRILZ0F`) × `dados/imoveis.json` (26 imóveis do XML)\n\n---\n\n## Imóvel escolhido\n\n**AT38302 — OPUS GYRO VACA BRAVA DESIGN · Setor Bueno, Goiânia**\n\n| Dado | Valor | Origem |\n|---|---|---|\n| Preço | R$ 650.000 | XML `7040_imoveis.xml`, código AT38302 |\n| Área útil | 49 m² | XML |\n| Quartos | 1 | XML |\n| Suítes | 1 | XML |\n| Vagas | 1 | XML |\n| IPTU | R$ 1.000 no ano | XML, `YearlyTax` |\n| Condomínio | R$ 424 | XML, `PropertyAdministrationFee` |\n| Transação | Venda | XML |\n| CRECI | CRECI-GO J-40518 | design system |\n\n**Fotos:** `acervo_drive/opus_gyro_at38302/` — Drive A, pasta `Apartamentos/Ap. Opus Gyro Rooftop - Meire Ribeiro`. Sem marca d'água.\n\n---\n\n## Por que este imóvel\n\n1. **É o único imóvel da carteira em que foto e número apontam para o mesmo ativo real.** Fiz o cruzamento visual das 28 pastas do Drive A contra os 26 imóveis do XML. O Drive é o arquivo fotográfico dos corretores; o XML é o feed do CRM. Os dois acervos são quase disjuntos. Opus Gyro é a única sobreposição confirmada — prédio idêntico nas duas fontes (mesma linha de céu de Goiânia pela varanda, mesma esquadria preta com guarda-corpo de vidro, mesma bancada de granito preto, mesmas portas de madeira).\n\n2. **É a faixa de preço de maior alcance orgânico da carteira.** A carteira do XML vai de R$ 269 mil a R$ 10,5 milhões. Um apartamento de R$ 650 mil no Setor Bueno fala com o público mais largo do Instagram em Goiânia — primeiro investidor, quem sai do aluguel, quem compra para renda. Uma peça de R$ 7,9 milhões no Aldeia do Vale tem foto melhor e audiência mínima; salva alcance, não gera lead.\n\n3. **O gancho visual já existe e é forte.** A piscina de raia no rooftop com a linha de céu do Setor Bueno ao fundo é uma imagem que para o dedo em 3 segundos sem precisar de arte por cima. É o ativo mais aproveitável de todo o Drive A em termos de gancho.\n\n4. **Tíquete de entrada com lazer de alto padrão é a tese comercial do post.** R$ 650 mil comprando rooftop com piscina, academia envidraçada com vista, sauna, pergolado e salão — esse descompasso entre preço e entrega é o argumento inteiro da peça.\n\n### Por que NÃO a Casa Aldeia do Vale\nÉ a pasta visualmente mais forte do Drive A, de longe — arquitetura nova, pedra e madeira, piscina, pôr do sol sobre o vale. **Mas ela não está no XML.** Ver \"Hipótese refutada\" abaixo. Sem XML, não há preço nem metragem com origem rastreável, e a regra 5 manda parar. Fica registrada como pendência comercial: pedir à diretoria o código CRM desse imóvel.\n\n---\n\n## Hipótese do inventário: REFUTADA\n\n`dados/inventario_drives.md` sugeria que `Casa Aldeia do vale - Amanda Rezende` fosse a origem sem marca d'água do **AT38274**. Conferi abrindo as imagens das duas fontes. **São casas diferentes.**\n\n| | Drive — Casa Aldeia do Vale | XML — AT38274 |\n|---|---|---|\n| Revestimento | Pedra bruta clara + ripado de madeira | Caixa preta + concreto aparente |\n| Forro | Madeira corrida no living e na varanda | Laje branca lisa |\n| Piso | Porcelanato off-white acetinado | Porcelanato cinza claro |\n| Cozinha | Ilha clara, marcenaria amadeirada | Bancadas pretas, marcenaria preta |\n| Implantação | Terreno em declive, piscina, vista de vale | Terreno plano, gramado, sem piscina nas fotos |\n| Brises | Painéis de madeira articulados na fachada | Não existem |\n\nTambém conferi os outros dois Aldeia do Vale do XML:\n- **AT37954** (R$ 10,5 mi) — as fotos do XML são **render 3D**, não foto. Imóvel na planta ou em obra.\n- **AT37760** (sobrado, R$ 3,5 mi) — casa mobiliada, piso de madeira, lustres, linguagem bem mais antiga. Não é a casa do Drive.\n\n**Conclusão:** a casa do Drive não está na carteira do XML. Atualizar `dados/inventario_drives.md`.\n\n---\n\n## Classificação das fotos — Opus Gyro (29 horizontais)\n\nClassificado abrindo cada imagem, não pelo nome do arquivo (os nomes são de câmera: `IMG_82xx.jpg`).\n\n### Áreas comuns do edifício — 12 fotos · **rastreáveis como o prédio do AT38302**\n| # | Arquivo | Ambiente |\n|---|---|---|\n| 01 | IMG_8236 | Hall social / lobby — forro de madeira, estar, elevadores |\n| 18 | IMG_8285 | **Rooftop · piscina com espreguiçadeiras, palmeiras e skyline** |\n| 19 | IMG_8287 | Rooftop · salão envidraçado com vista 180° |\n| 20 | IMG_8289 | Rooftop · raia da piscina com skyline |\n| 21 | IMG_8291 | **Rooftop · panorâmica piscina + deck + cidade** |\n| 22 | IMG_8294 | **Rooftop · pergolado, mesa de madeira e churrasqueira** |\n| 23 | IMG_8297 | **Rooftop · lounge, deck de madeira, sofás e skyline** |\n| 24 | IMG_8299 | Rooftop · deck com palmeira e estar |\n| 25 | IMG_8301 | **Rooftop · piscina com palmeira ao centro** |\n| 26 | IMG_8303 | Salão de festas interno |\n| 27 | IMG_8305 | **Rooftop · raia longa, palmeiras, linha de céu** |\n| 28 | IMG_8307 | Sauna envidraçada com vista |\n| 29 | IMG_8309 | Academia (laranja/amarelo) com janelão para a cidade |\n\n### Unidade decorada — 16 fotos · **NÃO usar como se fosse o AT38302**\nLiving+cozinha integrados (10, 13, 16), quarto com varanda (05, 07, 09), cozinha com bancada preta (03, 14, 15), hall e jantar de 4 lugares (11, 12), banheiros (02, 06), closet (08), varanda com skyline (17).\n\n**Motivo da trava:** as fotos do XML do AT38302 mostram a unidade **crua** — parede branca, pia pendurada, sem acabamento. As fotos do Drive mostram uma unidade **mobiliada e decorada**. Mesmo edifício e mesma tipologia compacta (1 dormitório com varanda, confirmado visualmente), mas não há como provar que é a mesma unidade. Tratar como referência interna de tipologia, nunca como \"este apartamento\".\n\n### Seleção para o carrossel — 5 fotos\n| Slide | Arquivo | Por quê |\n|---|---|---|\n| 01 capa | `21_rooftop_piscina_panoramica_IMG_8291` | Panorâmica piscina + cidade. Gancho de 3s, horizonte baixo, céu limpo para o título |\n| 02 | `27_rooftop_raia_skyline_IMG_8305` | Raia longa dá profundidade e leitura de \"lazer de prédio grande\" |\n| 03 | `22_rooftop_pergolado_churrasqueira_IMG_8294` | Pergolado e churrasqueira — traduz \"dá pra receber\" |\n| 04 | `29_academia_vista_IMG_8309` | Academia com janelão. Único bloco de cor saturada do set; prova de entrega |\n| 05 CTA | fundo preto (sem foto) | Frame final invariável |\n\n**Reservas:** `18_rooftop_piscina_espreguicadeiras`, `23_rooftop_lounge_deck`, `25_rooftop_piscina_palmeira`, `19_rooftop_salao_envidracado`, `01_lobby_social`.\n\n### Vídeo\n`Vídeo.mov` da mesma pasta do Drive. Trechos a decupar quando o Reel for liberado.\n\n---\n\n## Cruzamento com o cérebro — FEITO em 2026-11-17\n\nAs gavetas 1 e 2 foram preenchidas pela Sessão A depois que este módulo rodou. Revalidei, e **duas coisas mudaram**.\n\n### Gaveta 1 · a capa estava errada\nO **Formato Padrão Vencedor** manda abrir com **um número absoluto escrito sobre a imagem nos primeiros 3 segundos**, com o número vindo do XML. A evidência é medida: P01 — o reel de melhor taxa de curtida de todo o levantamento (**3,89%**) abre com `800 metros` por cima do tour e tem a legenda mais fraca do conjunto; o gancho é visual e numérico, não textual.\n\nMinha capa era a frase \"O apartamento é compacto. O prédio não é.\". **Virou `R$ 650 MIL`** em Bodoni gigante. A frase migrou para as legendas, onde funciona.\n\nEntrou também um **slide de virada que não existia**: `31,8%`, com `ADEMI-GO` impresso na tela. É o slide 6 do Formato Vencedor, validado por P05 — dado de mercado com fonte nomeada deu a melhor taxa de curtida de todas as dissecações (**4,31%**) com a *menor* view do conjunto.\n\n### Gaveta 2 · o ângulo de investidor não se sustentava\nEu tinha escrito o ângulo como oportunidade de investimento. O radar derruba isso para este bairro:\n\n| Dado | Valor | Fonte |\n|---|---|---|\n| m² Setor Bueno | R$ 9.849 · **+2,6% em 12 meses** | FipeZAP out/2026 |\n| m² Marista | R$ 11.502 · +3,4% | FipeZAP out/2026 |\n| m² Jardim América | R$ 8.812 · **+10,0%** | FipeZAP out/2026 |\n| m² Setor Oeste | R$ 8.833 · **+8,3%** | FipeZAP out/2026 |\n\nBueno é a **menor alta entre os bairros consagrados** — eles já precificaram, e o ganho marginal migrou para a borda. E a unidade sai a R$ 13.265/m² (650.000 ÷ 49), acima da média do bairro. É normal em compacto com lazer pesado, mas inviabiliza qualquer discurso de pechincha ou de valorização.\n\n**Ângulo corrigido para escassez geográfica:** Bueno e Marista concentram **31,8% de todos os imóveis à venda em Goiânia** (Ademi-GO, 1S2026). É onde o mercado da cidade acontece. O argumento passa a ser o tíquete de entrada dando acesso a esse endereço e a esse lazer — não promessa de retorno.\n\n**Proibido nesta peça:** os 105% de valorização em 5 anos (número da cidade inteira, não do Bueno) · o R$/m² da unidade · qualquer promessa de aluguel fácil ou revenda rápida.\n\n### Diagnóstico da gaveta 1 que afeta a distribuição\nO problema da Adão não é alcance médio — 4.499 views e 9,8% por seguidor, acima de todo o bloco institucional. É **amplitude**: ela quase nunca estoura, e o outlier dela (`110 UNIDADES / R$ 52 MI`, 4,73x) estourou **para dentro**, com comentários quase todos de corretores da própria casa. Por isso esta peça é desenhada para o corretor postar no perfil pessoal dele, e por isso precisa de distribuição fora da rede.\n\n---\n\n## Erro meu, corrigido em 2026-11-17\n\nEu tinha registrado **condomínio R$ 1 e IPTU R$ 187** e travado o condomínio como \"dado quebrado\". **Estava errado, e o erro era meu, não do parser.** Esses dois números são do **AT43159** (Sobrado Jardim Goiás), o primeiro registro do `imoveis.json`, que foi o que eu li no começo da sessão — carreguei os valores dele para cá sem conferir.\n\nConferi agora no XML bruto, isolando o elemento `<Listing>` do AT38302 (a primeira tentativa, por janela de caracteres, vazava para o imóvel vizinho e deu valores de outro imóvel — por isso a checagem tem que ser por elemento, não por proximidade de texto):\n\n```\nListingID = AT38302 · ListPrice = 650000 · LivingArea = 49\nPropertyAdministrationFee = 424 · YearlyTax = 1000\nBedrooms = 1 · Suites = 1 · Garage = 1 · Bathrooms = 2\n```\n\nTambém auditei os **26 imóveis** comparando `dados/imoveis.json` contra o XML bruto em 7 campos (preço, condomínio, IPTU, área, quartos, suítes, vagas): **zero divergências**. `ferramentas/parse_xml.py` está correto.\n\n**E o número corrigido reforça o ângulo em vez de atrapalhar.** Condomínio de **R$ 424** num compacto com piscina de raia, academia, sauna, pergolado e salão de festas é a prova literal da tese da peça: o tíquete de entrada dá acesso ao endereço e ao lazer. Passou de trava a argumento, e entrou no slide 03 do carrossel como o remate da lista de lazer.\n\n---\n\n## Travas de compliance desta peça\n1. **Condomínio R$ 424 e IPTU R$ 1.000 são publicáveis** — conferidos tag por tag no XML bruto.\n2. **Não usar interior da unidade decorada** como se fosse o AT38302.\n3. Registro de incorporação não existe nos materiais recebidos → `[A CONFIRMAR]`.\n4. Rodapé obrigatório: `REF. AT38302 · CRECI-GO J-40518`.\n"}, {"arquivo": "01_redacao.md", "modulo": "03_revenda", "titulo": "Redator — AT38302 · Opus Gyro Vaca Brava Design", "texto": "# Redator — AT38302 · Opus Gyro Vaca Brava Design\nSetor Bueno, Goiânia · R$ 650.000 · 49 m² · 1 suíte · 1 vaga · 2 banheiros · **condomínio R$ 424** · IPTU R$ 1.000/ano\nTodos os números acima saem do XML, código AT38302, conferidos tag por tag no arquivo bruto. Nenhum outro número pode entrar nestes textos.\n\n> **Correção de 2026-11-17.** A versão anterior destes textos trazia condomínio R$ 1 e IPTU R$ 187. Errado: aqueles valores são do AT43159 (Sobrado Jardim Goiás). Conferido no XML bruto, o AT38302 tem `PropertyAdministrationFee` = 424 e `YearlyTax` = 1000. O parser está correto — auditei os 26 imóveis em 7 campos e não há divergência.\n\n**Travas que valem para as três legendas e os três stories:**\n- **Condomínio R$ 424 é o argumento central**, não uma trava. Piscina de raia, academia, sauna, pergolado e salão de festas por R$ 424 é a prova literal da tese: o tíquete de entrada dá acesso ao endereço e ao lazer.\n- Interior mostrado, rotulado (R08, 2026-11-18): toda legenda leva a linha \"Fotos de interior: unidade decorada, mesma tipologia.\" (a trava antiga, \"só áreas comuns\", foi revogada).\n- Rodapé/assinatura: `REF. AT38302 · CRECI-GO J-40518`.\n- Registro de incorporação: `[A CONFIRMAR]`.\n- **Nada de promessa de valorização, de aluguel fácil ou de revenda rápida.** O radar (`cerebro/02_radar_de_mercado.json`) mostra que o m² do Setor Bueno está em R$ 9.849 e subiu só 2,6% em 12 meses — a menor alta entre os bairros consagrados, porque eles já precificaram. O único dado de mercado liberado para esta peça é o de **escassez geográfica**: Bueno e Marista concentram **31,8%** de todos os imóveis à venda em Goiânia (Ademi-GO, 1S2026). Não usar os 105% de valorização em 5 anos: é número da cidade inteira, não do Bueno.\n- **Não publicar o R$/m² da unidade.** R$ 650.000 ÷ 49 m² = R$ 13.265/m², acima da média do bairro. É normal em unidade compacta com lazer pesado, mas a comparação engana nos dois sentidos.\n\n---\n\n## Legenda 1 — direta, para investidor\n\n> 49 m² no Setor Bueno por R$ 650 mil.\n>\n> O apartamento é compacto. O prédio não é.\n>\n> Piscina de raia no rooftop com a cidade inteira na frente. Academia envidraçada. Sauna. Pergolado com churrasqueira e salão de festas no mesmo andar.\n>\n> 1 suíte, 1 vaga, IPTU de R$ 1.000 no ano. E o condomínio: **R$ 424**. Com piscina de raia, academia, sauna e salão de festas no rooftop.\n>\n> E o endereço não é detalhe: Setor Bueno e Marista concentram **31,8% de todos os imóveis à venda em Goiânia** (Ademi-GO, 1º semestre de 2026). É onde o mercado da cidade acontece.\n>\n> Quer a planta e a posição do sol? Manda **GYRO** no Direct.\n>\n> Fotos de interior: unidade decorada, mesma tipologia.\n>\n> REF. AT38302 · CRECI-GO J-40518\n\n---\n\n## Legenda 2 — consultiva, para família e lifestyle\n\n> A pergunta que todo mundo faz quando vê 49 m²: cabe a minha vida aqui?\n>\n> Depende do que você chama de \"aqui\".\n>\n> Se for só o apartamento, são 49 m² com 1 suíte e 1 vaga. Resolvido, sem desperdício, fácil de manter.\n>\n> Se for o prédio, o seu domingo tem piscina de raia com vista para o Setor Bueno, pergolado com churrasqueira para receber e academia com janelão para a cidade. Você não precisa de 200 m² para ter isso. Precisa de um prédio que tenha.\n>\n> É essa a troca: menos metro quadrado privativo, muito mais metro quadrado de uso.\n>\n> E antes que você pergunte quanto custa manter tudo isso: o condomínio é de **R$ 424**.\n>\n> R$ 650 mil, no Vaca Brava.\n>\n> Quer ver a planta e a posição do sol? Manda **GYRO** no Direct.\n>\n> Fotos de interior: unidade decorada, mesma tipologia.\n>\n> REF. AT38302 · CRECI-GO J-40518\n\n---\n\n## Legenda 3 — curta, de impacto\n\n> R$ 650 mil.\n> 49 m².\n> Piscina de raia no rooftop.\n> Condomínio de R$ 424.\n>\n> Setor Bueno. É real.\n>\n> **GYRO** no Direct.\n>\n> Fotos de interior: unidade decorada, mesma tipologia.\n>\n> REF. AT38302 · CRECI-GO J-40518\n\n---\n\n## Stories — 3 telas de 60s\n\n### Story 1 · enquete\n**Visual:** foto `21_rooftop_piscina_panoramica` ocupando a tela inteira, véu escuro na metade de baixo. Badge `SETOR BUENO · GOIÂNIA` no topo esquerdo. Fio vermelho de 2px sob a pergunta.\n\n**Texto em tela:**\n> Quanto você acha que custa um apartamento NESTE prédio?\n\n**Enquete (sticker de duas opções):**\n- `Até R$ 650 mil`\n- `Mais de R$ 1 milhão`\n\n**Fala/legenda:** nenhuma. A enquete carrega sozinha.\n\n**Por quê:** a enquete não é pesquisa, é gancho. A maioria vai votar em \"mais de R$ 1 milhão\", o que transforma o Story 2 na revelação. E o voto já segmenta quem tem a faixa certa na cabeça.\n\n---\n\n### Story 2 · vídeo falado do corretor\n**Visual:** corretor em pé, enquadramento vertical do peito para cima, com a piscina do rooftop atrás. Se não houver captação, usar a foto `27_rooftop_raia_skyline` com lower-third preto e fio vermelho.\n\n**Roteiro falado — 22 a 28 segundos:**\n> \"Ontem eu perguntei quanto custa um apartamento aqui. A maioria chutou mais de um milhão.\n>\n> São seiscentos e cinquenta mil. Quarenta e nove metros, uma suíte, uma vaga.\n>\n> O apartamento é compacto, sim. Mas o que você compra é o endereço e é esse andar aqui, que é de todo mundo que mora no prédio: piscina de raia, academia com essa vista, sauna, pergolado com churrasqueira.\n>\n> E o condomínio disso tudo é quatrocentos e vinte e quatro reais.\n>\n> Endereço, aliás, não é detalhe: Setor Bueno e Marista concentram trinta e um vírgula oito por cento de todos os imóveis à venda em Goiânia. É aqui que o mercado da cidade acontece.\"\n\n**Texto fixo em tela:** `R$ 650.000 · 49 m² · 1 suíte · 1 vaga · COND. R$ 424`\n**Fonte na tela, no trecho dos 31,8%:** `ADEMI-GO · 1º SEMESTRE DE 2026`\n**Rodapé:** `REF. AT38302 · CRECI-GO J-40518`\n\n**Por quê:** o vídeo falado é o único momento da sequência com rosto. Ele existe para responder a objeção de metragem antes que ela seja escrita no Direct.\n\n---\n\n### Story 3 · chamada com palavra-chave\n**Visual:** fundo preto `#000000`, igual ao frame final do carrossel. Sem foto. Tipografia grande.\n\n**Texto em tela:**\n> Mando a simulação de retorno,\n> a planta e a posição do sol.\n>\n> Escreve **GYRO** aqui embaixo.\n\n**Sticker:** caixa de resposta/Direct com o texto `GYRO`.\n**Rodapé:** `REF. AT38302 · CRECI-GO J-40518 · Registro de incorporação [A CONFIRMAR]`\n\n**Por quê:** palavra-chave única e curta transforma o Direct em lista segmentada e dá ao corretor um gatilho de resposta automática. Fundo preto porque depois de duas telas de foto, o corte seco para o preto é o que faz o dedo parar na terceira.\n\n---\n\n## Shot list para a próxima captação — Opus Gyro\n\nPara o fotógrafo. Tudo em horizontal **e** vertical; o vertical é o que falta no acervo atual para o Reel.\n\n### Prioridade 1 — o que falta e trava peça\n| # | Plano | Por quê |\n|---|---|---|\n| 1 | **Unidade AT38302 pronta**, 5 ambientes: living, cozinha, suíte, banheiro, varanda | Hoje as únicas fotos da unidade no XML são da obra crua, com marca d'água. É o buraco que impede mostrar o apartamento |\n| 2 | Varanda da unidade com a linha de céu do Bueno, fim de tarde | Único plano que liga o apartamento ao endereço |\n| 3 | Rooftop no **golden hour** (as atuais são de dia nublado) | A luz atual achata a piscina. Com sol baixo, a raia vira o gancho visual do trimestre |\n| 4 | Rooftop no **azul da noite**, luzes acesas, cidade acesa | Não existe nenhuma foto noturna do prédio no acervo |\n| 5 | Fachada completa de baixo para cima, vertical | Não existe foto de fachada na pasta. Falta o plano de abertura do Reel |\n\n### Prioridade 2 — movimento para o Reel\n| # | Plano |\n|---|---|\n| 6 | Subida de elevador: porta fechando no térreo, abrindo no rooftop (plano fixo, 8s) |\n| 7 | Caminhada lenta pela raia da piscina, câmera na altura do peito, 12s contínuos |\n| 8 | Passagem do pergolado para o deck, revelando a cidade |\n| 9 | Academia: travelling lateral pelo janelão, equipamentos em primeiro plano |\n| 10 | Detalhe em close: água batendo na borda, palmeira contra o céu, textura do deck de madeira |\n\n### Prioridade 3 — humano\n| # | Plano |\n|---|---|\n| 11 | Corretor em pé no rooftop com a piscina atrás, vertical, espaço livre à direita para texto |\n| 12 | Corretor abrindo a porta da unidade, de costas, entrando |\n\n### Regras de captação\n- **Nada de marca d'água.** Entregar os originais da câmera.\n- Horizontal **e** vertical de cada ambiente. Metade do acervo atual só serve para carrossel.\n- Fim de tarde é obrigatório para rooftop e fachada. Meio-dia queima o céu e mata a vista.\n- Enquadrar deixando o terço superior limpo: é onde entram badge e headline.\n- Nenhum plano em que apareça placa, logo ou material de outra imobiliária.\n"}, {"arquivo": "reel_at38302_roteiro.md", "modulo": "03_revenda", "titulo": "Editor de vídeo — Reel AT38302 · Opus Gyro Vaca Brava Design", "texto": "# Editor de vídeo — Reel AT38302 · Opus Gyro Vaca Brava Design\n1080x1920 · 26 segundos · **sem trilha** (o corretor aplica áudio de trend no app) · versão `_com_bed.mp4` opcional só para a gravação da apresentação\n\n> **NÃO MONTADO.** A direção visual foi reprovada em 2026-11-17 e os lower-thirds mudam com ela. Este roteiro é o decupado e a ordem dos planos — sobrevive à mudança de layout. Montar quando o design system novo chegar.\n\n---\n\n## Material disponível\n\n**8 fotos verticais em resolução original**, sem marca d'água, em `acervo_drive/opus_gyro_at38302/vertical/`:\n\n| Arquivo | Ambiente |\n|---|---|\n| `v17_rooftop_espreguicadeiras` | Espreguiçadeiras na borda da piscina com o skyline |\n| `v20_rooftop_deck_skyline` | Deck e espreguiçadeiras, cidade ao fundo |\n| `v21_rooftop_pergolado_mesa` | Pergolado com mesa longa de madeira |\n| `v22_rooftop_lounge_sofas` | Lounge com sofás e a cidade |\n| `v24_rooftop_palmeira_piscina` | Palmeira ao centro da piscina |\n| `v27_rooftop_piscina_panoramica` | Piscina panorâmica com palmeiras e linha de céu |\n| `v29_academia_vista` | Academia laranja e amarela com janelão |\n| `v18_rooftop_salao_envidracado` | Salão envidraçado, vista 180° |\n\n**`Vídeo.mov` do Drive: NÃO BAIXOU.** A cota de download público do Google Drive estourou depois de ~50 arquivos (`Cannot retrieve the public link... or have had many accesses`). Três tentativas, duas horas de intervalo. Enquanto não baixar, o reel se monta **só com as fotos em Ken Burns**, que é suficiente: são 8 planos verticais de 8000px, então há margem de sobra para pan e zoom em 1080x1920 sem perder nitidez.\n\n---\n\n## Decupagem — 26s\n\n| # | t | Plano | Movimento | Texto em tela |\n|---|---|---|---|---|\n| 1 | 0,0 – 3,0s | `v27_rooftop_piscina_panoramica` | Zoom in lento 1.00 → 1.12, centro na água | **Gancho (entra em 0,3s):** `R$ 650 MIL` em Bodoni, e embaixo em Jost `SETOR BUENO · GOIÂNIA` |\n| 2 | 3,0 – 6,0s | `v24_rooftop_palmeira_piscina` | Pan vertical de cima para baixo, revelando a piscina | `49 m²` |\n| 3 | 6,0 – 9,0s | `v17_rooftop_espreguicadeiras` | Pan lateral esquerda → direita acompanhando a borda | `1 suíte · 1 vaga` |\n| 4 | 9,0 – 12,0s | `v20_rooftop_deck_skyline` | Zoom out 1.12 → 1.00, abrindo para a cidade | — (respiro visual) |\n| 5 | 12,0 – 15,0s | `v21_rooftop_pergolado_mesa` | Zoom in no eixo da mesa | `pergolado + churrasqueira` |\n| 6 | 15,0 – 18,0s | `v22_rooftop_lounge_sofas` | Pan lateral direita → esquerda | `lounge + salão de festas` |\n| 7 | 18,0 – 21,0s | `v29_academia_vista` | Zoom in lento no janelão | `academia com vista` |\n| 8 | 21,0 – 23,5s | `v18_rooftop_salao_envidracado` | Estático com leve drift | **`CONDOMÍNIO: R$ 424`** — o remate, em peso maior que os anteriores |\n| 9 | 23,5 – 26,0s | **Frame final** fundo `#000000` | Corte seco | Pergunta em Bodoni + `GYRO no Direct` + `REF. AT38302 · CRECI-GO J-40518` |\n\n**Cortes secos em todos os pontos.** Sem crossfade: o ritmo de 3s batido é o que segura o reel sem trilha.\n\n### Os 3 primeiros segundos\nO gancho é o plano 1 sozinho: piscina de raia cheia de tela com a linha de céu do Bueno, e `R$ 650 MIL` entrando em Bodoni grande sobre a água em 0,3s. O preço no primeiro frame é o gancho — a surpresa é o descompasso entre o número e a imagem, então o número tem que vir antes de qualquer coisa.\n\n### Lower-third\nFaixa preta na base, altura ~180px, fio vermelho de 2px no topo da faixa, texto em Jost. Badge `SETOR BUENO · GOIÂNIA` no topo esquerdo durante os 26 segundos inteiros. **Aguardando a nova direção para fechar as medidas.**\n\n---\n\n## Travas\n\n- **Nenhuma foto do interior da unidade decorada.** As 8 verticais acima são todas área comum do edifício.\n- **Condomínio R$ 424 é publicável e entra em tela** — conferido tag por tag no XML bruto (`PropertyAdministrationFee`). A versão anterior deste roteiro mandava não publicar porque eu tinha registrado R$ 1: aquele valor é do AT43159, não deste imóvel.\n- `R$ 650 MIL`, `49 m²`, `1 suíte`, `1 vaga`, `COND. R$ 424`, `IPTU R$ 1.000/ano` — todos do XML, código AT38302.\n- Sem logo grande: a peça tem que servir para o corretor postar no perfil dele.\n- Entrega final **sem trilha**. A `_com_bed.mp4` é só para a gravação da apresentação não sair muda.\n\n## Comando (quando a direção for liberada)\n\n```bash\nffmpeg -y -f lavfi -i color=c=black:s=1080x1920:d=26 ... # montagem Ken Burns por plano\n```\nO script de montagem ainda não foi escrito porque depende das medidas do lower-third novo.\n"}, {"arquivo": "shot_list_recaptacao.md", "modulo": "03_revenda", "titulo": "Shot list de recaptação — Sobrado Portal do Sol Green", "texto": "# Shot list de recaptação — Sobrado Portal do Sol Green\n**AT42341** · Rodovia GO-020, Fazenda Vau das Pombas, Goiânia · R$ 1.800.000\nCorretora responsável: Ludmila Dias · Gerado em 2026-11-18 pelo Analista de Acervo\n\n---\n\n## Por que esta shot list existe\n\nO acervo atual tem **42 fotos horizontais**. Abri todas em recorte 1080x1350 e **seis** estão em padrão de anúncio. As outras 36 mostram uma casa habitada e não preparada para fotografia. O imóvel é bom; o material não acompanha.\n\nIsso não é crítica ao fotógrafo — é diagnóstico de **preparação**. Quase tudo que reprovei se resolve antes do clique, não depois.\n\nComparação direta da carteira, para a diretoria dimensionar: o Opus Gyro entregou 29 fotos aproveitáveis em 29; o Aldeia do Vale, 38 em 38; o Ravenallas, cerca de 30 em 47. Portal do Sol Green: **6 em 42**.\n\n---\n\n## O que reprovei, e por quê\n\n| # | O que aparece | Problema |\n|---|---|---|\n| 1 | Piscina com **capa de lona azul** esticada por cima | A piscina é um dos ativos da casa e não aparece. Duas fotos perdidas. |\n| 2 | **Três closets lotados** de roupa pendurada, caixas de papelão, bolsas | Mostra o volume de pertences do morador, não o armário. Cinco fotos perdidas. |\n| 3 | **Escritório** com papelada, impressora, cabos soltos na mesa | Ambiente legítimo da casa, irreconhecível como escritório. Duas fotos. |\n| 4 | **Área de serviço** com máquina de lavar, ração, vasilha de pet, varal | Três fotos. |\n| 5 | **Banheiros** com shampoo, sabonete líquido e escova à mostra | Três fotos. |\n| 6 | **Quarto infantil** com prateleiras de skate e objetos pessoais | Identifica morador. Duas fotos. |\n| 7 | **Corredor lateral** com grama seca, mangueira enrolada e baldes | Duas fotos. |\n| 8 | **Muro de reboco** ocupando o quadro inteiro | Não é ambiente. Duas fotos. |\n| 9 | **Cozinha** com panela preta esquecida no cooktop e pano no puxador | Uma foto — era a capa que eu tinha escolhido antes de conferir. |\n| 10 | **Quartos** com colchão sem roupa de cama | Lê como casa desocupada em obra. Três fotos. |\n\n---\n\n## Antes do fotógrafo chegar — checklist para a corretora\n\nSem isto, a recaptação repete o problema.\n\n1. **Retirar a capa da piscina** e ligar a bomba na véspera, para a água ficar limpa e sem folha.\n2. **Esvaziar os três closets**, ou fechar as portas e fotografar fechados. Nada de arara e caixa no quadro.\n3. **Fazer a cama de todas as suítes** com roupa de cama lisa e clara. Travesseiros alinhados.\n4. **Limpar as bancadas**: cozinha, banheiros, área gourmet. Zero produto de higiene, zero panela, zero pano.\n5. **Tirar a máquina de lavar** do enquadramento ou fechar a porta da área de serviço.\n6. **Recolher mangueira, baldes e vasilha de pet** do corredor lateral.\n7. **Molhar o gramado** três dias antes. A grama lateral está seca nas fotos atuais.\n8. **Tirar os carros da garagem**, ou posicioná-los com a placa fora do quadro. Na fachada atual a placa estava legível e precisei borrar.\n9. Guardar objetos pessoais com nome, foto de família, documento e papelada.\n\n---\n\n## Os planos, em ordem de prioridade\n\n### Prioridade 1 — o que falta e trava a peça (8 planos)\n\n| # | Plano | Horário | Por quê |\n|---|---|---|---|\n| 1 | **Piscina sem a lona**, do nível do deck, com a casa ao fundo | Fim de tarde | É o ativo que não aparece em nenhuma foto. Candidato a capa. |\n| 2 | **Piscina do segundo pavimento ou do terraço**, olhando para baixo | Fim de tarde | Dá a implantação do lote |\n| 3 | **Suíte principal** arrumada, com a varanda ao fundo | Manhã | A descrição diz \"uma com varanda\" e isso não está em nenhuma foto |\n| 4 | **As outras três suítes**, uma foto cada, arrumadas | Manhã | Hoje são colchões sem roupa de cama |\n| 5 | **Terraço do piso superior** | Fim de tarde | Citado na descrição, não existe no acervo |\n| 6 | **Escritório** limpo, com a mesa vazia | Manhã | Idem |\n| 7 | **Fachada ao entardecer**, luzes internas acesas, sem carro | 18h–18h30 | A fachada atual é de meio-dia, com sombra dura e dois carros |\n| 8 | **Área gourmet** com a mesa posta e a piscina aberta ao fundo | Fim de tarde | Hoje tem panela no cooktop |\n\n### Prioridade 2 — reforço do social (5 planos)\n\n| # | Plano |\n|---|---|\n| 9 | Sala ampla em plano aberto, do canto oposto, com a luz entrando pelo janelão |\n| 10 | Cozinha integrada mostrando o louceiro, bancadas vazias |\n| 11 | Hall de entrada com a porta de madeira, de dentro para fora |\n| 12 | Lavabo, bancada vazia |\n| 13 | Banho de piscina e escaninho — citados na descrição e ausentes do acervo |\n\n### Prioridade 3 — vertical para reel (4 planos)\n\n| # | Plano |\n|---|---|\n| 14 | Caminhada da porta de entrada até a área gourmet, plano contínuo, 12 s |\n| 15 | Subida da escada para o piso superior, 8 s |\n| 16 | Panorâmica da piscina a partir do terraço, 10 s |\n| 17 | Fachada de baixo para cima ao entardecer, vertical |\n\n---\n\n## Regras de captação\n\n- **Horizontal e vertical de cada ambiente.** O acervo atual tem vertical, mas nenhuma do terraço nem da piscina aberta.\n- **Entregar o original da câmera**, sem marca d'água e sem redimensionar.\n- **Fim de tarde é obrigatório** para piscina, gourmet, terraço e fachada. Meio-dia queima o céu e endurece a sombra.\n- **Nenhuma placa de carro legível** no quadro.\n- Enquadrar deixando o terço superior limpo: é onde entram o logo e o nome na capa.\n\n---\n\n## O que isso custa e o que devolve\n\nUma captação de meio período cobre os 8 planos de prioridade 1 e os 5 de prioridade 2. Com isso o Portal do Sol Green sai de **6 fotos publicáveis para cerca de 19**, e passa a ter capa própria — hoje a capa é a fachada porque a piscina está debaixo de uma lona.\n\n**O que precisa da diretoria:** liberar a captação e combinar com a corretora Ludmila Dias a preparação da casa na véspera. A preparação é o que decide o resultado; sem ela o fotógrafo volta com o mesmo acervo.\n"}, {"arquivo": "01_analise_ora_vaca_brava.md", "modulo": "04_lancamento", "titulo": "Óra Vaca Brava — análise do empreendimento, da incorporadora e do ângulo escolhido", "texto": "# Óra Vaca Brava — análise do empreendimento, da incorporadora e do ângulo escolhido\n\n**Agente:** DIRETOR DE ARTE (Divisão de Produção) · módulo 4.1\n**Data:** 2026-11-17\n**Fontes primárias lidas na íntegra:** `BOOK_DIGITAL_ORA_VF_B.pdf` (55 pág.), `Memorial Descritivo - T30_R00 _V2.pdf` (27 pág.), `Avolli - Apresentacao Imobiliarias Pos Meeting.pdf` (46 pág.), `PASTA DE PLANTAS V3.pdf`, 9 PNGs de `5 - Simuladores`, 7 peças do `1 - Midia Kit Corretor`.\n**Fontes de mercado:** `cerebro/02_radar_de_mercado.json` (Sessão A, 2026-11-17).\n**Regra aplicada:** nenhum número abaixo sem origem rastreável. Onde o material oficial se contradiz, as duas versões estão registradas.\n\n---\n\n## 1. O ativo, em números verificados\n\nTudo nesta seção vem da **ficha técnica do book (pág. 53)** e do **memorial descritivo (REV00, itens 1 e 2)**, que concordam entre si.\n\n| Fato | Valor | Onde está |\n|---|---|---|\n| Endereço | Rua T-30, Quadra 107, Lotes 13/15, **Setor Bueno**, Goiânia–GO | Book pág. 53 · Memorial item 1 |\n| Área do terreno | 2.250,00 m² | Book pág. 53 · Memorial item 1 |\n| Área construída | 30.877,32 m² | Book pág. 53 |\n| Torre | 01 torre de uso misto · Subsolo + Térreo + 44 pavimentos | Book pág. 53 · Memorial item 2 |\n| Altura total | 133,075 m | Book pág. 53 |\n| Unidades | **424** — 122 salas comerciais + 302 apartamentos (198 de 1Q + 104 de 2Q) | Book pág. 53 · Memorial item 2 |\n| Vagas | 209 cobertas p/ carro + 17 de moto + 04 externas descobertas | Book pág. 53 · Memorial item 2.16 |\n| Elevadores | 07 — 03 sociais residenciais, 03 comerciais panorâmicos, 01 de emergência | Book pág. 53 |\n| Escaninhos | 08, no subsolo | Book pág. 53 |\n| Incorporação e realização | Ávolli Incorporadora **e** Bild Desenvolvimento Imobiliário | Book pág. 53 |\n| Construção | Ávolli Construtora | Book pág. 53 |\n| Vendas | Ávolli Incorporadora | Book pág. 53 |\n| Arquitetura | Architects Office \\| AO (Greg Bousquet) | Book pág. 7 · Apres. pág. 13 |\n| Interiores e decoração | Jayme Bernardo Arquitetos | Book pág. 7 e 53 |\n| Paisagismo | Daniel Dillenburg | Book pág. 53 |\n| **Alvará de Construção** | **nº 45.753, expedido em 10 de outubro de 2026**, Prefeitura Municipal de Goiânia | Book pág. 55 (rodapé legal) |\n\n### Distribuição vertical (memorial, itens 2.1 a 2.15)\n```\nPav. 42–44  Ático, barriletes e reservatórios\nPav. 41     LAZER 03 — rooftop: salão de eventos, sky bar, sport bar,\n            02 clubhouses (cada um com piscina privativa + churrasqueira a carvão),\n            brinquedoteca, playground\nPav. 28–40  ÓRA HOME — 08 apartamentos/andar, 2 suítes\nPav. 12–27  ÓRA STAY — 12 apartamentos/andar, 1 suíte\nPav. 11     LAZER 02 — coworking (2 salas privativas + 2 de reunião) + 06 apartamentos\nPav. 10     LAZER 01 — academia Reebok, tatame de lutas, sala multiuso, spa,\n            piscina climatizada com raia de 25 m e prainha\nPav. 03–09  ÓRA OFFICE PARK — 18 salas/andar (16 nos pav. 06 e 07)\nPav. 01–02  Mezaninos de garagem · Pav. 02 tem lavanderia compartilhada + mini market\nTérreo      Lobby, café, fachada ativa, locker, delivery, porte-cochère, valet\nSubsolo     Garagem privativa (vagas à venda) + 08 escaninhos\n```\n\n### Tipologias — três fontes, três recortes\nO material oficial publica **três faixas diferentes** para o Office Park. Não é erro de leitura: são recortes distintos.\n\n| Produto | Faixa de marketing (book pág. 9) | Faixa da ficha técnica (book pág. 53) | Áreas reais do pavimento tipo (apres. pág. 27) |\n|---|---|---|---|\n| ÓRA OFFICE PARK | 27 a 48 m² | 27,10 a 63,62 m² | 27,10 · 27,11 · 27,32 · 27,47 · 28,89 · 37,05 · 38,47 · 43,74 · 45,73 m² |\n| ÓRA STAY (1Q) | 31 a 33 m² | 31,58 a 33,56 m² | 31,58 · 32,25 · 33,56 m² |\n| ÓRA HOME (2Q) | 52 a 60 m² · gardens 71 a 75 m² | 55,18 a 80,80 m² | 51,89 · 53,18 · 56,84 · 60,46 · 60,49 m² |\n\n**Leitura:** a faixa larga da ficha técnica (até 63,62 m² no comercial, até 80,80 m² no 2Q) inclui o 3º pavimento comercial, que tem salas maiores (a planta do book mostra a FINAL 08 com 63,56 m²), e os gardens/PH do 28º. A faixa de marketing só descreve o pavimento tipo. **Em peça, usar a área real da unidade citada, nunca a faixa.**\n\n### Divergências internas do material oficial — registradas, não corrigidas\n1. **Vagas por pavimento.** O resumo do book (pág. 54) diz 41 vagas no Térreo, 55 no Mezanino 01 e 60 no Mezanino 02. O memorial (itens 2.2, 2.3, 2.4) diz **43, 57 e 61**. O total de 209 + 17 + 04 bate nos dois. → *O memorial é o documento contratual; prevalece.*\n2. **Office Park: 63,62 m² (ficha técnica) vs. 63,56 m² (planta do 3º pav.).** Diferença de 6 cm². → *Usar 63,56 quando a referência for a planta.*\n3. **Ávolli em 10 estados (book pág. 2) vs. 11 estados (apres. pág. 2).** → *A apresentação é mais recente (nov/2026). Em peça, não usar nenhum dos dois sem conferir.*\n4. **Bild: \"mais de 14.000 unidades lançadas\" no texto corrido do book vs. \"+15 mil unidades lançadas\" no infográfico da mesma página.** → *Não usar.*\n5. **Simulador 2S:** a arte da Ávolli traz o título \"51,93 m²\" e o rodapé \"Unidade 4008 · 51 m²\". Pela tabela de pavimento tipo, a **4008 tem 51,89 m²**; quem tem 51,93 m² é a **2807**. → *Erro na arte deles. Corrigir na nossa.*\n6. **Simulador Office 27:** uma arte diz \"Unidade 916 · 27 m²\", outra \"Unidade 916 · 27,05 m²\", e a planta diz que a FINAL 16 tem **27,11 m²**. → *Mesmo caso.*\n\n---\n\n## 2. Os diferenciais que são de fato diferenciais\n\nSeparei o que é **atributo verificável no memorial** do que é **adjetivo de folheto**. Só a primeira coluna pode virar peça.\n\n### Verificável no memorial descritivo\n- **Piscina em balanço com raia de 25 m, climatizada, com prainha** (item 2.9). O balanço sobre a rua é o gesto arquitetônico mais forte do projeto e está no render `22_GPE_T30_EXTERNO_PISCINA01_EF_web.jpg`.\n- **Academia com marca internacional — a primeira Reebok de Goiânia** (book pág. 30). 250 m², com tatame de lutas e sala multibox (memorial 2.9). *A metragem de 250 m² está no book, não no memorial; é dado de folheto.*\n- **Spa com ofurô e banheira de imersão em água gelada**, hidromassagem climatizada, sauna seca, 02 salas de massagem, sala de estética (memorial 2.9). Recovery completo, não \"espaço zen\" genérico.\n- **Coworking de verdade:** 02 salas privativas + 02 salas de reunião, no 11º (memorial 2.10).\n- **Salas comerciais com WC privativo e laje técnica cada uma** (memorial 2.5 a 2.8). Isso é raro e é argumento duro para quem vai usar a sala, não especular com ela.\n- **Salas de reunião e de treinamento de uso comum** nos pav. 06 e 07 (memorial 2.7 e 2.8). Uma sala de 27 m² passa a ter acesso a sala de reunião sem pagar por ela.\n- **Fechadura eletrônica na entrada social de todos os apartamentos** (memorial 6.5).\n- **Infraestrutura completa de ar-condicionado** (dreno, carga elétrica, rede frigorígena) em todos os dormitórios e salas dos apartamentos **e em todas as salas comerciais** (book pág. 54, \"Instalações Especiais\").\n- **Gerador atende um ponto elétrico de cada unidade** — apartamento e sala comercial (book pág. 46, 51 e 25).\n- **Floreiras com irrigação automatizada**, cuja manutenção é do condomínio, não do morador (memorial 11.3).\n- **Lavanderia compartilhada e mini market** no Mezanino 02 (memorial 2.4).\n- **03 elevadores comerciais panorâmicos no átrio**, separados dos 03 sociais residenciais (book pág. 53).\n- **02 clubhouses no 41º, cada um com piscina privativa climatizada e churrasqueira a carvão** (memorial 2.14).\n\n### Adjetivo de folheto — não vira número em peça\n- \"1.800 m² dedicados ao lazer\" — o próprio book declara em letra miúda (pág. 26) que a metragem é **aproximada e corresponde ao somatório de áreas comuns distribuídas em diferentes pavimentos**. Não é um lazer de 1.800 m² contíguos. *Se usar, usar com a ressalva deles.*\n- \"Apenas 18 salas com vista para o Vaca Brava e para o átrio\" (book pág. 17) — não consta do memorial e não é verificável nas plantas que temos.\n- \"Espaço de convivência de 70 m² do Office Park\" (book pág. 19) — não consta do memorial.\n- Toda a página 3 da apresentação (Goiânia 2ª mais arborizada, 2º polo farmacêutico, PIB R$ 75,8 bi, 1º centro de IA do Centro-Oeste etc.) vem **sem fonte**. São afirmações da Ávolli. Se forem usadas, a atribuição é \"segundo a Ávolli\", nunca como fato de mercado.\n\n### O ponto frágil do argumento deles\nA apresentação (pág. 09) cravа **\"140% de evolução nominal do entorno, 2014 → 2025\"** e cita como fonte *ABRAINC / GeoBrain — Mercado Imobiliário Cidades Centro-Oeste, dados jan-set 2024 vs. jan-set 2023*. **A fonte citada cobre um ano; a afirmação cobre onze.** A nota de rodapé não sustenta o número que está acima dela. **Não usar esse 140% em nenhuma peça da Adão.**\n\n---\n\n## 3. A estratégia comercial da Ávolli, lida do material\n\n1. **Um endereço, três produtos, três públicos.** Stay (1Q, 31–33 m²) para locação por temporada e investidor de ticket menor; Home (2Q, 52–60 m²) para morador; Office Park (27–46 m²) para profissional liberal. A apresentação deixa a intenção explícita no Stay: *\"Projetos com identidade visual marcante ganham destaque na locação por temporada e reforçam o potencial de valorização do investimento\"* (book pág. 43). **O Stay é vendido como ativo de renda, não como moradia.**\n2. **O Office Park é o produto mais trabalhado.** Eles já produziram carrosséis segmentados para **público jurídico** (advogados) e **público saúde** — dois nichos de profissional liberal que compram sala. Isso diz onde eles esperam a velocidade de venda.\n3. **Eles estão atrás de capital em moeda estrangeira.** Quatro dos nove simuladores estão em **BRL / USD / EUR**, com cotação travada em 06/11/2026 (US$ 1 = R$ 5,4930 · € 1 = R$ 6,1400). Nenhuma outra incorporadora do Drive faz isso. Casa com a afirmação deles de que Goiânia é a 2ª maior receptora de migração interna. **É a brecha mais óbvia e menos explorada do material.**\n4. **A tabela é de pré-lançamento e eles sabem.** O rodapé do book declara: *\"A comercialização das unidades somente será iniciada após o registro do Memorial de Incorporação no Cartório de Registro de Imóveis competente.\"* O que existe hoje é o **Alvará de Construção nº 45.753 (10/10/2026)**. O registro de incorporação **não existe ainda** — e o material oficial diz isso com todas as letras.\n5. **O fluxo de pagamento é o produto.** Em todas as nove simulações, o financiamento bancário só entra em **jan/31**. Até lá, é pagamento direto com a incorporadora: ato + 3 parcelas + 47 mensais + 6 semestrais + 1 única. Isso é desenhado para um comprador que **não quer tomar crédito agora**.\n\n---\n\n## 4. Quem são Ávolli e Bild\n\n**Ávolli** (apres. pág. 2, dados autodeclarados, sem fonte externa): 14 anos de atuação, 250 obras entregues, 11 estados, 250 mil m² construídos, 500 colaboradores diretos e indiretos. Sociedade de três: André (comercial), Dário (engenharia), Max (financeiro). Landbank de 6 projetos, **todos em Goiânia**: Setor Oeste (15W22), **Bueno/Rua T-10 — este lançamento, nov/2026**, Jardim América (Rua C-239 e Rua C-237A), Bueno/Av. T-9 (Mall Oasis, com McDonald's e Smart Fit), Marista (Rua 1124). É uma incorporadora regional concentrada nos bairros nobres, não uma operação nacional.\n\n**Grupo Bild** (apres. pág. 11, **com fonte**: Ranking INTEC 2026): figura entre as **11 maiores construtoras do Brasil**. Nos últimos 3 anos: VGV de R$ 7,9 bi, +170 empreendimentos entregues, +255 lançados, 2.600 colaboradores, presença em 25 cidades, 70 canteiros ativos. Atuando desde 2007.\n\n**O que a parceria significa para o comprador:** a Ávolli conhece os bairros nobres de Goiânia e constrói; a Bild traz escala, balanço e um ranking de terceiro para mostrar. Para quem compra na planta, **risco de entrega** é a variável número um, e esse é o único atributo da dupla que importa de verdade na peça.\n\n---\n\n## 5. Cruzamento com o mercado (radar da Sessão A)\n\n| Referência | Valor | Fonte |\n|---|---|---|\n| Setor Bueno, preço médio de anúncio (usado pronto) | **R$ 9.849/m²** · +2,6% em 12 meses | FipeZAP out/2026 |\n| Recorte Bueno + Marista + Oeste + Jardim Goiás | **R$ 13.147/m²** | Ademi-GO |\n| Marista, teto observado | R$ 18 mil a R$ 19 mil/m² | Ademi-GO |\n| Goiânia, média geral | R$ 8.531/m² · +6,34% em 12 meses | FipeZAP out/2026 |\n| Bueno + Marista, parcela da oferta da cidade | **31,8%** | Ademi-GO |\n| Vendas residenciais Goiânia 1S26 | 7.219 un. · **+42% a/a** (Brasil: +5,4%) | Brain / Ademi-GO · CBIC |\n| Estoque disponível | **−6%** vs. fim de 2025; lançamentos 16,4% menores que no 2S25 | Brain / Ademi-GO |\n| Selic | **13,75% a.a.**, mantida em 04/11/2026 | BCB, série SGS 432 |\n| INCC-M | **+6,75% em 12 meses** (acima do IPCA de 4,63%) | FGV/IBRE |\n\n### O preço do Óra contra esse pano de fundo\nCalculado por mim a partir dos valores oficiais dos simuladores, dividido pela área real da unidade:\n\n| Unidade | Produto | Área | Valor total | **R$/m²** |\n|---|---|---|---|---|\n| 303 | Office | 27,11 m² | R$ 433.218 | 15.980 |\n| 916 | Office | 27,11 m² | R$ 441.351 | 16.280 |\n| 301 | Office | 37,05 m² | R$ 572.052 | 15.440 |\n| 918 | Office | 37,05 m² | R$ 583.167 | 15.740 |\n| 810 | Office | 43,74 m² | R$ 784.258 | 17.930 |\n| 1101 | Stay 1Q | 31,58 m² | R$ 450.441 | 14.263 |\n| 2704 | Stay 1Q | 32,25 m² | R$ 499.972 | 15.503 |\n| 2702 | Stay 1Q | 33,56 m² | R$ 503.517 | 15.003 |\n| 2807 | Home 2S | 51,93 m² | R$ 723.187 | 13.926 |\n| 4008 | Home 2S | 51,89 m² | R$ 739.501 | 14.251 |\n\n**Três leituras que saem daí e que ninguém está fazendo:**\n\n1. **O menor custa mais por metro.** A sala de 27 m² sai a R$ 15.980–16.280/m²; o apartamento de 2 suítes de 52 m² sai a R$ 13.926–14.251/m². O produto mais barato em valor absoluto é o mais caro por metro. Isso é regra de mercado, mas quase nunca é dito em público.\n2. **O Óra é precificado como produto novo de bairro nobre, não como Bueno.** *(Atenção à regra editorial R1 em `regras_editoriais.md`: os múltiplos abaixo descrevem **as 10 unidades simuladas**, não o lançamento. Em peça, ancorar numa unidade nomeada.)* Nessas 10, está entre **1,41x e 1,82x** o preço médio de anúncio do Setor Bueno (R$ 9.849/m², FipeZAP out/26) — mas apenas **1,06x a 1,36x** o recorte dos quatro bairros nobres da Ademi (R$ 13.147/m²), e **abaixo** do teto observado no Marista (R$ 18–19 mil). Comparar lançamento com anúncio de usado é comparação errada, e é exatamente a que o cliente faz sozinho no Zap. *Essa é a objeção que a peça precisa responder.*\n3. **O Bueno é o último colocado da régua, e abaixo da média da cidade.** Régua de 12 meses até out/2026 (FipeZAP): Jardim América +10,0% · Oeste +8,3% · Jardim Goiás +4,3% · Sul +4,1% · Marista +3,4% · **Bueno +2,6%**, contra **+6,34%** da média de Goiânia. E Bueno + Marista concentram 31,8% de toda a oferta da cidade (Ademi-GO). **Mas o que está sobrando no Bueno é usado.** O que a Ademi-GO atribui à escassez (via O Popular, jan/2025) é outra coisa: *mudanças nos Planos Diretores que restringiram manchas de adensamento em Bueno, Marista e Oeste*. Ou seja: há muito apartamento à venda no Bueno e pouca licença nova para construir nele.\n\n---\n\n## 6. O ângulo escolhido\n\n> ### Capa: \"Goiânia subiu 6,34% em um ano. O Setor Bueno subiu 2,6%.\"\n> ### Segunda linha: \"E é por isso que vale comprar no Bueno agora.\"\n\n**A capa carrega a régua junto com o número — obrigatório (regra R6).** Numa capa de carrossel só a primeira linha é lida de verdade. \"O Bueno subiu 2,6%\" sozinho faz o leitor assumir que 2,6% é bom, e a peça mente por omissão mesmo com o corpo correto.
